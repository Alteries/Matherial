/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> | | Direct proportion | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>=<\/mo><mfrac><mi>p<\/mi><mi>q<\/mi><\/mfrac><mo>⇔<\/mo><mi>a<\/mi><mi>q<\/mi><mo>=<\/mo><mi>b<\/mi><mi>p<\/mi><\/mrow><\/semantics><\/math> | | Inverse proportion | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>=<\/mo><mfrac><mi>q<\/mi><mi>p<\/mi><\/mfrac><mo>⇔<\/mo><mi>a<\/mi><mi>p<\/mi><mo>=<\/mo><mi>b<\/mi><mi>q<\/mi><\/mrow><\/semantics><\/math> | | Arithmetic sequence | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mi>a<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>b<\/mi><\/mrow><\/semantics><\/math> | | Geometric sequence | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mi>a<\/mi><mo>×<\/mo><msup><mi>r<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/msup><\/mrow><\/semantics><\/math> | | Arithmetic series | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mfrac><mi>n<\/mi><mn>2<\/mn><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>a<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> | | Triangular numbers | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mn>2<\/mn><\/mfrac><\/mrow><\/semantics><\/math> |<\/p>\n<p><strong>Geometry<\/strong> | Concept | Formula | |—|—| | Pythagorean theorem | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> | | Circle circumference | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mo>=<\/mo><mn>2<\/mn><mi>π<\/mi><mi>r<\/mi><\/mrow><\/semantics><\/math> | | Circle area | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> | | Cylinder volume | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mo>=<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>t<\/mi><\/mrow><\/semantics><\/math> | | Cone volume | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>t<\/mi><\/mrow><\/semantics><\/math> | | Sphere volume | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mo>=<\/mo><mfrac><mn>4<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mi>r<\/mi><mn>3<\/mn><\/msup><\/mrow><\/semantics><\/math> | | Cone:Sphere:Cylinder ratio | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>:<\/mo><mn>2<\/mn><mo>:<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> (same <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r<\/mi><\/semantics><\/math>, same <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t<\/mi><\/semantics><\/math>) | | Rhombus/Kite area | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><msub><mi>d<\/mi><mn>1<\/mn><\/msub><msub><mi>d<\/mi><mn>2<\/mn><\/msub><\/mrow><\/semantics><\/math> | | Regular polygon area | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><mi>K<\/mi><mo>×<\/mo><mtext mathvariant=\"normal\">Apothem<\/mtext><\/mrow><\/semantics><\/math> |<\/p>\n<p><strong>Data &amp; Probability<\/strong> | Concept | Formula | |—|—| | Mean | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mo>=<\/mo><mfrac><mrow><mo>∑<\/mo><mi>x<\/mi><\/mrow><mi>n<\/mi><\/mfrac><\/mrow><\/semantics><\/math> | | Combined mean | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mrow><mi>c<\/mi><mi>o<\/mi><mi>m<\/mi><mi>b<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>1<\/mn><\/msub><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>2<\/mn><\/msub><msub><mi>n<\/mi><mn>2<\/mn><\/msub><\/mrow><mrow><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>n<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow><\/semantics><\/math> | | IQR | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q<\/mi><mn>3<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/semantics><\/math> | | Quartile deviation | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q<\/mi><mi>d<\/mi><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msub><mi>Q<\/mi><mn>3<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> | | Theoretical probability | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow><\/semantics><\/math> | | Relative frequency | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F<\/mi><mi>r<\/mi><\/msub><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>P<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow><\/semantics><\/math> | | Complementary event | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>A<\/mi><mi>c<\/mi><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> | | Expected frequency | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F<\/mi><mi>h<\/mi><\/msub><mo>=<\/mo><mi>n<\/mi><mo>×<\/mo><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> | | Multi-stage sample space | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>×<\/mo><msub><mi>n<\/mi><mn>2<\/mn><\/msub><mo>×<\/mo><mi>…<\/mi><mo>×<\/mo><msub><mi>n<\/mi><mi>k<\/mi><\/msub><\/mrow><\/semantics><\/math> |<\/p>\n","text":"(One page, organized by domain, for final review before the exam.) Number | Concept | Formula | |—|—| | Absolute value | | n | = distance from 0 | | Scientific notation | a × 10 n , 0 < a < 10 | | Fraction addition/subtraction | a b ± c d = a d ± b c b d | | Fraction multiplication/division | a b × c d = a c b d ; a b ÷ c d = a d b c | Algebra | Concept | Formula | |—|—| | Slope | m = y 2 − y 1 x 2 − x 1 | | Quadratic factoring (a=1) | find two numbers that multiply to c , add to b | | Difference of squares | a 2 − b 2 = ( a − b ) ( a + b ) | | Perfect square trinomial | a 2 + 2 a b + b 2 = ( a + b ) 2 | | Direct proportion | a b = p q ⇔ a q = b p | | Inverse proportion | a b = q p ⇔ a p = b q | | Arithmetic sequence | U n = a + ( n − 1 ) b | | Geometric sequence | U n = a × r ( n − 1 ) | | Arithmetic series | S n = n 2 ( 2 a + ( n − 1 ) b ) | | Triangular numbers | U n = n ( n + 1 ) 2 | Geometry | Concept | Formula | |—|—| | Pythagorean theorem | a 2 + b 2 = c 2 | | Circle circumference | C = 2 π r | | Circle area | A = π r 2 | | Cylinder volume | V = π r 2 t | | Cone volume | V = 1 3 π r 2 t | | Sphere volume | V = 4 3 π r 3 | | Cone:Sphere:Cylinder ratio | 1 : 2 : 3 (same r , same t ) | | Rhombus/Kite area | A = 1 2 d 1 d 2 | | Regular polygon area | A = 1 2 × K × Apothem | Data & Probability | Concept | Formula | |—|—| | Mean | x ‾ = ∑ x n | | Combined mean | x ‾ c o m b = x ‾ 1 n 1 + x ‾ 2 n 2 n 1 + n 2 | | IQR | Q 3 − Q 1 | | Quartile deviation | Q d = 1 2 ( Q 3 − Q 1 ) | | Theoretical probability | P ( A ) = n ( A ) n ( S ) | | Relative frequency | F r ( A ) = n ( A ) n ( P ) | | Complementary event | P ( A c ) = 1 − P ( A ) | | Expected frequency | F h = n × P ( A ) | | Multi-stage sample space | n ( S ) = n 1 × n 2 × … × n k |","min":3,"ex":false},{"id":"tka-c6-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Arithmetic series sum Sₙ = ? a² + 2ab + b² = ? Combined mean formula? P(Aᶜ) = ? Inverse proportion relation?","min":3,"ex":false,"quiz":true}]},{"id":"tka-c7","title":"Mixed Practice — TKA-Style Cross-Topic Problems","raw":"F. Mixed Practice — TKA-Style Cross-Topic Problems","sections":[{"id":"tka-c7-s0","title":"Mixed Practice — TKA-Style Cross-Topic Problems","html":"\n<p><em>The real TKA rarely stays inside one chapter. These five problems are intentionally built to blend multiple domains — exactly the skill this final section exists to build.<\/em><\/p>\n<p><strong>Problem 1 (Number + Algebra):<\/strong><\/p>\n<blockquote>\n<p>A store’s daily profit (in thousands of rupiah) follows an arithmetic sequence: Day 1 = −20 (a loss, due to opening costs), and profit increases by a constant Rp15.000 each day. On what day does the store’s profit first become positive?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mi>a<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>b<\/mi><mo>=<\/mo><mo>−<\/mo><mn>20<\/mn><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> 2. We want <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>20<\/mn><mo>+<\/mo><mn>15<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>&gt;<\/mo><mn>0<\/mn><mo>⇒<\/mo><mn>15<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>&gt;<\/mo><mn>20<\/mn><mo>⇒<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo>&gt;<\/mo><mn>1.33<\/mn><mo>⇒<\/mo><mi>n<\/mi><mo>&gt;<\/mo><mn>2.33<\/mn><\/mrow><\/semantics><\/math> 3. Round up to the next whole day: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> Day <strong>3<\/strong> is the first day with positive profit.<\/p>\n<p><strong>Problem 2 (Geometry + Similarity):<\/strong><\/p>\n<blockquote>\n<p>A ladder (hypotenuse) leans against a wall, reaching a height of 12 m, with its base 5 m from the wall. A smaller, similar ladder setup has a base of only 2 m. How tall does the smaller ladder reach?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Original ladder length (Pythagorean theorem): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><msup><mn>12<\/mn><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mn>5<\/mn><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>=<\/mo><msqrt><mn>169<\/mn><\/msqrt><mo>=<\/mo><mn>13<\/mn><\/mrow><\/semantics><\/math> 2. Scale factor (base ratio): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>2<\/mn><mn>5<\/mn><\/mfrac><\/semantics><\/math> 3. Smaller ladder’s height: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>×<\/mo><mfrac><mn>2<\/mn><mn>5<\/mn><\/mfrac><mo>=<\/mo><mn>4.8<\/mn><\/mrow><\/semantics><\/math> m<\/p>\n<p><strong>Answer:<\/strong> The smaller ladder reaches <strong>4.8 m<\/strong> high.<\/p>\n<p><strong>Problem 3 (Data + Probability):<\/strong><\/p>\n<blockquote>\n<p>A class of 40 students has a combined mean score of 75. If 25 of those students (Group A) averaged 70, what did the remaining 15 students (Group B) average?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mrow><mi>c<\/mi><mi>o<\/mi><mi>m<\/mi><mi>b<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>1<\/mn><\/msub><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>2<\/mn><\/msub><msub><mi>n<\/mi><mn>2<\/mn><\/msub><\/mrow><mrow><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>n<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><mo>⇒<\/mo><mn>75<\/mn><mo>=<\/mo><mfrac><mrow><mn>70<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>25<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>2<\/mn><\/msub><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mn>40<\/mn><\/mfrac><\/mrow><\/semantics><\/math> 2. Multiply both sides by 40: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3000<\/mn><mo>=<\/mo><mn>1750<\/mn><mo>+<\/mo><mn>15<\/mn><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>2<\/mn><\/msub><\/mrow><\/semantics><\/math> 3. Solve: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15<\/mn><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>2<\/mn><\/msub><mo>=<\/mo><mn>1250<\/mn><mo>⇒<\/mo><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>2<\/mn><\/msub><mo>≈<\/mo><mn>83.33<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> Group B averaged approximately <strong>83.3<\/strong>.<\/p>\n<p><strong>Problem 4 (Algebra + Social Arithmetics):<\/strong><\/p>\n<blockquote>\n<p>An investment grows using compound-style geometric growth: it starts at Rp1.000.000 and grows by a constant ratio of 1.1 (10% growth) each year. Using the geometric sequence formula, find its value after 4 years.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mi>a<\/mi><mo>×<\/mo><msup><mi>r<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/msup><\/mrow><\/semantics><\/math>. Careful: “after 4 years” means the 5th term if <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math>=year 0’s value — but here it’s cleaner to treat <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mn>1.000<\/mn><mn>.000<\/mn><\/mrow><\/semantics><\/math> as the year-0 value and apply the ratio <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math> times directly: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.000<\/mn><mn>.000<\/mn><mo>×<\/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1.1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>4<\/mn><\/msup><mo>≈<\/mo><mn>1.464<\/mn><mn>.100<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> After 4 years, the investment is worth approximately <strong>Rp1.464.100<\/strong>.<\/p>\n<p><strong>Problem 5 (Geometry + Circle + Ratio):<\/strong><\/p>\n<blockquote>\n<p>A circular pizza has a radius of 12 cm and is cut into a sector with a central angle of 60°. A similar (smaller) pizza has half the radius. What is the ratio of the two sectors’ areas?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Since both sectors use the <em>same<\/em> central angle (60°) and are similar shapes, the area ratio depends only on the radius ratio, squared (same principle as Section C.3, Example 3): radius ratio = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math>, so area ratio = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>:<\/mo><msup><mn>1<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mn>4<\/mn><mo>:<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math> 2. <em>(No need to compute the actual sector areas — recognizing the squared-ratio shortcut is the actual skill being tested.)<\/em><\/p>\n<p><strong>Answer:<\/strong> The larger sector’s area is <strong>4 times<\/strong> the smaller one’s.<\/p>\n","text":"The real TKA rarely stays inside one chapter. These five problems are intentionally built to blend multiple domains — exactly the skill this final section exists to build. Problem 1 (Number + Algebra): A store’s daily profit (in thousands of rupiah) follows an arithmetic sequence: Day 1 = −20 (a loss, due to opening costs), and profit increases by a constant Rp15.000 each day. On what day does the store’s profit first become positive? Solution: 1. U n = a + ( n − 1 ) b = − 20 + ( n − 1 ) ( 15 ) 2. We want U n > 0 : − 20 + 15 ( n − 1 ) > 0 ⇒ 15 ( n − 1 ) > 20 ⇒ n − 1 > 1.33 ⇒ n > 2.33 3. Round up to the next whole day: n = 3 Answer: Day 3 is the first day with positive profit. Problem 2 (Geometry + Similarity): A ladder (hypotenuse) leans against a wall, reaching a height of 12 m, with its base 5 m from the wall. A smaller, similar ladder setup has a base of only 2 m. How tall does the smaller ladder reach? Solution: 1. Original ladder length (Pythagorean theorem): 12 2 + 5 2 = 169 = 13 2. Scale factor (base ratio): 2 5 3. Smaller ladder’s height: 12 × 2 5 = 4.8 m Answer: The smaller ladder reaches 4.8 m high. Problem 3 (Data + Probability): A class of 40 students has a combined mean score of 75. If 25 of those students (Group A) averaged 70, what did the remaining 15 students (Group B) average? Solution: 1. x ‾ c o m b = x ‾ 1 n 1 + x ‾ 2 n 2 n 1 + n 2 ⇒ 75 = 70 ( 25 ) + x ‾ 2 ( 15 ) 40 2. Multiply both sides by 40: 3000 = 1750 + 15 x ‾ 2 3. Solve: 15 x ‾ 2 = 1250 ⇒ x ‾ 2 ≈ 83.33 Answer: Group B averaged approximately 83.3 . Problem 4 (Algebra + Social Arithmetics): An investment grows using compound-style geometric growth: it starts at Rp1.000.000 and grows by a constant ratio of 1.1 (10% growth) each year. Using the geometric sequence formula, find its value after 4 years. Solution: U n = a × r ( n − 1 ) . Careful: “after 4 years” means the 5th term if a =year 0’s value — but here it’s cleaner to treat a = 1.000 .000 as the year-0 value and apply the ratio n = 4 times directly: 1.000 .000 × ( 1.1 ) 4 ≈ 1.464 .100 Answer: After 4 years, the investment is worth approximately Rp1.464.100 . Problem 5 (Geometry + Circle + Ratio): A circular pizza has a radius of 12 cm and is cut into a sector with a central angle of 60°. A similar (smaller) pizza has half the radius. What is the ratio of the two sectors’ areas? Solution: 1. Since both sectors use the same central angle (60°) and are similar shapes, the area ratio depends only on the radius ratio, squared (same principle as Section C.3, Example 3): radius ratio = 2 : 1 , so area ratio = 2 2 : 1 2 = 4 : 1 2. (No need to compute the actual sector areas — recognizing the squared-ratio shortcut is the actual skill being tested.) Answer: The larger sector’s area is 4 times the smaller one’s.","min":3,"ex":true},{"id":"tka-c7-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Profit starts at −20 and rises by 15 each day. First positive day? A ladder reaches 12 m with base 5 m. A similar setup has base 2 m. Height? 40 students: mean 75. 25 of them average 70. The other 15 average… Two similar sectors with radius ratio 2:1. Area ratio? Rp1.000.000 grows 10% per year. Value after 4 years?","min":3,"ex":false,"quiz":true}]},{"id":"tka-c8","title":"Catatan Penutup untuk Belajar Jangka Panjang","raw":"Catatan Penutup untuk Belajar Jangka Panjang","sections":[{"id":"tka-c8-s0","title":"Catatan Penutup untuk Belajar Jangka Panjang","html":"\n<p>Modul ini paling efektif kalau dipakai dengan cara berikut, bukan sekadar dibaca sekali dari atas ke bawah:<\/p>\n<ol type=\"1\">\n<li><strong>Tutup solusi, coba kerjakan ulang<\/strong> worked example yang sudah pernah dibaca 2–3 hari sebelumnya — ini jauh lebih efektif untuk daya ingat jangka panjang dibanding membaca ulang pasif.<\/li>\n<li><strong>Kunjungi ulang Common Mistakes Box<\/strong> sebelum ujian — kesalahan yang sama cenderung berulang kalau tidak disadari secara eksplisit.<\/li>\n<li><strong>Pakai Master Formula Cheat Sheet (Bagian E)<\/strong> sebagai “peta,” bukan pengganti pemahaman — kalau ada rumus yang tidak langsung Anda pahami <em>kenapa<\/em> rumusnya begitu, kembali ke section aslinya.<\/li>\n<li><strong>Kerjakan Mixed Practice (Bagian F) paling akhir<\/strong>, setelah semua topik individual sudah mantap — itulah gunanya latihan itu ada: melatih otak “meloncat” antar topik seperti soal TKA sesungguhnya.<\/li>\n<\/ol>\n<p><em>[End of TKA Exam Prep. Modul inti (Grade 7, 8, 9, TKA) sudah lengkap.]<\/em><\/p>\n","text":"Modul ini paling efektif kalau dipakai dengan cara berikut, bukan sekadar dibaca sekali dari atas ke bawah: Tutup solusi, coba kerjakan ulang worked example yang sudah pernah dibaca 2–3 hari sebelumnya — ini jauh lebih efektif untuk daya ingat jangka panjang dibanding membaca ulang pasif. Kunjungi ulang Common Mistakes Box sebelum ujian — kesalahan yang sama cenderung berulang kalau tidak disadari secara eksplisit. Pakai Master Formula Cheat Sheet (Bagian E) sebagai “peta,” bukan pengganti pemahaman — kalau ada rumus yang tidak langsung Anda pahami kenapa rumusnya begitu, kembali ke section aslinya. Kerjakan Mixed Practice (Bagian F) paling akhir , setelah semua topik individual sudah mantap — itulah gunanya latihan itu ada: melatih otak “meloncat” antar topik seperti soal TKA sesungguhnya. [End of TKA Exam Prep. Modul inti (Grade 7, 8, 9, TKA) sudah lengkap.]","min":2,"ex":false}]}]}]</script>
<script id="quizdata" type="application/json">{"7-c1":[["Which statement is true?",["−2 > −5","−10 > −3","−5 > 1","−7 > 0"],0,"On the number line, right is bigger, so −2 is right of −5."],["(−8) + 5 = ?",["3","−3","−13","13"],1,"Different signs: 8−5=3, and −8 is stronger, so −3."],["−8 − (−15) = ?",["−23","−7","7","23"],2,"Keep-Change-Change: −8 + 15 = 7."],["The absolute value of −5 is…",["−5","5","0","1/5"],1,"It is the distance from 0, and distance is never negative."],["In (−3)×2, (−3)×1, (−3)×0, the answers rise by 3 each step. What is (−3)×(−1)?",["−3","0","6","3"],3,"The pattern continues upward, so negative × negative = positive."],["(−45) ÷ (−9) = ?",["−5","5","9","−9"],1,"Same signs give a positive result."]],"7-c2":[["A class has 12 boys and 18 girls. Ratio of boys to girls in simplest form?",["12:18","3:2","2:3","6:1"],2,"GCD is 6, so 12:18 = 2:3."],["8 apples and 20 mangoes. Ratio of mangoes to apples, simplified?",["2:5","5:2","8:20","20:28"],1,"Mangoes come first: 20:8 = 5:2."],["Concentrate and water are mixed 2:7 to make 900 ml. How much concentrate?",["100 ml","200 ml","700 ml","450 ml"],1,"9 parts, 100 ml each, so 2 parts = 200 ml."],["In a ratio 2:5, the first quantity is what fraction of the whole?",["2/5","5/2","2/7","5/7"],2,"The whole has 2+5 = 7 parts."]],"7-c3":[["In the term 3x, the number 3 is called the…",["variable","constant","coefficient","operator"],2,"A coefficient multiplies the variable."],["Simplify 7x + 3x − 2y + 5y.",["10x + 3y","10x + 7y","13xy","10x − 3y"],0,"Combine like terms: x-terms with x-terms, y with y."],["Solve 3x + 4 = 19.",["5","7","15","23/3"],0,"Subtract 4 to get 3x = 15, then divide by 3."],["Solve 5x − 8 = 2x + 13.",["5","7","3","21"],1,"3x = 21, so x = 7. Check: both sides equal 27."]],"7-c4":[["A right triangle has legs 6 cm and 8 cm. The hypotenuse is…",["12 cm","14 cm","10 cm","100 cm"],2,"36 + 64 = 100, then take the square root."],["Hypotenuse 13 cm, one leg 5 cm. The other leg is…",["8 cm","18 cm","12 cm","144 cm"],2,"b² = 169 − 25 = 144, so b = 12 (subtract, not add)."],["The hypotenuse is always…",["the biggest number given","the side opposite the right angle","the shortest side","a side touching the right angle"],1,"Find the 90° mark first."],["A ladder's base is 3 m from a wall and it reaches 4 m up. Its length?",["7 m","5 m","3.5 m","25 m"],1,"The ladder is the hypotenuse: √(9+16) = 5."]],"7-c5":[["A = {2,4,6,8}, B = {4,8,12,16}. A ∩ B = ?",["{4, 8}","{2,4,6,8,12,16}","{2, 6}","{12, 16}"],0,"Intersection keeps only shared elements."],["For the same A and B, n(A ∪ B) = ?",["8","6","2","4"],1,"Union lists 2,4,6,8,12,16 with no repeats."],["In a class of 30, 18 like basketball, 15 football, 8 both. How many like neither?",["5","7","13","25"],0,"18+15−8 = 25 like at least one; 30−25 = 5."],["Which is the empty set?",["{0}","odd numbers divisible by 2","natural numbers","{1, 2}"],1,"It has no elements at all."],["The symbol ∪ means…",["elements in both sets","elements in A or B or both","elements not in A","subset"],1,"Union combines everything with no repeats."]],"7-c6":[["A shirt is bought for Rp80.000 and sold for Rp100.000. Profit percentage?",["20%","25%","80%","125%"],1,"Profit % uses the purchase price: 20.000/80.000."],["A bag costs Rp250.000 with a 20% discount. Price paid?",["Rp230.000","Rp200.000","Rp50.000","Rp270.000"],1,"Discount is 50.000; subtract it."],["Rp400.000 jacket: 15% discount, then 11% tax on the discounted price. Final?",["Rp340.000","Rp377.400","Rp384.000","Rp400.000"],1,"340.000 + 11% × 340.000 = 377.400."],["Net weight 48 kg, tare 2 kg. Tare % (of gross)?",["4.17%","4%","2%","96%"],1,"Gross = 50 kg, so 2/50 = 4%."],["Rp2.000.000 at 6% per year for 12 months earns what interest?",["Rp12.000","Rp120.000","Rp1.200.000","Rp60.000"],1,"(12/12) × 0.06 × 2.000.000 = 120.000."]],"8-c1":[["Slope of the line through (2,3) and (6,11)?",["2","1/2","4","8"],0,"(11−3)/(6−2) = 2."],["A shop charges Rp50.000 flat plus Rp30.000 per hour. In y = mx + c, c is…",["30.000","50.000","x","y"],1,"The flat/starting amount is c; the rate is m."],["A line parallel to y = 2x + 1 has slope…",["−2","−1/2","2","1/2"],2,"Parallel lines share the same slope."],["A line perpendicular to slope 3 has slope…",["−3","1/3","3","−1/3"],3,"Negative reciprocal: flip and change sign."]],"8-c2":[["Two complementary angles; one is 37°. The other is…",["143°","53°","63°","37°"],1,"Complementary angles add to 90°."],["Supplementary angles (2x+10)° and (3x)°. Find x.",["34","36","30","170"],0,"5x + 10 = 180, so x = 34."],["Triangle angles are x, 2x and 2x + 20. The largest angle is…",["84°","64°","32°","76°"],0,"5x + 20 = 180 gives x = 32; angles 32°, 64°, 84°."],["An obtuse angle is…",["exactly 90°","between 90° and 180°","exactly 180°","more than 180°"],1,"Between a right angle and a straight angle."]],"8-c3":[["A die is rolled. P(number greater than 4) = ?",["1/6","1/3","1/2","2/3"],1,"Favorable {5,6} = 2 of 6."],["Two dice are rolled. P(sum = 7) = ?",["1/6","1/12","7/36","1/36"],0,"6 pairs out of 36."],["A bag has 4 red, 5 blue, 3 green marbles. P(not green) = ?",["1/4","3/4","9/4","5/12"],1,"9/12 = 3/4, or 1 − 1/4."],["A coin is tossed and a die rolled. How many outcomes in the sample space?",["8","12","36","6"],1,"2 × 6 = 12."]],"8-c4":[["Mean of 4, 8, 6, 10, 7?",["7","8","6","35"],0,"Sum 35 divided by 5."],["Median of 3, 9, 5, 1, 8, 7?",["5","7","6","8"],2,"Sorted 1,3,5,7,8,9; average of 5 and 7."],["The mean of 5 scores is 80. Four are 75, 82, 90, 78. The fifth is…",["75","80","85","325"],0,"Total 400 minus 325."],["The mode is…",["the middle value","the most frequent value","the average","largest minus smallest"],1,"It appears most often."]],"8-c5":[["If f(x) = 2x + 3, then f(4) = ?",["11","9","14","8"],0,"2(4) + 3 = 11."],["If f(x) = 3x − 7, which x gives f(x) = 20?",["7","9","13","27"],1,"3x = 27, so x = 9."],["The domain of a function is…",["outputs actually used","the set outputs may land in","the set of allowed inputs","its graph"],2,"Domain = inputs; codomain = allowed outputs; range = used outputs."],["A relation is NOT a function when…",["each input has one output","one input gives two different outputs","it is shown as ordered pairs","it is shown by arrows"],1,"Every input needs exactly one output."]],"9-c1":[["Factor 12x + 18 using the GCF.",["6(2x + 3)","3(4x + 6)","2(6x + 9)","12(x + 18)"],0,"6 is the greatest common factor."],["Factor 25y² − 16.",["(5y − 4)²","(25y − 16)(y + 1)","(5y − 4)(5y + 4)","not factorable"],2,"Difference of two squares: (5y)² − 4²."],["Factor x² + 5x + 6.",["(x + 1)(x + 6)","(x + 2)(x + 3)","(x + 5)(x + 1)","(x − 2)(x − 3)"],1,"Numbers adding to 5 and multiplying to 6: 2 and 3."],["Factor x² + 6x + 9.",["(x + 3)²","(x + 9)(x + 1)","(x − 3)²","(x + 3)(x − 3)"],0,"Perfect square: 9 = 3² and 6 = 2×3."],["Solve x² + 7x + 10 = 0.",["x = 2 or 5","x = −2 or −5","x = −7 or −10","x = 0"],1,"(x+2)(x+5) = 0 by the zero-product rule."]],"9-c2":[["2³ × 2⁴ = ?",["2¹²","2⁷","4⁷","6⁷"],1,"Same base: add exponents."],["4⁻² = ?",["−16","−8","16","1/16"],3,"A negative exponent flips to the denominator."],["Any nonzero number to the power 0 equals…",["0","1","itself","undefined"],1,"a⁰ = 1."],["√18 simplifies to…",["3√2","2√3","9√2","6√3"],0,"18 = 9 × 2, and √9 = 3."],["5√3 + 2√3 = ?",["7√6","7√3","10√3","7√9"],1,"Same radical: add coefficients."],["Rationalize 6 / (2 + √3).",["12 − 6√3","12 + 6√3","6 − 3√3","6/1"],0,"Multiply by the conjugate; denominator becomes 4 − 3 = 1."]],"9-c3":[["Two sides and the angle between them match. Which condition?",["SSS","SAS","ASA","AA"],1,"SAS: the angle is between the two sides."],["Which is NOT a valid congruence condition?",["SSS","SAS","ASA","SSA"],3,"SSA is not valid."],["Similar shapes have…",["equal sides, equal angles","proportional sides, equal angles","equal sides only","proportional angles"],1,"Congruent = equal sides; similar = proportional."],["ABC ~ DEF, AB=6, DE=9, BC=8. EF = ?",["10","14","12","9"],2,"Scale 9/6 = 1.5; 8 × 1.5 = 12."],["Right triangle altitude to hypotenuse splits it into BD=4 and DC=9. AD = ?",["36","13","6","5"],2,"AD² = 4 × 9 = 36."],["Trapezoid belt: AE=6, ED=4, AB=20, CD=30. EF = ?",["25","26","24","28"],1,"(6×30 + 4×20)/10 = 26."]],"9-c4":[["A central angle is 80°. The inscribed angle on the same arc is…",["160°","80°","40°","20°"],2,"Central = 2 × inscribed."],["An inscribed angle facing the diameter measures…",["45°","90°","180°","60°"],1,"Angle in a semicircle is 90°."],["P is 13 cm from the centre of a circle with r = 5 cm. Tangent length?",["8 cm","18 cm","12 cm","144 cm"],2,"t² = 13² − 5² = 144."],["Opposite angles of a cyclic quadrilateral add to…",["90°","180°","360°","270°"],1,"Always 180°."],["Segment area equals…",["sector + triangle","sector − central triangle","½r²","πr²"],1,"A segment is the sector minus its triangle."],["Sector area, r = 7 cm, θ = 60°, π = 22/7?",["≈ 25.67 cm²","154 cm²","51.3 cm²","7.3 cm²"],0,"(60/360) × 22/7 × 49 ≈ 25.67."]],"9-c5":[["Cylinder volume, r = 3 cm, h = 10 cm (π = 3.14)?",["94.2 cm³","282.6 cm³","942 cm³","90 cm³"],1,"πr²t = 3.14 × 9 × 10."],["Cone with r = 6 and t = 8. Slant height?",["14","7","10","100"],2,"√(36 + 64) = 10."],["Volume of a cone is…",["πr²t","⅓πr²t","4/3 πr³","2πrt"],1,"One-third of the cylinder."],["Cone : Sphere : Cylinder (same r, t = 2r) volume ratio?",["1:2:3","3:2:1","1:3:2","1:1:1"],0,"The special 1:2:3 relationship."],["Cylinder volume is 900 cm³. Sphere with the same r and height?",["300","600","450","1800"],1,"2/3 × 900 = 600."],["Sphere surface area is…",["4πr²","2πr²","πr²","4/3 πr³"],0,"Volume is 4/3 πr³."]],"9-c6":[["Translate A(2,3) by T(4,−1).",["(6, 2)","(−2, 4)","(6, 4)","(−2, 2)"],0,"(2+4, 3−1)."],["Reflect B(5,−2) over the y-axis.",["(5, 2)","(−5, −2)","(−5, 2)","(−2, 5)"],1,"(x, y) → (−x, y)."],["Rotation 90° counter-clockwise about the origin: (x, y) →",["(y, −x)","(−y, x)","(−x, −y)","(−x, y)"],1,"Positive angle is counter-clockwise."],["Reflection over the line y = x: (x, y) →",["(y, x)","(−y, −x)","(x, −y)","(−x, y)"],0,"Swap the coordinates."],["D(6,8) dilated by factor 1/2 around centre (2,2).",["(3, 4)","(4, 5)","(8, 10)","(2, 3)"],1,"Shift, scale, shift back: (2,3) + (2,2)."],["Rotating then translating versus translating then rotating…",["always gives the same result","can give different results","only matters for dilation","never differs"],1,"Follow the order stated in the problem."]],"tka-c2":[["√36 is…",["irrational","a rational whole number","not a real number","negative"],1,"√36 = 6; simplify before classifying."],["Write 0.0032 in scientific notation.",["3.2 × 10⁻³","3.2 × 10³","32 × 10⁻⁴","0.32 × 10⁻²"],0,"Move the decimal 3 places right."],["Which is correct scientific notation?",["23 × 10⁶","2.3 × 10⁷","0.23 × 10⁸","230 × 10⁵"],1,"The leading number must be between 0 and 10."],["Prime factorization of 12?",["2 × 6","3 × 4","2² × 3","2 × 3"],2,"2 × 2 × 3."],["Which property is the Distributive Property?",["a + b = b + a","a + 0 = a","(a+b)+c = a+(b+c)","a×(b+c) = a×b + a×c"],3,"It links combining like terms and GCF factoring."],["A decimal that never ends and never repeats is…",["rational","irrational","an integer","a whole number"],1,"Like π."],["2/3 + 1/4 = ?",["3/7","11/12","2/12","1/6"],1,"Common denominator 12: 8/12 + 3/12."]],"tka-c3":[["8 workers finish in 15 days. How many days for 5 workers?",["9.4","20","24","10"],2,"Inverse: 8×15 = 5×q, so q = 24."],["Solve −2x > 6.",["x > −3","x < −3","x > 3","x < 3"],1,"Dividing by a negative flips the sign."],["Solve 2x − y = 3 and x + y = 3.",["x = 2, y = 1","x = 1, y = 2","x = 3, y = 0","x = 2, y = −1"],0,"Adding gives 3x = 6."],["20th term of 4, 6, 8, 10, …",["42","44","40","24"],0,"a + (n−1)b = 4 + 19×2."],["6th term of 3, 6, 12, 24, …",["48","96","192","36"],1,"3 × 2⁵ = 96."],["Triangular numbers 1, 3, 6, 10 follow…",["n²","n(n+1)","n(n+1)/2","2n − 1"],2,"Half of a rectangular number."],["A map scale 1:10.000 means 1 cm equals…",["10 m","100 m","1 km","10 cm"],1,"10.000 cm = 100 m."]],"tka-c4":[["Area of a kite with diagonals 10 cm and 14 cm?",["140 cm²","70 cm²","24 cm²","48 cm²"],1,"½ × 10 × 14."],["Similar rectangles with side ratio 2:3. Smaller area 24 cm². Larger?",["36 cm²","54 cm²","48 cm²","72 cm²"],1,"Area ratio 4:9, so 24 × 9/4 = 54."],["Rhombus and kite share the area formula…",["a × t","½(a+b)t","½ d₁ d₂","½ × K × apothem"],2,"Both depend on two crossing diagonals."],["Right triangle with legs 6 and 8. Perimeter?",["24","14","48","10"],0,"Hypotenuse 10; 6 + 8 + 10 = 24."],["Trapezoid area is…",["a × t","(a + b) × t / 2","a + b + c + d","½ a t"],1,"Average of parallel sides times height."]],"tka-c5":[["Q1 of 3, 7, 8, 12, 13, 14, 18, 21?",["7.5","8","7","12"],0,"Median of lower half (3,7,8,12)."],["IQR equals…",["Q3 − Q1","Q3 + Q1","Q2 − Q1","max − min"],0,"Spread of the middle 50%."],["Class A: 25 students avg 78. Class B: 15 students avg 88. Combined mean?",["83","81.75","82","80"],1,"(1950 + 1320)/40."],["Number of outcomes when tossing 3 coins?",["6","8","9","12"],1,"2 × 2 × 2."],["A spinner has P(red) = 1/4. Expected reds in 200 spins?",["25","100","50","800"],2,"200 × 1/4 = 50."],["Which display shows each category's share of a whole?",["line graph","pie chart","histogram","table of raw values"],1,"Pie charts show shares as percentages."],["Relative frequency is…",["found by counting outcomes before trials","n(A)/n(P) from actual trials","always equal to theoretical probability","always zero"],1,"Experimental, from trials run."]],"tka-c6":[["Arithmetic series sum Sₙ = ?",["n/2 (2a + (n−1)b)","a(rⁿ − 1)/(r − 1)","n(n+1)","a + (n−1)b"],0,"The geometric series uses r."],["a² + 2ab + b² = ?",["(a − b)²","(a + b)²","a² − b²","(a + b)(a − b)"],1,"Perfect square trinomial."],["Combined mean formula?",["(x̄₁ + x̄₂)/2","(x̄₁n₁ + x̄₂n₂)/(n₁ + n₂)","x̄₁ × x̄₂","n₁/(n₁ + n₂)"],1,"Weighted by group size."],["P(Aᶜ) = ?",["1 + P(A)","P(A) − 1","1 − P(A)","P(A)²"],2,"Complement rule."],["Inverse proportion relation?",["a×q = b×p","a×p = b×q","a + p = b + q","a/b = p/q"],1,"Product stays constant."]],"tka-c7":[["Profit starts at −20 and rises by 15 each day. First positive day?",["2","3","4","1"],1,"−20 + 15(n−1) > 0 gives n > 2.33."],["A ladder reaches 12 m with base 5 m. A similar setup has base 2 m. Height?",["2 m","5 m","4.8 m","6 m"],2,"Scale 2/5; 12 × 2/5."],["40 students: mean 75. 25 of them average 70. The other 15 average…",["80","83.3","85","72.5"],1,"(3000 − 1750)/15 ≈ 83.3."],["Two similar sectors with radius ratio 2:1. Area ratio?",["2:1","4:1","8:1","3:1"],1,"Areas scale by the square."],["Rp1.000.000 grows 10% per year. Value after 4 years?",["Rp1.400.000","Rp1.464.100","Rp1.331.000","Rp1.610.510"],1,"1.000.000 × 1.1⁴."]]}</script>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- storage ---------- */

/* ---------- icons ---------- */
const IC={search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
play:'<polygon points="6 3 20 12 6 21 6 3"/>',pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
back:'<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/>',fwd:'<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/>',
shuffle:'<path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>',
repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
vol:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
check:'<path d="M20 6 9 17l-5-5"/>',spark:'<path d="M9.9 4.2 11 8l3.8 1.1L11 10.2 9.9 14 8.8 10.2 5 9.1 8.8 8z"/><path d="M18 14l.7 2.3L21 17l-2.3.7L18 20l-.7-2.3L15 17l2.3-.7z"/>',
send:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',lines:'<path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>'};
const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- viz ---------- */
const BARS=[12,20,34,48,32,60,78,52,38,65,86,56,35,48,72,90,63,44,30,54,70,42,24,16,30,48,28,16];
const vizHTML=(cls='')=>`<div class="viz ${cls}" data-viz aria-hidden="true">${BARS.map((h,i)=>`<i class="${i%4===0?'lt':''}" style="height:${Math.round(h/90*100)}%"></i>`).join('')}</div>`;
const lowMotion=()=>P.low||matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- music engine ---------- */
const SPACES=[
 {id:'rain',name:'Rain room',desc:'Soft rain · No vocals',tracks:[
  {n:'Soft rain, slow thoughts',s:'A steady rain soundscape',d:1800,p:{lp:5200,dr:.5}},
  {n:'Window-side drizzle',s:'Light drizzle on glass',d:1500,p:{lp:7500,dr:.2}},
  {n:'Rain after dusk',s:'Heavier rain with a low hum',d:1200,p:{lp:3000,dr:.85}}]},
 {id:'lofi',name:'Lo-fi corner',desc:'Warm beats · Slow tempo',tracks:[
  {n:'Quiet desk lamp',s:'Warm chords at 70 bpm',d:1800,p:{bpm:70,prog:0}},
  {n:'Late bus home',s:'Mellow loop at 76 bpm',d:1500,p:{bpm:76,prog:1}},
  {n:'Cold tea',s:'The slowest loop, 62 bpm',d:1200,p:{bpm:62,prog:2}}]},
 {id:'ocean',name:'Ocean window',desc:'Gentle waves · No vocals',tracks:[
  {n:'Gentle waves',s:'Slow swell, soft foam',d:1800,p:{rate:.09,lp:520}},
  {n:'Low tide',s:'Quiet water, far away',d:1500,p:{rate:.06,lp:380}},
  {n:'Harbour morning',s:'A wider swell with bright foam',d:1200,p:{rate:.12,lp:800}}]},
 {id:'piano',name:'Quiet piano',desc:'Soft keys · Instrumental',tracks:[
  {n:'Slow keys',s:'Sparse notes, long reverb',d:1800,p:{scale:[0,2,4,7,9],root:48,gap:3.2}},
  {n:'Morning hush',s:'A minor pentatonic',d:1500,p:{scale:[0,3,5,7,10],root:45,gap:2.6}},
  {n:'Last light',s:'Dorian colours, unhurried',d:1200,p:{scale:[0,2,3,7,9],root:50,gap:3.8}}]}];
const PROGS=[[[50,53,57,60,64],[43,47,50,53,57],[48,52,55,59,62],[45,48,52,55,59]],[[45,48,52,55,59],[50,53,57,60,64],[43,47,50,53,59],[48,52,55,59,62]],[[48,52,55,59,62],[45,48,52,55,59],[50,53,57,60,64],[43,47,50,53,57]]];
const M={ctx:null,master:null,an:null,verb:null,noiseBuf:null,cur:null,started:false,playing:false,el:0,shuf:false,rep:false,end:null,tick:null,data:null};
const spaceOf=id=>SPACES.find(s=>s.id===id)||SPACES[0];
const curSpace=()=>spaceOf(P.space), curTrack=()=>curSpace().tracks[P.track]||curSpace().tracks[0];
const mtof=n=>440*Math.pow(2,(n-69)/12);

function ensureCtx(){
  if(M.ctx) return true;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  const c=M.ctx=new AC();
  M.master=c.createGain(); M.master.gain.value=P.vol/100*.85;
  M.an=c.createAnalyser(); M.an.fftSize=128; M.an.smoothingTimeConstant=.82; M.data=new Uint8Array(M.an.frequencyBinCount);
  M.master.connect(M.an); M.an.connect(c.destination);
  const len=Math.floor(c.sampleRate*2.8), ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  M.verb=c.createConvolver(); M.verb.buffer=ir; const vg=c.createGain(); vg.gain.value=.7; M.verb.connect(vg); vg.connect(M.master);
  const nl=c.sampleRate*2; M.noiseBuf=c.createBuffer(1,nl,c.sampleRate); const nd=M.noiseBuf.getChannelData(0); for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;
  return true;
}
function buildTrack(sp,t){
  const c=M.ctx, bus=c.createGain(); bus.gain.value=0; bus.connect(M.master);
  const srcs=[], timers=[], G_=(v)=>{const g=c.createGain();g.gain.value=v;return g};
  const F=(type,f,q)=>{const n=c.createBiquadFilter();n.type=type;n.frequency.value=f;if(q)n.Q.value=q;return n};
  const noise=(off=0)=>{const s=c.createBufferSource();s.buffer=M.noiseBuf;s.loop=true;s.start(0,off);srcs.push(s);return s};
  const burst=(dest,freq,q,type,dur,vol)=>{const s=c.createBufferSource();s.buffer=M.noiseBuf;const f=F(type,freq,q),g=G_(0),n=c.currentTime;
    s.connect(f);f.connect(g);g.connect(dest);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.start(n,Math.random()*1.5);s.stop(n+dur+.02)};
  const p=t.p;
  if(sp.id==='rain'){
    const a=noise(),hp=F('highpass',350),lp=F('lowpass',p.lp),ga=G_(.5);a.connect(hp);hp.connect(lp);lp.connect(ga);ga.connect(bus);
    const b=noise(.7),bp=F('bandpass',1400,.6),gb=G_(.16);b.connect(bp);bp.connect(gb);gb.connect(bus);
    timers.push(setInterval(()=>{if(Math.random()<p.dr*.7)burst(bus,2500+Math.random()*4500,2,'bandpass',.05,.05+Math.random()*.09)},140));
  }else if(sp.id==='ocean'){
    const a=noise(),lp=F('lowpass',p.lp),ga=G_(.3);a.connect(lp);lp.connect(ga);ga.connect(bus);
    const l=c.createOscillator();l.frequency.value=p.rate;const lg=G_(.24);l.connect(lg);lg.connect(ga.gain);l.start();srcs.push(l);
    const b=noise(.9),hp=F('highpass',2400),gb=G_(.04);b.connect(hp);hp.connect(gb);gb.connect(bus);
    const l2=c.createOscillator();l2.frequency.value=p.rate*1.07;const lg2=G_(.035);l2.connect(lg2);lg2.connect(gb.gain);l2.start();srcs.push(l2);
  }else if(sp.id==='lofi'){
    const prog=PROGS[p.prog],beat=60/p.bpm;let next=c.currentTime+.15,k=0;
    const dl=c.createDelay(1);dl.delayTime.value=.27;const fb=G_(.28);dl.connect(fb);fb.connect(dl);const dg=G_(.5);dl.connect(dg);dg.connect(bus);
    const chord=(ch,at,len)=>{ch.forEach((m,i)=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=mtof(m);o.detune.value=(i-2)*4;
      const lp=F('lowpass',1100),g=G_(0);o.connect(lp);lp.connect(g);g.connect(bus);g.connect(dl);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.032,at+.06);g.gain.exponentialRampToValueAtTime(.0001,at+len);o.start(at);o.stop(at+len+.1)});
      const b=c.createOscillator();b.type='sine';b.frequency.value=mtof(ch[0]-12);const bg=G_(0);b.connect(bg);bg.connect(bus);bg.gain.setValueAtTime(0,at);bg.gain.linearRampToValueAtTime(.16,at+.04);bg.gain.exponentialRampToValueAtTime(.0001,at+len*.8);b.start(at);b.stop(at+len)};
    const kick=at=>{const o=c.createOscillator(),g=G_(0);o.frequency.setValueAtTime(130,at);o.frequency.exponentialRampToValueAtTime(45,at+.16);o.connect(g);g.connect(bus);g.gain.setValueAtTime(.2,at);g.gain.exponentialRampToValueAtTime(.0001,at+.22);o.start(at);o.stop(at+.25)};
    timers.push(setInterval(()=>{if(next<c.currentTime)next=c.currentTime+.1;while(next<c.currentTime+.7){const bi=k%4,ci=Math.floor(k/4)%4;
      if(bi===0)chord(prog[ci],next,beat*4.2);if(bi===0||bi===2)kick(next);
      if(k%2===1){const s=c.createBufferSource();s.buffer=M.noiseBuf;const hp=F('highpass',7000),g=G_(0);s.connect(hp);hp.connect(g);g.connect(bus);g.gain.setValueAtTime(.014,next);g.gain.exponentialRampToValueAtTime(.0001,next+.05);s.start(next,Math.random());s.stop(next+.07)}
      next+=beat;k++}},150));
    timers.push(setInterval(()=>{if(Math.random()<.35)burst(bus,3500,.5,'highpass',.004,.018)},90));
  }else if(sp.id==='piano'){
    const send=G_(.55);send.connect(M.verb);
    const note=(m,vel)=>{const n=c.currentTime,f=mtof(m),o1=c.createOscillator(),o2=c.createOscillator(),g=G_(0),g2=G_(.22);
      o1.type='sine';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f*2;o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(bus);g.connect(send);
      g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vel,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+4);o1.start(n);o2.start(n);o1.stop(n+4.1);o2.stop(n+4.1)};
    let alive=true;timers.push({stop:()=>{alive=false}});
    const loop=()=>{if(!alive)return;const sc=p.scale,m=p.root+12*Math.floor(Math.random()*3)+sc[Math.floor(Math.random()*sc.length)];
      note(m,.07+Math.random()*.07);if(Math.random()<.22)setTimeout(()=>alive&&note(m+(Math.random()<.5?7:4),.05),180+Math.random()*200);
      setTimeout(loop,p.gap*1000*(.6+Math.random()*.9))};loop();
  }
  return {bus,stop(fade=.35){const n=c.currentTime;bus.gain.cancelScheduledValues(n);bus.gain.setValueAtTime(bus.gain.value,n);bus.gain.linearRampToValueAtTime(0,n+fade);
    timers.forEach(t=>t&&t.stop?t.stop():clearInterval(t));setTimeout(()=>{srcs.forEach(s=>{try{s.stop()}catch(e){}});try{bus.disconnect()}catch(e){}},fade*1000+80)}};
}
function audioStart(){
  if(!ensureCtx()) return false;
  if(M.ctx.state==='suspended') M.ctx.resume();
  audioStop(.2);
  M.cur=buildTrack(curSpace(),curTrack());
  const n=M.ctx.currentTime;M.cur.bus.gain.linearRampToValueAtTime(1,n+1.2);
  return true;
}
function audioStop(f){if(M.cur){M.cur.stop(f);M.cur=null}}
function setTimerEnd(){M.end=P.timer?Date.now()+P.timer*60000:null}
function play(){
  if(!audioStart()){toast('This browser can’t play generated audio.');return}
  M.started=true;M.playing=true;if(!M.end)setTimerEnd();startTick();syncMusic(true);
}
function pause(){M.playing=false;audioStop(.5);M.end=null;syncMusic(true)}
function toggle(){M.playing?pause():play()}
function startTick(){if(M.tick)return;M.tick=setInterval(()=>{
  if(!M.playing)return;M.el++;
  if(M.end&&Date.now()>=M.end){pause();toast('Your timer finished. Music paused.');return}
  if(M.el>=curTrack().d){step(1,true);return}
  syncMusic(false)},1000)}
function step(dir,auto){
  const sp=curSpace(),n=sp.tracks.length;
  if(auto&&M.rep){M.el=0}
  else if(M.shuf&&n>1){let k;do{k=Math.floor(Math.random()*n)}while(k===P.track);P.track=k;M.el=0}
  else{P.track=(P.track+dir+n)%n;M.el=0}
  save();if(M.playing)audioStart();syncMusic(true)}
function pickSpace(id){
  if(P.space===id)return;P.space=id;P.track=0;M.el=0;save();if(M.playing)audioStart();syncMusic(true)}
function pickTrack(i){P.track=i;M.el=0;save();if(M.playing)audioStart();else{}syncMusic(true)}
function setVol(v){P.vol=v;save();if(M.master)M.master.gain.setTargetAtTime(v/100*.85,M.ctx.currentTime,.05);$$('[data-volv]').forEach(e=>e.textContent=v+'%');$$('[data-volr]').forEach(e=>{if(e!==document.activeElement)e.value=v});const mm=$('#mini-mid');if(mm)mm.textContent=volNote()}
const volNote=()=>(P.vol<=40?'Low volume':'Volume '+P.vol+'%')+' · Keeps playing as you learn';
const statusWord=()=>M.playing?'Playing':(M.started?'Paused':'Ready');
const timerNote=()=>M.playing&&M.end?' · stops in '+fmt((M.end-Date.now())/1000):'';

/* ---------- state ---------- */
const lastSec=()=>P.last&&S[P.last]?S[P.last]:null;
const V={view:'home',grade:lastSec()?lastSec().c.g.id:DATA[0].id,chap:lastSec()?lastSec().c.id:null,sec:lastSec()?lastSec().id:null,
  q:'',fg:{},ft:{chapter:true,lesson:true,example:true},tab:'all',sort:'rel',
  ai:{msgs:[],mode:'hint',busy:false,pending:null,problem:null,ctx:null,draft:''},
  rep:{cat:'',where:'',sum:'',what:'',steps:'',shot:null,shotErr:'',tech:true,detach:false,errors:{},fail:false},lastRep:null};
DATA.forEach(g=>V.fg[g.id]=true);

/* enhance worked examples: try first, then reveal */
function enhanceLesson(){const q0=S[V.sec];if(q0&&q0.quiz){drawQuiz(q0);return}
  const root=$('#lesson');if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  kids.forEach(el=>{
    const isEx=el.tagName==='P'&&el.firstElementChild&&el.firstElementChild.tagName==='STRONG'&&/^Example\s+\d+/i.test(el.textContent.trim());
    if(isEx){cur={head:el,els:[]};groups.push(cur)}else if(cur){if(/^H[1-6]$/.test(el.tagName)||el.tagName==='HR'){cur=null}else cur.els.push(el)}
  });
  groups.forEach((gp,gi)=>{
    const qi=gp.els.findIndex(e=>e.tagName==='BLOCKQUOTE');if(qi<0||qi===gp.els.length-1)return;
    const wrap=document.createElement('section');wrap.className='ex';
    gp.head.before(wrap);wrap.append(gp.head);gp.els.slice(0,qi+1).forEach(e=>wrap.append(e));
    const id='ex'+gi,tr=document.createElement('div');tr.className='try';
    tr.innerHTML=`<label for="${id}">Your turn. Write your first step or answer.</label><textarea id="${id}" placeholder="Try it on paper or type it here…"></textarea><div class="try-actions"><button class="btn" data-a="reveal">Show the worked solution</button><button class="link" data-a="hint">Give me a hint</button></div>`;
    const rv=document.createElement('div');rv.className='rev';rv.hidden=true;gp.els.slice(qi+1).forEach(e=>rv.append(e));
    wrap.append(tr,rv);
  });
}

function searchRun(){
  const toks=V.q.toLowerCase().split(/\s+/).filter(Boolean),out=[];
  if(!toks.length)return out;
  DATA.forEach(g=>{if(!V.fg[g.id])return;g.chapters.forEach(c=>{
    const ct=c.title.toLowerCase();
    if(V.ft.chapter){let sc=0;const hay=ct+' '+c.sections.map(s=>s.title.toLowerCase()).join(' ');if(toks.every(t=>hay.includes(t))){sc=toks.reduce((a,t)=>a+(ct.includes(t)?12:4),0);out.push({k:'chapter',c,sc,g,snip:`${c.sections.length} lessons: ${c.sections.slice(0,3).map(s=>s.title).join(' · ')}${c.sections.length>3?' …':''}`})}}
    c.sections.forEach(s=>{const k=s.ex?'example':'lesson';if(!V.ft[k])return;const tl=s.title.toLowerCase(),tx=s.text.toLowerCase();
      if(!toks.every(t=>tl.includes(t)||ct.includes(t)||tx.includes(t)))return;
      let sc=0;toks.forEach(t=>{if(tl.includes(t))sc+=10;if(ct.includes(t))sc+=3;let n=0,i=-1;while(n<6&&(i=tx.indexOf(t,i+1))>=0)n++;sc+=n});
      const i0=tx.indexOf(toks.find(t=>tx.includes(t))||toks[0]);let sn=i0>=0?s.text.slice(Math.max(0,i0-70),i0+150):s.text.slice(0,180);
      out.push({k,s,c,g,sc,snip:(i0>70?'… ':'')+sn+'…'})})})});
  if(V.sort==='rel')out.sort((a,b)=>b.sc-a.sc);else out.sort((a,b)=>DATA.indexOf(a.g)-DATA.indexOf(b.g));
  return out;
}

const chatHTML=s=>{const a=V.ai,hi=`<div class="msg bot"><span class="who">Matherial study guide</span><div class="bubble"><p>${s?`Hi! I can see you’re on <b>${esc(s.title)}</b>. Tell me which step feels tricky, or paste the question you’re stuck on.`:'Hi! Tell me what you’re working on and which step feels tricky. I’ll start with a hint.'}</p></div></div>`;return hi+a.msgs.map(aiMsgHTML).join('')};
function refreshChat(){const c=$('#chat');if(!c)return;c.innerHTML=chatHTML(V.ai.ctx&&S[V.ai.ctx]?S[V.ai.ctx]:lastSec());const b=$('#asend');if(b)b.disabled=V.ai.busy;const last=c.lastElementChild;if(last)last.scrollIntoView({block:'nearest'})}
async function getSample(){try{return window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){return null}}
async function askGuide(text){
  const a=V.ai;text=text.trim();if(!text||a.busy)return;
  const s=a.ctx&&S[a.ctx]?S[a.ctx]:lastSec();
  a.msgs.push({r:'you',t:text});const bot={r:'bot',t:'',busy:true};a.msgs.push(bot);a.busy=true;a.draft='';const ta=$('#atext');if(ta)ta.value='';refreshChat();
  const sample=await getSample();
  if(!sample){bot.busy=false;bot.t='The study guide can’t connect in this view. Try the worked examples in your lesson, and compare each step with the solution.';a.busy=false;refreshChat();return}
  const ctx=s?`The student is reading the lesson "${s.title}" (${pathOf(s)}). Lesson text (excerpt): ${s.text.slice(0,3200)}`:'No lesson is attached.';
  const sys=`You are the Matherial study guide for students in grades 7 to 9 studying a mathematics module (some content is for the Indonesian TKA exam). Teach by guiding, not by telling.
Rules: reply in at most 90 words. Ask one guiding question at a time. Never give the final answer to a practice problem until the student has attempted it and asked again after a hint. Write math in plain text (use ^ for powers, sqrt() for roots, no LaTeX). Be warm and brief. If the student writes in Indonesian, reply in Indonesian.
Help style requested: ${AI_MODES[a.mode][1]}
${ctx}${a.problem?`\nCurrent problem the student chose: ${a.problem}`:''}`;
  const hist=a.msgs.filter(m=>!m.busy&&m.t).map(m=>({role:m.r==='you'?'user':'assistant',content:m.t}));
  hist[0]={role:'user',content:sys+'\n\nStudent message: '+hist[0].content};
  try{const r=await sample(hist,{cache:false,onText:({text:t})=>{bot.t=t;if(V.view==='assistant')refreshChat()}});bot.t=(r&&r.text)||bot.t||'I couldn’t think of a good hint. Try asking in a different way.'}
  catch(err){bot.t=err&&err.code==='not_granted'?'The study guide needs your permission to run. Send your message again and choose Allow.':err&&err.code==='rate_limited'?'The guide needs a short break. Try again in a minute.':'Something went wrong reaching the guide. Your lesson is safe. Try again in a moment.'}
  bot.busy=false;a.busy=false;if(V.view==='assistant')refreshChat();
}
