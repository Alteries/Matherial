=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo>,<\/mo><mn>6<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math><\/p>\n<p>We write <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>∈<\/mo><mi>A<\/mi><\/mrow><\/semantics><\/math> to mean “3 is an element (member) of set A,” and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7<\/mn><mo>∉<\/mo><mi>A<\/mi><\/mrow><\/semantics><\/math> to mean “7 is not an element of A.”<\/p>\n","text":"A set is simply a well-defined collection of distinct objects, called elements or members . “Well-defined” means anyone looking at the rule would agree on exactly which objects belong and which don’t — “the set of all even numbers less than 10” is well-defined; “the set of tasty foods” is not (tasty is a matter of opinion). Sets are usually named with capital letters and written with curly braces: A = { 1 , 2 , 3 , 4 , 5 , 6 } We write 3 ∈ A to mean “3 is an element (member) of set A,” and 7 ∉ A to mean “7 is not an element of A.”","min":2,"ex":false},{"id":"7-c5-s2","title":"Types of Sets","html":"\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Type<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Meaning<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Example<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Finite set<\/strong><\/td>\n<td style=\"text-align: left;\">Has a countable, limited number of elements<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Infinite set<\/strong><\/td>\n<td style=\"text-align: left;\">Goes on forever<\/td>\n<td style=\"text-align: left;\">The set of all natural numbers<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Empty set<\/strong><\/td>\n<td style=\"text-align: left;\">Has no elements at all, written <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>⌀<\/mi><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">The set of odd numbers divisible by 2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Universal set (U)<\/strong><\/td>\n<td style=\"text-align: left;\">The “container” set — everything being considered in the current problem<\/td>\n<td style=\"text-align: left;\">If discussing digits, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>0<\/mn><mo>,<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><mo>,<\/mo><mn>9<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Type Meaning Example Finite set Has a countable, limited number of elements A = { 1 , 2 , 3 } Infinite set Goes on forever The set of all natural numbers Empty set Has no elements at all, written { } or ⌀ The set of odd numbers divisible by 2 Universal set (U) The “container” set — everything being considered in the current problem If discussing digits, U = { 0 , 1 , 2 , . . . , 9 }","min":2,"ex":false},{"id":"7-c5-s3","title":"Visualizing Sets — Venn Diagrams","html":"\n<p>A <strong>Venn diagram<\/strong> uses overlapping circles to show relationships between sets visually.<\/p>\n<pre><code>[DIAGRAM: Two overlapping circles]\n        Set A              Set B\n      ┌───────┐         ┌───────┐\n      │  1  2 │╲       ╱│  6  7 │\n      │       │ ╲     ╱ │       │\n      │   3   │  ╲   ╱  │   8   │\n      │       │   ╲ ╱   │       │\n      └───────┘    4,5  └───────┘\n                (the overlap:\n              elements in BOTH)<\/code><\/pre>\n<p>If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>7<\/mn><mo>,<\/mo><mn>8<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math>, the overlapping region contains <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math> — the elements that belong to <strong>both<\/strong> sets.<\/p>\n","text":"A Venn diagram uses overlapping circles to show relationships between sets visually. [DIAGRAM: Two overlapping circles] Set A Set B ┌───────┐ ┌───────┐ │ 1 2 │╲ ╱│ 6 7 │ │ │ ╲ ╱ │ │ │ 3 │ ╲ ╱ │ 8 │ │ │ ╲ ╱ │ │ └───────┘ 4,5 └───────┘ (the overlap: elements in BOTH) If A = { 1 , 2 , 3 , 4 , 5 } and B = { 4 , 5 , 6 , 7 , 8 } , the overlapping region contains { 4 , 5 } — the elements that belong to both sets.","min":2,"ex":false},{"id":"7-c5-s4","title":"Set Operations","html":"\n<ul>\n<li><strong>Union (<\/strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><\/mrow><\/semantics><\/math><strong>):<\/strong> everything that is in A, or B, or both — “combine everything, no repeats.” <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>7<\/mn><mo>,<\/mo><mn>8<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math><\/li>\n<li><strong>Intersection (<\/strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><\/mrow><\/semantics><\/math><strong>):<\/strong> only the elements shared by <em>both<\/em> sets — the overlapping region. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math><\/li>\n<li><strong>Complement (<\/strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>A<\/mi><mi>c<\/mi><\/msup><\/semantics><\/math> <strong>or<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>′<\/mi><\/mrow><\/semantics><\/math><strong>):<\/strong> everything in the universal set <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U<\/mi><\/semantics><\/math> that is <em>not<\/em> in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><\/semantics><\/math>.<\/li>\n<li><strong>Subset (<\/strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>⊆<\/mo><mi>B<\/mi><\/mrow><\/semantics><\/math><strong>):<\/strong> every element of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><\/semantics><\/math> is also found in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><\/semantics><\/math>.<\/li>\n<li><strong>Cardinality (<\/strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><strong>):<\/strong> the <em>number<\/em> of elements in set A. For <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>1<\/mn><mo>,<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>.<\/li>\n<\/ul>\n","text":"Union ( A ∪ B ): everything that is in A, or B, or both — “combine everything, no repeats.” A ∪ B = { 1 , 2 , 3 , 4 , 5 , 6 , 7 , 8 } Intersection ( A ∩ B ): only the elements shared by both sets — the overlapping region. A ∩ B = { 4 , 5 } Complement ( A c or A ′ ): everything in the universal set U that is not in A . Subset ( A ⊆ B ): every element of A is also found in B . Cardinality ( n ( A ) ): the number of elements in set A. For A = { 1 , 2 , 3 , 4 , 5 } , n ( A ) = 5 .","min":2,"ex":false},{"id":"7-c5-s5","title":"Worked Examples — Set (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>2<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>8<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>4<\/mn><mo>,<\/mo><mn>8<\/mn><mo>,<\/mo><mn>12<\/mn><mo>,<\/mo><mn>16<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math>, find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Look for elements appearing in <em>both<\/em> lists: 4 and 8 appear in both.<\/p>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo>=<\/mo><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>4<\/mn><mo>,<\/mo><mn>8<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Union and cardinality):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Using the same sets <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><\/semantics><\/math> above, find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Combine all elements, listing shared ones only once: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\" form=\"prefix\">{<\/mo><mn>2<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>8<\/mn><mo>,<\/mo><mn>12<\/mn><mo>,<\/mo><mn>16<\/mn><mo stretchy=\"false\" form=\"postfix\">}<\/mo><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">union found<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Count the elements<\/td>\n<td style=\"text-align: left;\">6<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — real-world survey problem):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> In a class of 30 students, 18 like basketball, 15 like football, and 8 like both sports. How many students like neither sport?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 10%\" />\n<col style=\"width: 42%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 20%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Reason<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Find how many like <em>at least one<\/em> sport: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>−<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">The “both” group gets counted twice if we just add 18+15, so we subtract it back out once<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>18<\/mn><mo>+<\/mo><mn>15<\/mn><mo>−<\/mo><mn>8<\/mn><mo>=<\/mo><mn>25<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Subtract from the total class size<\/td>\n<td style=\"text-align: left;\">Students not in either group = total − (at least one)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30<\/mn><mo>−<\/mo><mn>25<\/mn><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <strong>5 students<\/strong> like neither sport.<\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> In a survey of 50 people, everyone owns at least one type of pet: a cat, a dog, or both. If 32 people own a dog and 28 own a cat, how many people own <em>both<\/em> a cat and a dog?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Since “everyone owns at least one,” this means <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>50<\/mn><\/mrow><\/semantics><\/math> (the total).<\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 50%\" />\n<col style=\"width: 35%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Use the union formula, solving for the intersection: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>−<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50<\/mn><mo>=<\/mo><mn>32<\/mn><mo>+<\/mo><mn>28<\/mn><mo>−<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Simplify the right side<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50<\/mn><mo>=<\/mo><mn>60<\/mn><mo>−<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Rearrange to isolate the intersection (same balance-scale idea from Section 3!)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>60<\/mn><mo>−<\/mo><mn>50<\/mn><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <strong>10 people<\/strong> own both a cat and a dog.<\/p>\n","text":"Example 1 (Warm-up): Question: Given A = { 2 , 4 , 6 , 8 } and B = { 4 , 8 , 12 , 16 } , find A ∩ B . Solution: Look for elements appearing in both lists: 4 and 8 appear in both. Answer: A ∩ B = { 4 , 8 } Example 2 (Union and cardinality): Question: Using the same sets A and B above, find n ( A ∪ B ) . Step What to Do Result 1 Combine all elements, listing shared ones only once: { 2 , 4 , 6 , 8 , 12 , 16 } union found 2 Count the elements 6 Answer: n ( A ∪ B ) = 6 Example 3 (HOTS — real-world survey problem): Question: In a class of 30 students, 18 like basketball, 15 like football, and 8 like both sports. How many students like neither sport? Solution: Step What to Do Reason Result 1 Find how many like at least one sport: n ( A ∪ B ) = n ( A ) + n ( B ) − n ( A ∩ B ) The “both” group gets counted twice if we just add 18+15, so we subtract it back out once 18 + 15 − 8 = 25 2 Subtract from the total class size Students not in either group = total − (at least one) 30 − 25 = 5 Answer: 5 students like neither sport. Example 4 (Pure analogical, above HOTS): Question: In a survey of 50 people, everyone owns at least one type of pet: a cat, a dog, or both. If 32 people own a dog and 28 own a cat, how many people own both a cat and a dog? Solution: Since “everyone owns at least one,” this means n ( A ∪ B ) = 50 (the total). Step What to Do Result 1 Use the union formula, solving for the intersection: n ( A ∪ B ) = n ( A ) + n ( B ) − n ( A ∩ B ) 50 = 32 + 28 − n ( A ∩ B ) 2 Simplify the right side 50 = 60 − n ( A ∩ B ) 3 Rearrange to isolate the intersection (same balance-scale idea from Section 3!) n ( A ∩ B ) = 60 − 50 = 10 Answer: 10 people own both a cat and a dog.","min":2,"ex":true},{"id":"7-c5-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Double-counting the overlap.<\/strong> When finding <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo>∪<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, students often just add <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> and forget to subtract the intersection — this counts the “both” group twice.<\/li>\n<li><strong>Confusing<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>∪<\/mo><\/semantics><\/math> <strong>and<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>∩<\/mo><\/semantics><\/math><strong>.<\/strong> A helpful memory hook: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>∪<\/mo><\/semantics><\/math> looks like a <strong>U<\/strong>nion (a cup that <em>collects<\/em> everything), while <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>∩<\/mo><\/semantics><\/math> looks like a <strong>cap<\/strong> that only covers the <em>shared middle<\/em>.<\/li>\n<li><strong>Forgetting “neither.”<\/strong> In survey-style problems (Example 3), always double check whether the question wants people in the union, or people <em>outside<\/em> it.<\/li>\n<\/ul>\n","text":"Double-counting the overlap. When finding n ( A ∪ B ) , students often just add n ( A ) + n ( B ) and forget to subtract the intersection — this counts the “both” group twice. Confusing ∪ and ∩ . A helpful memory hook: ∪ looks like a U nion (a cup that collects everything), while ∩ looks like a cap that only covers the shared middle . Forgetting “neither.” In survey-style problems (Example 3), always double check whether the question wants people in the union, or people outside it.","min":2,"ex":false},{"id":"7-c5-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"A = {2,4,6,8}, B = {4,8,12,16}. A ∩ B = ? For the same A and B, n(A ∪ B) = ? In a class of 30, 18 like basketball, 15 football, 8 both. How many like neither? Which is the empty set? The symbol ∪ means…","min":3,"ex":false,"quiz":true}]},{"id":"7-c6","title":"Social Arithmetics","raw":"6. Social Arithmetics","sections":[{"id":"7-c6-s1","title":"Overall and Per-Unit Value","html":"\n<p>This topic is really just multiplication and division wearing an “everyday shopping” costume — and once you see it that way, none of it should feel new.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Total Value<\/mtext><mo>=<\/mo><mtext mathvariant=\"normal\">Number of Units<\/mtext><mo>×<\/mo><mtext mathvariant=\"normal\">Value Per Unit<\/mtext><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Worked Example:<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> One golden apple costs Rp10.000. Rani buys 20 of them. What is the total cost?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Total<\/mtext><mo>=<\/mo><mn>20<\/mn><mo>×<\/mo><mn>10.000<\/mn><mo>=<\/mo><mn>200.000<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <strong>Rp200.000<\/strong><\/p>\n","text":"This topic is really just multiplication and division wearing an “everyday shopping” costume — and once you see it that way, none of it should feel new. Total Value = Number of Units × Value Per Unit Worked Example: Question: One golden apple costs Rp10.000. Rani buys 20 of them. What is the total cost? Solution: Total = 20 × 10.000 = 200.000 Answer: Rp200.000","min":2,"ex":false},{"id":"7-c6-s2","title":"Profit, Loss, and Percentage","html":"\n<p>In trading, we compare the <strong>Selling Price (SP)<\/strong> to the <strong>Purchase Price / Cost Price (PP/PC)<\/strong>:<\/p>\n<ul>\n<li><strong>Profit<\/strong> happens when SP &gt; PP: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Profit<\/mtext><mo>=<\/mo><mtext mathvariant=\"normal\">SP<\/mtext><mo>−<\/mo><mtext mathvariant=\"normal\">PP<\/mtext><\/mrow><\/semantics><\/math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Profit %<\/mtext><mo>=<\/mo><mfrac><mtext mathvariant=\"normal\">Profit<\/mtext><mtext mathvariant=\"normal\">PP<\/mtext><\/mfrac><mo>×<\/mo><mn>100<\/mn><mi>%<\/mi><\/mrow><\/semantics><\/math><\/li>\n<li><strong>Loss<\/strong> happens when SP &lt; PP: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Loss<\/mtext><mo>=<\/mo><mtext mathvariant=\"normal\">PP<\/mtext><mo>−<\/mo><mtext mathvariant=\"normal\">SP<\/mtext><\/mrow><\/semantics><\/math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Loss %<\/mtext><mo>=<\/mo><mfrac><mtext mathvariant=\"normal\">Loss<\/mtext><mtext mathvariant=\"normal\">PP<\/mtext><\/mfrac><mo>×<\/mo><mn>100<\/mn><mi>%<\/mi><\/mrow><\/semantics><\/math><\/li>\n<\/ul>\n<p><strong>Key insight that trips students up:<\/strong> percentage profit/loss is <em>always<\/em> calculated based on the <strong>Purchase Price<\/strong>, never the Selling Price — because “how much did I gain/lose <em>relative to what I originally spent<\/em>” is the whole point of the percentage.<\/p>\n","text":"In trading, we compare the Selling Price (SP) to the Purchase Price / Cost Price (PP/PC) : Profit happens when SP > PP: Profit = SP − PP , and Profit % = Profit PP × 100 % Loss happens when SP < PP: Loss = PP − SP , and Loss % = Loss PP × 100 % Key insight that trips students up: percentage profit/loss is always calculated based on the Purchase Price , never the Selling Price — because “how much did I gain/lose relative to what I originally spent ” is the whole point of the percentage.","min":2,"ex":false},{"id":"7-c6-s3","title":"Discounts and Taxes — Opposite Directions, Same Method","html":"\n<ul>\n<li><strong>Discount<\/strong> <em>reduces<\/em> the price: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Price Paid<\/mtext><mo>=<\/mo><mtext mathvariant=\"normal\">Original Price<\/mtext><mo>−<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mtext mathvariant=\"normal\">Discount %<\/mtext><mo>×<\/mo><mtext mathvariant=\"normal\">Original Price<\/mtext><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/li>\n<li><strong>Tax<\/strong> <em>increases<\/em> the price: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Final Price<\/mtext><mo>=<\/mo><mtext mathvariant=\"normal\">Initial Price<\/mtext><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mtext mathvariant=\"normal\">Tax %<\/mtext><mo>×<\/mo><mtext mathvariant=\"normal\">Initial Price<\/mtext><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/li>\n<\/ul>\n<p>Both use exactly the same skill (finding a percentage of a number) — the only difference is whether you add or subtract the result at the end.<\/p>\n","text":"Discount reduces the price: Price Paid = Original Price − ( Discount % × Original Price ) Tax increases the price: Final Price = Initial Price + ( Tax % × Initial Price ) Both use exactly the same skill (finding a percentage of a number) — the only difference is whether you add or subtract the result at the end.","min":2,"ex":false},{"id":"7-c6-s4","title":"Gross, Net, and Tare","html":"\n<p>Think of a bag of rice: the rice itself is the <strong>Net<\/strong> weight, the empty bag is the <strong>Tare<\/strong>, and the rice + bag together is the <strong>Gross<\/strong> weight.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Gross<\/mtext><mo>=<\/mo><mtext mathvariant=\"normal\">Net<\/mtext><mo>+<\/mo><mtext mathvariant=\"normal\">Tare<\/mtext><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Tare %<\/mtext><mo>=<\/mo><mfrac><mtext mathvariant=\"normal\">Tare<\/mtext><mtext mathvariant=\"normal\">Gross<\/mtext><\/mfrac><mo>×<\/mo><mn>100<\/mn><mi>%<\/mi><\/mrow><\/semantics><\/math><\/p>\n","text":"Think of a bag of rice: the rice itself is the Net weight, the empty bag is the Tare , and the rice + bag together is the Gross weight. Gross = Net + Tare Tare % = Tare Gross × 100 %","min":2,"ex":false},{"id":"7-c6-s5","title":"Simple Interest","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Interest<\/mtext><mo>=<\/mo><mfrac><mi>n<\/mi><mn>12<\/mn><\/mfrac><mo>×<\/mo><mi>P<\/mi><mo>×<\/mo><mi>M<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> = number of months, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>P<\/mi><\/semantics><\/math> = annual interest rate, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M<\/mi><\/semantics><\/math> = initial capital/savings.<\/p>\n","text":"Interest = n 12 × P × M where n = number of months, P = annual interest rate, M = initial capital/savings.","min":2,"ex":false},{"id":"7-c6-s6","title":"Worked Examples — Social Arithmetics (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — profit percentage):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A shop buys a shirt for Rp80.000 and sells it for Rp100.000. Find the profit and the profit percentage.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Profit = SP − PP = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100.000<\/mn><mo>−<\/mo><mn>80.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>20.000<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Profit % = (Profit ÷ PP) × 100% = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>20.000<\/mn><mo>÷<\/mo><mn>80.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>×<\/mo><mn>100<\/mn><mi>%<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25<\/mn><mi>%<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Profit is <strong>Rp20.000<\/strong>, which is a <strong>25% profit<\/strong>.<\/p>\n<p><strong>Example 2 (Discount):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A bag originally costs Rp250.000 and is on a 20% discount. What is the final price?<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Find the discount amount: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mi>%<\/mi><mo>×<\/mo><mn>250.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>50.000<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Subtract from the original price: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>250.000<\/mn><mo>−<\/mo><mn>50.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>200.000<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <strong>Rp200.000<\/strong><\/p>\n<p><strong>Example 3 (HOTS — discount and tax combined, order matters!):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A jacket costs Rp400.000. The store applies a 15% discount, and <em>then<\/em> charges 11% tax on the discounted price. What is the final amount paid?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 61%\" />\n<col style=\"width: 23%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Apply the discount first: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400.000<\/mn><mo>−<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mi>%<\/mi><mo>×<\/mo><mn>400.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>400.000<\/mn><mo>−<\/mo><mn>60.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>340.000<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Apply tax to the <em>discounted<\/em> price, not the original: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>340.000<\/mn><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>11<\/mn><mi>%<\/mi><mo>×<\/mo><mn>340.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>340.000<\/mn><mo>+<\/mo><mn>37.400<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>377.400<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <strong>Rp377.400<\/strong> <em>(This example exists specifically because many students apply both percentages to the original price and add/subtract them separately — that gives a different, incorrect answer. Order of operations matters here just as much as in pure algebra.)<\/em><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — combines simple interest with percentage reasoning):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Budi deposits Rp2.000.000 in a savings account with an annual interest rate of 6%. After how many months will his <em>total interest earned<\/em> reach Rp150.000?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 9%\" />\n<col style=\"width: 50%\" />\n<col style=\"width: 37%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Write the formula: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Interest<\/mtext><mo>=<\/mo><mfrac><mi>n<\/mi><mn>12<\/mn><\/mfrac><mo>×<\/mo><mi>P<\/mi><mo>×<\/mo><mi>M<\/mi><\/mrow><\/semantics><\/math>, where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mn>6<\/mn><mi>%<\/mi><mo>=<\/mo><mn>0.06<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mo>=<\/mo><mn>2.000<\/mn><mn>.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">equation set up<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Substitute the target interest: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150.000<\/mn><mo>=<\/mo><mfrac><mi>n<\/mi><mn>12<\/mn><\/mfrac><mo>×<\/mo><mn>0.06<\/mn><mo>×<\/mo><mn>2.000<\/mn><mn>.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150.000<\/mn><mo>=<\/mo><mfrac><mi>n<\/mi><mn>12<\/mn><\/mfrac><mo>×<\/mo><mn>120.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Simplify the right side: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>120.000<\/mn><mn>12<\/mn><\/mfrac><mo>=<\/mo><mn>10.000<\/mn><\/mrow><\/semantics><\/math>, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150.000<\/mn><mo>=<\/mo><mn>10.000<\/mn><mi>n<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">isolate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Divide both sides by 10.000<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>15<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> It will take <strong>15 months<\/strong>.<\/p>\n","text":"Example 1 (Warm-up — profit percentage): Question: A shop buys a shirt for Rp80.000 and sells it for Rp100.000. Find the profit and the profit percentage. Step Action Result 1 Profit = SP − PP = 100.000 − 80.000 20.000 2 Profit % = (Profit ÷ PP) × 100% = ( 20.000 ÷ 80.000 ) × 100 % 25 % Answer: Profit is Rp20.000 , which is a 25% profit . Example 2 (Discount): Question: A bag originally costs Rp250.000 and is on a 20% discount. What is the final price? Step Action Result 1 Find the discount amount: 20 % × 250.000 50.000 2 Subtract from the original price: 250.000 − 50.000 200.000 Answer: Rp200.000 Example 3 (HOTS — discount and tax combined, order matters!): Question: A jacket costs Rp400.000. The store applies a 15% discount, and then charges 11% tax on the discounted price. What is the final amount paid? Solution: Step What to Do Result 1 Apply the discount first: 400.000 − ( 15 % × 400.000 ) = 400.000 − 60.000 340.000 2 Apply tax to the discounted price, not the original: 340.000 + ( 11 % × 340.000 ) = 340.000 + 37.400 377.400 Answer: Rp377.400 (This example exists specifically because many students apply both percentages to the original price and add/subtract them separately — that gives a different, incorrect answer. Order of operations matters here just as much as in pure algebra.) Example 4 (Pure analogical, above HOTS — combines simple interest with percentage reasoning): Question: Budi deposits Rp2.000.000 in a savings account with an annual interest rate of 6%. After how many months will his total interest earned reach Rp150.000? Solution: Step What to Do Result 1 Write the formula: Interest = n 12 × P × M , where P = 6 % = 0.06 , M = 2.000 .000 equation set up 2 Substitute the target interest: 150.000 = n 12 × 0.06 × 2.000 .000 150.000 = n 12 × 120.000 3 Simplify the right side: 120.000 12 = 10.000 , so 150.000 = 10.000 n isolate n 4 Divide both sides by 10.000 n = 15 Answer: It will take 15 months .","min":2,"ex":true},{"id":"7-c6-s7","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Calculating percentage based on the wrong reference value.<\/strong> Profit/loss % is always based on the Purchase Price, not the Selling Price.<\/li>\n<li><strong>Applying discount and tax to the same original price separately<\/strong>, instead of applying tax to the <em>already-discounted<\/em> price (see Example 3) — order matters.<\/li>\n<li><strong>Confusing Gross and Net.<\/strong> Gross is always the <em>bigger<\/em> number (contents + packaging); Net is the contents alone.<\/li>\n<li><strong>Forgetting to convert a percentage to a decimal<\/strong> before using it in a formula (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mi>%<\/mi><\/mrow><\/semantics><\/math> must become <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0.06<\/mn><\/semantics><\/math>, not <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>6<\/mn><\/semantics><\/math>).<\/li>\n<\/ul>\n","text":"Calculating percentage based on the wrong reference value. Profit/loss % is always based on the Purchase Price, not the Selling Price. Applying discount and tax to the same original price separately , instead of applying tax to the already-discounted price (see Example 3) — order matters. Confusing Gross and Net. Gross is always the bigger number (contents + packaging); Net is the contents alone. Forgetting to convert a percentage to a decimal before using it in a formula ( 6 % must become 0.06 , not 6 ).","min":2,"ex":false},{"id":"7-c6-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"A shirt is bought for Rp80.000 and sold for Rp100.000. Profit percentage? A bag costs Rp250.000 with a 20% discount. Price paid? Rp400.000 jacket: 15% discount, then 11% tax on the discounted price. Final? Net weight 48 kg, tare 2 kg. Tare % (of gross)? Rp2.000.000 at 6% per year for 12 months earns what interest?","min":3,"ex":false,"quiz":true}]}]},{"id":"8","name":"Grade 8","sub":"Mathematics","chapters":[{"id":"8-c1","title":"Linear Equation","raw":"1. Linear Equation","sections":[{"id":"8-c1-s1","title":"The Big Picture: A Line Is Just “A Constant Rate of Change”","html":"\n<p>Remember Section 1.7, Example 4 — the mountain where temperature dropped at a <em>constant rate<\/em> of −4°C per km? That “constant rate” idea is the entire concept behind linear equations. A <strong>linear equation<\/strong> describes any relationship where one quantity changes by the <em>same fixed amount<\/em> every time the other quantity increases by 1.<\/p>\n<p>The standard form is:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>m<\/mi><mi>x<\/mi><mo>+<\/mo><mi>c<\/mi><\/mrow><\/semantics><\/math><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 37%\" />\n<col style=\"width: 42%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Symbol<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Meaning<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Analogy<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m<\/mi><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><strong>Slope<\/strong> — how steep the line is; the constant rate of change<\/td>\n<td style=\"text-align: left;\">Like the mountain’s −4°C/km rate<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><strong>y-intercept<\/strong> — the starting value, where the line crosses the y-axis (when <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math>)<\/td>\n<td style=\"text-align: left;\">Like the temperature at the base of the mountain, before climbing at all<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">The input (independent variable)<\/td>\n<td style=\"text-align: left;\">Distance climbed<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">The output (dependent variable)<\/td>\n<td style=\"text-align: left;\">Temperature at that distance<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Remember Section 1.7, Example 4 — the mountain where temperature dropped at a constant rate of −4°C per km? That “constant rate” idea is the entire concept behind linear equations. A linear equation describes any relationship where one quantity changes by the same fixed amount every time the other quantity increases by 1. The standard form is: y = m x + c Symbol Meaning Analogy m Slope — how steep the line is; the constant rate of change Like the mountain’s −4°C/km rate c y-intercept — the starting value, where the line crosses the y-axis (when x = 0 ) Like the temperature at the base of the mountain, before climbing at all x The input (independent variable) Distance climbed y The output (dependent variable) Temperature at that distance","min":2,"ex":false},{"id":"8-c1-s2","title":"Finding the Slope Between Two Points","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>y<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Why this formula works:<\/strong> slope is “rise over run” — how much <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math> changes (rise), divided by how much <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> changes (run), between any two points on the same line.<\/p>\n<pre><code>[DIAGRAM: Slope as rise over run]\ny\n│         ● (x2, y2)\n│        ╱│\n│      ╱  │ rise = y2 - y1\n│    ╱____│\n│  ● (x1, y1)\n│  run = x2 - x1\n└──────────────────► x<\/code><\/pre>\n","text":"m = y 2 − y 1 x 2 − x 1 Why this formula works: slope is “rise over run” — how much y changes (rise), divided by how much x changes (run), between any two points on the same line. [DIAGRAM: Slope as rise over run] y │ ● (x2, y2) │ ╱│ │ ╱ │ rise = y2 - y1 │ ╱____│ │ ● (x1, y1) │ run = x2 - x1 └──────────────────► x","min":2,"ex":false},{"id":"8-c1-s3","title":"Writing the Equation of a Line","html":"\n<ul>\n<li><strong>Given one point and the slope:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mi>m<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/li>\n<li><strong>Given two points:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mi>y<\/mi><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>y<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>x<\/mi><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/li>\n<\/ul>\n","text":"Given one point and the slope: y − y 1 = m ( x − x 1 ) Given two points: y − y 1 y 2 − y 1 = x − x 1 x 2 − x 1","min":2,"ex":false},{"id":"8-c1-s4","title":"Parallel and Perpendicular Lines","html":"\n<ul>\n<li><strong>Parallel lines<\/strong> have the <strong>same slope<\/strong> — they head in the same direction forever, so they never meet. If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>, any line parallel to it also has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>.<\/li>\n<li><strong>Perpendicular lines<\/strong> have slopes that are <strong>negative reciprocals<\/strong> of each other (flip the fraction and change the sign). If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>, the perpendicular slope is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><\/semantics><\/math>.<\/li>\n<\/ul>\n<p><strong>Why “negative reciprocal”?<\/strong> Picture a slope of 2 as a steep uphill climb (2 up, 1 across). To be <em>exactly<\/em> perpendicular to that direction, a line must go the <em>opposite steepness<\/em> in the <em>opposite rotational sense<\/em> — which is precisely what flipping the fraction and flipping the sign achieves geometrically.<\/p>\n","text":"Parallel lines have the same slope — they head in the same direction forever, so they never meet. If m = 2 , any line parallel to it also has m = 2 . Perpendicular lines have slopes that are negative reciprocals of each other (flip the fraction and change the sign). If m = 2 , the perpendicular slope is − 1 2 . Why “negative reciprocal”? Picture a slope of 2 as a steep uphill climb (2 up, 1 across). To be exactly perpendicular to that direction, a line must go the opposite steepness in the opposite rotational sense — which is precisely what flipping the fraction and flipping the sign achieves geometrically.","min":2,"ex":false},{"id":"8-c1-s5","title":"Worked Examples — Linear Equations (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — find the slope):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the slope of the line passing through <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>6<\/mn><mo>,<\/mo><mn>11<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Apply the slope formula: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mfrac><mrow><mn>11<\/mn><mo>−<\/mo><mn>3<\/mn><\/mrow><mrow><mn>6<\/mn><mo>−<\/mo><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>8<\/mn><mn>4<\/mn><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Simplify<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Write the equation given a point and slope):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the equation of a line with slope <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>3<\/mn><\/semantics><\/math> passing through <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Use point-slope form: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mi>m<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><mn>5<\/mn><mo>=<\/mo><mn>3<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Distribute the 3<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><mn>5<\/mn><mo>=<\/mo><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Add 5 to both sides to isolate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — real-world rate problem):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A phone repair shop charges a flat inspection fee of Rp50.000, plus Rp30.000 for every hour of labor. Write the equation relating total cost (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math>) to hours of labor (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>), then find the cost for a 3.5-hour repair.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 53%\" />\n<col style=\"width: 30%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Identify <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m<\/mi><\/semantics><\/math> (rate per hour) and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math> (flat/starting fee)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m<\/mi><mo>=<\/mo><mn>30.000<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mn>50.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Write the equation<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>30.000<\/mn><mi>x<\/mi><mo>+<\/mo><mn>50.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Substitute <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>3.5<\/mn><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>30.000<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3.5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>50.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>105.000<\/mn><mo>+<\/mo><mn>50.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The equation is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>30.000<\/mn><mi>x<\/mi><mo>+<\/mo><mn>50.000<\/mn><\/mrow><\/semantics><\/math>, and a 3.5-hour repair costs <strong>Rp155.000<\/strong>.<\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — parallel/perpendicular reasoning):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Line <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mo>ℓ<\/mo><mn>1<\/mn><\/msub><\/semantics><\/math> passes through <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>,<\/mo><mn>10<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>. Line <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mo>ℓ<\/mo><mn>2<\/mn><\/msub><\/semantics><\/math> is perpendicular to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mo>ℓ<\/mo><mn>1<\/mn><\/msub><\/semantics><\/math> and passes through <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo>,<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>. Find the equation of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mo>ℓ<\/mo><mn>2<\/mn><\/msub><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 54%\" />\n<col style=\"width: 31%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Find the slope of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mo>ℓ<\/mo><mn>1<\/mn><\/msub><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mn>10<\/mn><mo>−<\/mo><mn>4<\/mn><\/mrow><mrow><mn>2<\/mn><mo>−<\/mo><mn>0<\/mn><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mn>6<\/mn><mn>2<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Perpendicular slope = negative reciprocal of 3<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mo>−<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Use point-slope form with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo>,<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mo>−<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">distribute<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Simplify: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mo>−<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mi>x<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math>, then add 1 to both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mo>−<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mo>−<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/p>\n","text":"Example 1 (Warm-up — find the slope): Question: Find the slope of the line passing through ( 2 , 3 ) and ( 6 , 11 ) . Step Action Result 1 Apply the slope formula: m = 11 − 3 6 − 2 8 4 2 Simplify m = 2 Answer: m = 2 Example 2 (Write the equation given a point and slope): Question: Find the equation of a line with slope 3 passing through ( 1 , 5 ) . Step Action Result 1 Use point-slope form: y − y 1 = m ( x − x 1 ) y − 5 = 3 ( x − 1 ) 2 Distribute the 3 y − 5 = 3 x − 3 3 Add 5 to both sides to isolate y y = 3 x + 2 Answer: y = 3 x + 2 Example 3 (HOTS — real-world rate problem): Question: A phone repair shop charges a flat inspection fee of Rp50.000, plus Rp30.000 for every hour of labor. Write the equation relating total cost ( y ) to hours of labor ( x ), then find the cost for a 3.5-hour repair. Solution: Step What to Do Result 1 Identify m (rate per hour) and c (flat/starting fee) m = 30.000 , c = 50.000 2 Write the equation y = 30.000 x + 50.000 3 Substitute x = 3.5 : y = 30.000 ( 3.5 ) + 50.000 y = 105.000 + 50.000 Answer: The equation is y = 30.000 x + 50.000 , and a 3.5-hour repair costs Rp155.000 . Example 4 (Pure analogical, above HOTS — parallel/perpendicular reasoning): Question: Line ℓ 1 passes through ( 0 , 4 ) and ( 2 , 10 ) . Line ℓ 2 is perpendicular to ℓ 1 and passes through ( 3 , 1 ) . Find the equation of ℓ 2 . Solution: Step What to Do Result 1 Find the slope of ℓ 1 : m 1 = 10 − 4 2 − 0 = 6 2 m 1 = 3 2 Perpendicular slope = negative reciprocal of 3 m 2 = − 1 3 3 Use point-slope form with ( 3 , 1 ) : y − 1 = − 1 3 ( x − 3 ) distribute 4 Simplify: y − 1 = − 1 3 x + 1 , then add 1 to both sides y = − 1 3 x + 2 Answer: y = − 1 3 x + 2","min":2,"ex":true},{"id":"8-c1-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Flipping the slope formula’s numerator and denominator inconsistently.<\/strong> Whichever point you call <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>,<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>, its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> must both go <em>first<\/em> in the subtraction — don’t mix <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><\/mrow><\/semantics><\/math> with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><\/mrow><\/semantics><\/math>.<\/li>\n<li><strong>Forgetting to flip <em>and<\/em> negate for perpendicular slopes<\/strong> — doing only one of the two steps is a very common half-mistake.<\/li>\n<li><strong>Confusing<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m<\/mi><\/semantics><\/math> <strong>and<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math> when reading a word problem — the <em>rate<\/em> (per unit) is always <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m<\/mi><\/semantics><\/math>; the <em>starting/flat<\/em> amount is always <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math>.<\/li>\n<\/ul>\n","text":"Flipping the slope formula’s numerator and denominator inconsistently. Whichever point you call ( x 1 , y 1 ) , its y and x must both go first in the subtraction — don’t mix y 2 − y 1 with x 1 − x 2 . Forgetting to flip and negate for perpendicular slopes — doing only one of the two steps is a very common half-mistake. Confusing m and c when reading a word problem — the rate (per unit) is always m ; the starting/flat amount is always c .","min":2,"ex":false},{"id":"8-c1-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Slope of the line through (2,3) and (6,11)? A shop charges Rp50.000 flat plus Rp30.000 per hour. In y = mx + c, c is… A line parallel to y = 2x + 1 has slope… A line perpendicular to slope 3 has slope…","min":2,"ex":false,"quiz":true}]},{"id":"8-c2","title":"Angles","raw":"2. Angles","sections":[{"id":"8-c2-s1","title":"Lines — The Building Blocks of Angles","html":"\n<p>Before angles, we need to understand how two straight lines can relate to each other on a flat plane:<\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Relationship<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Description<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Sketch<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Intersecting<\/strong><\/td>\n<td style=\"text-align: left;\">Cross at exactly 1 point<\/td>\n<td style=\"text-align: left;\">✕<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Overlapping<\/strong><\/td>\n<td style=\"text-align: left;\">Share more than 1 point (they’re the same line)<\/td>\n<td style=\"text-align: left;\">═<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Parallel<\/strong><\/td>\n<td style=\"text-align: left;\">Never intersect, no matter how far extended<\/td>\n<td style=\"text-align: left;\">‖<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Perpendicular<\/strong><\/td>\n<td style=\"text-align: left;\">Intersect at 1 point and form a 90° angle<\/td>\n<td style=\"text-align: left;\">⊥<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>An <strong>angle<\/strong> is the “opening” formed where two lines (or line segments) meet at a shared point, called the <strong>vertex<\/strong>.<\/p>\n","text":"Before angles, we need to understand how two straight lines can relate to each other on a flat plane: Relationship Description Sketch Intersecting Cross at exactly 1 point ✕ Overlapping Share more than 1 point (they’re the same line) ═ Parallel Never intersect, no matter how far extended ‖ Perpendicular Intersect at 1 point and form a 90° angle ⊥ An angle is the “opening” formed where two lines (or line segments) meet at a shared point, called the vertex .","min":2,"ex":false},{"id":"8-c2-s2","title":"Types of Angles, By Size","html":"\n<pre><code>[DIAGRAM: Angle sizes on a semicircle protractor sketch]\n0°────30°────90°────150°────180°\nZero  Acute  Right   Obtuse  Straight<\/code><\/pre>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Angle<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Range<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Visual cue<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Zero degree<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">A flat line with no opening<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Acute<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&lt;<\/mo><mn>90<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">A “sharp,” narrow opening<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Right<\/td>\n<td style=\"text-align: left;\">exactly <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">A perfect corner (like a book edge)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Obtuse<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&gt;<\/mo><mn>90<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&lt;<\/mo><mn>180<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">A “wide,” blunt opening<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Straight<\/td>\n<td style=\"text-align: left;\">exactly <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>180<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">A perfectly flat line<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Reflex<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&gt;<\/mo><mn>180<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&lt;<\/mo><mn>360<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">The “outside” of a normal angle — bigger than a straight line<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Full rotation<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>360<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">A complete circle back to start<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"[DIAGRAM: Angle sizes on a semicircle protractor sketch] 0°────30°────90°────150°────180° Zero Acute Right Obtuse Straight Angle Range Visual cue Zero degree 0 ∘ A flat line with no opening Acute < 90 ∘ A “sharp,” narrow opening Right exactly 90 ∘ A perfect corner (like a book edge) Obtuse > 90 ∘ and < 180 ∘ A “wide,” blunt opening Straight exactly 180 ∘ A perfectly flat line Reflex > 180 ∘ and < 360 ∘ The “outside” of a normal angle — bigger than a straight line Full rotation 360 ∘ A complete circle back to start","min":2,"ex":false},{"id":"8-c2-s3","title":"Complementary and Supplementary Angles","html":"\n<ul>\n<li><strong>Complementary angles<\/strong> add up to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. Memory hook: “Complementary” and “Corner” both start with C, and 90° is a corner.<\/li>\n<li><strong>Supplementary angles<\/strong> add up to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>180<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. Memory hook: “Supplementary” and “Straight” — think of two angles laid flat in a straight line.<\/li>\n<\/ul>\n","text":"Complementary angles add up to 90 ∘ . Memory hook: “Complementary” and “Corner” both start with C, and 90° is a corner. Supplementary angles add up to 180 ∘ . Memory hook: “Supplementary” and “Straight” — think of two angles laid flat in a straight line.","min":2,"ex":false},{"id":"8-c2-s4","title":"Triangle Angle Sum","html":"\n<p>No matter what shape or size a triangle is, its three interior angles <strong>always add up to exactly 180°.<\/strong> This single fact is one of the most-used rules in all of geometry — you’ll rely on it constantly in Grade 9’s Congruency, Similarity, and Circle chapters.<\/p>\n","text":"No matter what shape or size a triangle is, its three interior angles always add up to exactly 180°. This single fact is one of the most-used rules in all of geometry — you’ll rely on it constantly in Grade 9’s Congruency, Similarity, and Circle chapters.","min":2,"ex":false},{"id":"8-c2-s5","title":"Worked Examples — Angles (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — complementary):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Two angles are complementary. One of them is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>37<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. Find the other.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><mo>−<\/mo><mn>37<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><mo>=<\/mo><mn>53<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <strong>53°<\/strong><\/p>\n<p><strong>Example 2 (Supplementary, algebraic):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Two angles are supplementary. One angle is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>
