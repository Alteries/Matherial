><mrow><mi>E<\/mi><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>6<\/mn><mo>×<\/mo><mn>30<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo>×<\/mo><mn>20<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mn>6<\/mn><mo>+<\/mo><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>180<\/mn><mo>+<\/mo><mn>80<\/mn><\/mrow><mn>10<\/mn><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Simplify<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>260<\/mn><mn>10<\/mn><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mi>F<\/mi><mo>=<\/mo><mn>26<\/mn><\/mrow><\/semantics><\/math> m<\/p>\n","text":"Example 1 (Warm-up — identifying a congruence condition): Question: Two triangles have two pairs of equal sides, and the angle between those two sides is also equal. Which congruence condition applies? Answer: SAS (Side-Angle-Side) — the equal angle is trapped between the two equal sides. Example 2 (Similarity ratio, direct application): Question: Triangle A B C ∼ triangle D E F . If A B = 6 , D E = 9 , and B C = 8 , find E F . Step Action Result 1 Find the scale factor: D E ÷ A B = 9 ÷ 6 3 2 2 Apply the same scale factor to B C : 8 × 3 2 12 Answer: E F = 12 Example 3 (HOTS — right triangle altitude formula): Question: In right triangle A B C (right angle at A ), the altitude A D is drawn to the hypotenuse B C . If B D = 4 and D C = 9 , find the length of A D . Solution: Step Action Result 1 Apply the altitude formula: A D 2 = B D × D C A D 2 = 4 × 9 2 Multiply A D 2 = 36 3 Square root A D = 6 Answer: A D = 6 Example 4 (Pure analogical, above HOTS — the trapezoid “belt” formula, real-world framing): Question: A trapezoid-shaped plot of land A B C D has a fence E F running parallel to both parallel sides, connecting points E (on side A D ) and F (on side B C ). Given A E = 6 m, E D = 4 m, A B = 20 m (one parallel side), and C D = 30 m (the other parallel side), find the length of fence E F . Solution: Step Action Result 1 Apply the trapezoid formula: E F = ( A E × C D ) + ( E D × A B ) A E + E D set up 2 Substitute: E F = ( 6 × 30 ) + ( 4 × 20 ) 6 + 4 180 + 80 10 3 Simplify 260 10 Answer: E F = 26 m","min":2,"ex":true},{"id":"9-c3-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Using SSA (Side-Side-Angle) as a congruence condition.<\/strong> This is <strong>not<\/strong> a valid shortcut — the angle must be <em>between<\/em> the two known sides (SAS), not off to the side.<\/li>\n<li><strong>Assuming similar shapes have equal sides.<\/strong> Similar shapes have <em>proportional<\/em>, not equal, sides — only congruent shapes require equal sides.<\/li>\n<li><strong>Mismatching corresponding vertices.<\/strong> When writing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mi>C<\/mi><mo>∼<\/mo><mi>D<\/mi><mi>E<\/mi><mi>F<\/mi><\/mrow><\/semantics><\/math>, vertex <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><\/semantics><\/math> corresponds to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>D<\/mi><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B<\/mi><\/semantics><\/math> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E<\/mi><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><\/semantics><\/math> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F<\/mi><\/semantics><\/math> — mixing up this order will give you the wrong ratios.<\/li>\n<\/ul>\n","text":"Using SSA (Side-Side-Angle) as a congruence condition. This is not a valid shortcut — the angle must be between the two known sides (SAS), not off to the side. Assuming similar shapes have equal sides. Similar shapes have proportional , not equal, sides — only congruent shapes require equal sides. Mismatching corresponding vertices. When writing A B C ∼ D E F , vertex A corresponds to D , B to E , C to F — mixing up this order will give you the wrong ratios.","min":2,"ex":false},{"id":"9-c3-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Two sides and the angle between them match. Which condition? Which is NOT a valid congruence condition? Similar shapes have… ABC ~ DEF, AB=6, DE=9, BC=8. EF = ? Right triangle altitude to hypotenuse splits it into BD=4 and DC=9. AD = ? Trapezoid belt: AE=6, ED=4, AB=20, CD=30. EF = ?","min":4,"ex":false,"quiz":true}]},{"id":"9-c4","title":"Circle","raw":"4. Circle","sections":[{"id":"9-c4-s1","title":"Parts of a Circle — Vocabulary First","html":"\n<pre><code>[DIAGRAM: Labeled circle]\n        Circumference (outer edge)\n             ╭───────╮\n           ╱   Sector   ╲\n          │  ╲    │Radius\n          │Chord╲ │\n          │    ╲  │\n           ╲  Segment ╱\n             ╰───────╯\n              Tangent (touches at 1 point, outside)<\/code><\/pre>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Term<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Circumference<\/strong><\/td>\n<td style=\"text-align: left;\">The outer edge/boundary of the circle<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Diameter<\/strong><\/td>\n<td style=\"text-align: left;\">Distance across the circle, through the center<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Radius<\/strong><\/td>\n<td style=\"text-align: left;\">Distance from center to edge (half the diameter)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Tangent<\/strong><\/td>\n<td style=\"text-align: left;\">A line touching the circle at exactly <em>one<\/em> point<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Arc<\/strong><\/td>\n<td style=\"text-align: left;\">A portion of the circumference<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Sector<\/strong><\/td>\n<td style=\"text-align: left;\">The “pizza slice” area enclosed by an arc and two radii<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Chord<\/strong><\/td>\n<td style=\"text-align: left;\">A straight line connecting two points <em>on<\/em> the circle<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Segment<\/strong><\/td>\n<td style=\"text-align: left;\">The area enclosed by an arc and a chord (the “leftover” after cutting off a sector’s triangle)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"[DIAGRAM: Labeled circle] Circumference (outer edge) ╭───────╮ ╱ Sector ╲ │ ╲ │Radius │Chord╲ │ │ ╲ │ ╲ Segment ╱ ╰───────╯ Tangent (touches at 1 point, outside) Term Meaning Circumference The outer edge/boundary of the circle Diameter Distance across the circle, through the center Radius Distance from center to edge (half the diameter) Tangent A line touching the circle at exactly one point Arc A portion of the circumference Sector The “pizza slice” area enclosed by an arc and two radii Chord A straight line connecting two points on the circle Segment The area enclosed by an arc and a chord (the “leftover” after cutting off a sector’s triangle)","min":2,"ex":false},{"id":"9-c4-s2","title":"Circle Angle Theorems","html":"\n<ul>\n<li><strong>Central vs. Inscribed:<\/strong> if they face (subtend) the same arc, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Central Angle<\/mtext><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mtext mathvariant=\"normal\">Inscribed Angle<\/mtext><\/mrow><\/semantics><\/math>.<\/li>\n<li><strong>Same Arc Rule:<\/strong> all inscribed angles facing the <em>same<\/em> arc are equal to each other.<\/li>\n<li><strong>Angle in a Semicircle:<\/strong> an inscribed angle facing the diameter is <strong>always exactly 90°.<\/strong><\/li>\n<li><strong>Cyclic Quadrilateral:<\/strong> opposite angles of a four-sided shape inscribed in a circle always add up to 180°.<\/li>\n<\/ul>\n","text":"Central vs. Inscribed: if they face (subtend) the same arc, Central Angle = 2 × Inscribed Angle . Same Arc Rule: all inscribed angles facing the same arc are equal to each other. Angle in a Semicircle: an inscribed angle facing the diameter is always exactly 90°. Cyclic Quadrilateral: opposite angles of a four-sided shape inscribed in a circle always add up to 180°.","min":2,"ex":false},{"id":"9-c4-s3","title":"Circle Formulas","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Circumference<\/mtext><mo>=<\/mo><mn>2<\/mn><mi>π<\/mi><mi>r<\/mi><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Area<\/mtext><mo>=<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Arc Length<\/mtext><mo>=<\/mo><mfrac><mi>θ<\/mi><mrow><mn>360<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/mfrac><mo>×<\/mo><mn>2<\/mn><mi>π<\/mi><mi>r<\/mi><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Sector Area<\/mtext><mo>=<\/mo><mfrac><mi>θ<\/mi><mrow><mn>360<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/mfrac><mo>×<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Segment Area<\/mtext><mo>=<\/mo><mtext mathvariant=\"normal\">Sector Area<\/mtext><mo>−<\/mo><mtext mathvariant=\"normal\">Area of the Central Triangle<\/mtext><\/mrow><\/semantics><\/math><\/p>\n","text":"Circumference = 2 π r Area = π r 2 Arc Length = θ 360 ∘ × 2 π r Sector Area = θ 360 ∘ × π r 2 Segment Area = Sector Area − Area of the Central Triangle","min":2,"ex":false},{"id":"9-c4-s4","title":"Tangent Properties","html":"\n<ul>\n<li>A tangent is always <strong>perpendicular (90°)<\/strong> to the radius at the point of contact — this creates a right angle you can use with the Pythagorean theorem.<\/li>\n<li>A line from the center that <strong>bisects a chord<\/strong> is always perpendicular to that chord.<\/li>\n<\/ul>\n<p><strong>Common Tangent Formulas (between two circles):<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">External tangent length<\/mtext><mo>=<\/mo><msqrt><mrow><msup><mi>p<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>R<\/mi><mo>−<\/mo><mi>r<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Internal tangent length<\/mtext><mo>=<\/mo><msqrt><mrow><msup><mi>p<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>R<\/mi><mo>+<\/mo><mi>r<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/semantics><\/math><\/p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p<\/mi><\/semantics><\/math> = distance between centers, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R<\/mi><\/semantics><\/math> = larger radius, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r<\/mi><\/semantics><\/math> = smaller radius.<\/p>\n","text":"A tangent is always perpendicular (90°) to the radius at the point of contact — this creates a right angle you can use with the Pythagorean theorem. A line from the center that bisects a chord is always perpendicular to that chord. Common Tangent Formulas (between two circles): External tangent length = p 2 − ( R − r ) 2 Internal tangent length = p 2 − ( R + r ) 2 where p = distance between centers, R = larger radius, r = smaller radius.","min":2,"ex":false},{"id":"9-c4-s5","title":"Worked Examples — Circle (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — inscribed angle):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A central angle measures <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>80<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. Find the inscribed angle subtending the same arc.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Inscribed angle = half the central angle: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>80<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><mo>÷<\/mo><mn>2<\/mn><mo>=<\/mo><mn>40<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Sector area):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the area of a sector with radius 7 cm and central angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>60<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. <em>(Use<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π<\/mi><mo>=<\/mo><mfrac><mn>22<\/mn><mn>7<\/mn><\/mfrac><\/mrow><\/semantics><\/math> <em>since 7 is a multiple of 7.)<\/em><\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 7%\" />\n<col style=\"width: 60%\" />\n<col style=\"width: 30%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Apply the formula: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>θ<\/mi><mn>360<\/mn><\/mfrac><mo>×<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mfrac><mn>60<\/mn><mn>360<\/mn><\/mfrac><mo>×<\/mo><mfrac><mn>22<\/mn><mn>7<\/mn><\/mfrac><mo>×<\/mo><msup><mn>7<\/mn><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">set up<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Simplify: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>60<\/mn><mn>360<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/semantics><\/math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>7<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mn>49<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><mo>×<\/mo><mfrac><mn>22<\/mn><mn>7<\/mn><\/mfrac><mo>×<\/mo><mn>49<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Multiply: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>22<\/mn><mn>7<\/mn><\/mfrac><mo>×<\/mo><mn>49<\/mn><mo>=<\/mo><mn>154<\/mn><\/mrow><\/semantics><\/math>, then <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>154<\/mn><mo>÷<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈<\/mo><mn>25.67<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> approximately <strong>25.67 cm²<\/strong><\/p>\n<p><strong>Example 3 (HOTS — tangent + Pythagorean theorem combined):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A point <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>P<\/mi><\/semantics><\/math> is 13 cm from the center of a circle with radius 5 cm. Find the length of the tangent line drawn from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>P<\/mi><\/semantics><\/math> to the circle.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> A tangent is perpendicular to the radius at the point of contact — this forms a right triangle with legs = radius and tangent length, and hypotenuse = the distance from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>P<\/mi><\/semantics><\/math> to the center.<\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 11%\" />\n<col style=\"width: 45%\" />\n<col style=\"width: 41%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Apply the Pythagorean theorem: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mtext mathvariant=\"normal\">tangent<\/mtext><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>d<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mtext mathvariant=\"normal\">tangent<\/mtext><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mn>5<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mn>13<\/mn><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Substitute and solve: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mtext mathvariant=\"normal\">tangent<\/mtext><mn>2<\/mn><\/msup><mo>=<\/mo><mn>169<\/mn><mo>−<\/mo><mn>25<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>144<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Square root<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>12<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The tangent length is <strong>12 cm<\/strong>.<\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — cyclic quadrilateral reasoning):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mi>C<\/mi><mi>D<\/mi><\/mrow><\/semantics><\/math> is a cyclic quadrilateral (all four vertices lie on the same circle). Angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>10<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math> and angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C<\/mi><\/semantics><\/math> (opposite angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><\/semantics><\/math>) <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>30<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>, then find the measure of angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A<\/mi><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Opposite angles in a cyclic quadrilateral sum to 180°: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>10<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>30<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>180<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">equation<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Combine like terms<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>40<\/mn><mo>=<\/mo><mn>180<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Subtract 40, divide by 5<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>28<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Substitute back: angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mn>3<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>28<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>94<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>28<\/mn><\/mrow><\/semantics><\/math>, and angle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mn>94<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>.<\/p>\n","text":"Example 1 (Warm-up — inscribed angle): Question: A central angle measures 80 ∘ . Find the inscribed angle subtending the same arc. Solution: Inscribed angle = half the central angle: 80 ∘ ÷ 2 = 40 ∘ Example 2 (Sector area): Question: Find the area of a sector with radius 7 cm and central angle 60 ∘ . (Use π = 22 7 since 7 is a multiple of 7.) Step Action Result 1 Apply the formula: θ 360 × π r 2 = 60 360 × 22 7 × 7 2 set up 2 Simplify: 60 360 = 1 6 , and 7 2 = 49 1 6 × 22 7 × 49 3 Multiply: 22 7 × 49 = 154 , then 154 ÷ 6 ≈ 25.67 Answer: approximately 25.67 cm² Example 3 (HOTS — tangent + Pythagorean theorem combined): Question: A point P is 13 cm from the center of a circle with radius 5 cm. Find the length of the tangent line drawn from P to the circle. Solution: A tangent is perpendicular to the radius at the point of contact — this forms a right triangle with legs = radius and tangent length, and hypotenuse = the distance from P to the center. Step Action Result 1 Apply the Pythagorean theorem: tangent 2 + r 2 = d 2 tangent 2 + 5 2 = 13 2 2 Substitute and solve: tangent 2 = 169 − 25 144 3 Square root 12 Answer: The tangent length is 12 cm . Example 4 (Pure analogical, above HOTS — cyclic quadrilateral reasoning): Question: A B C D is a cyclic quadrilateral (all four vertices lie on the same circle). Angle A = ( 3 x + 10 ) ∘ and angle C (opposite angle A ) = ( 2 x + 30 ) ∘ . Find x , then find the measure of angle A . Solution: Step Action Result 1 Opposite angles in a cyclic quadrilateral sum to 180°: ( 3 x + 10 ) + ( 2 x + 30 ) = 180 equation 2 Combine like terms 5 x + 40 = 180 3 Subtract 40, divide by 5 x = 28 4 Substitute back: angle A = 3 ( 28 ) + 10 94 ∘ Answer: x = 28 , and angle A = 94 ∘ .","min":2,"ex":true},{"id":"9-c4-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Mixing up central and inscribed angles.<\/strong> The central angle is <em>always twice<\/em> the inscribed angle facing the same arc — not equal to it.<\/li>\n<li><strong>Using the wrong value of<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>π<\/mi><\/semantics><\/math><strong>.<\/strong> Use <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>22<\/mn><mn>7<\/mn><\/mfrac><\/semantics><\/math> only when the radius is a multiple of 7; otherwise use <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>3.14<\/mn><\/semantics><\/math>.<\/li>\n<li><strong>Forgetting the segment ≠ the sector.<\/strong> A segment is the sector <em>minus<\/em> the triangular part — a very common area-formula mix-up.<\/li>\n<\/ul>\n","text":"Mixing up central and inscribed angles. The central angle is always twice the inscribed angle facing the same arc — not equal to it. Using the wrong value of π . Use 22 7 only when the radius is a multiple of 7; otherwise use 3.14 . Forgetting the segment ≠ the sector. A segment is the sector minus the triangular part — a very common area-formula mix-up.","min":2,"ex":false},{"id":"9-c4-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"A central angle is 80°. The inscribed angle on the same arc is… An inscribed angle facing the diameter measures… P is 13 cm from the centre of a circle with r = 5 cm. Tangent length? Opposite angles of a cyclic quadrilateral add to… Segment area equals… Sector area, r = 7 cm, θ = 60°, π = 22/7?","min":4,"ex":false,"quiz":true}]},{"id":"9-c5","title":"3D Shapes — Cylinder, Cone, and Sphere","raw":"5. 3D Shapes — Cylinder, Cone, and Sphere","sections":[{"id":"9-c5-s1","title":"Cylinder","html":"\n<p>Two identical circular bases connected by a curved wall.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Lateral Surface Area<\/mtext><mo>=<\/mo><mn>2<\/mn><mi>π<\/mi><mi>r<\/mi><mi>t<\/mi><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Total Surface Area<\/mtext><mo>=<\/mo><mn>2<\/mn><mi>π<\/mi><mi>r<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>r<\/mi><mo>+<\/mo><mi>t<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Volume<\/mtext><mo>=<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>t<\/mi><\/mrow><\/semantics><\/math><\/p>\n","text":"Two identical circular bases connected by a curved wall. Lateral Surface Area = 2 π r t Total Surface Area = 2 π r ( r + t ) Volume = π r 2 t","min":2,"ex":false},{"id":"9-c5-s2","title":"Cone","html":"\n<p>One circular base tapering to a single point (the apex).<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mtext mathvariant=\"normal\">Slant height: <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mi>s<\/mi><mo>=<\/mo><msqrt><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">(this is just the Pythagorean theorem again!)<\/mtext><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Lateral Surface Area<\/mtext><mo>=<\/mo><mi>π<\/mi><mi>r<\/mi><mi>s<\/mi><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Total Surface Area<\/mtext><mo>=<\/mo><mi>π<\/mi><mi>r<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>r<\/mi><mo>+<\/mo><mi>s<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Volume<\/mtext><mo>=<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>t<\/mi><\/mrow><\/semantics><\/math><\/p>\n","text":"One circular base tapering to a single point (the apex). Slant height: s = r 2 + t 2 (this is just the Pythagorean theorem again!) Lateral Surface Area = π r s Total Surface Area = π r ( r + s ) Volume = 1 3 π r 2 t","min":2,"ex":false},{"id":"9-c5-s3","title":"Sphere","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Surface Area<\/mtext><mo>=<\/mo><mn>4<\/mn><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">Volume<\/mtext><mo>=<\/mo><mfrac><mn>4<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mi>r<\/mi><mn>3<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n","text":"Surface Area = 4 π r 2 Volume = 4 3 π r 3","min":2,"ex":false},{"id":"9-c5-s4","title":"The Special 1 : 2 : 3 Relationship","html":"\n<p>If a cone, sphere, and cylinder all share the <em>same radius<\/em> and the <em>same height<\/em> (with the sphere’s height being its own diameter, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>2<\/mn><mi>r<\/mi><\/mrow><\/semantics><\/math>):<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Volume of Cone<\/mtext><mo>:<\/mo><mtext mathvariant=\"normal\">Volume of Sphere<\/mtext><mo>:<\/mo><mtext mathvariant=\"normal\">Volume of Cylinder<\/mtext><mo>=<\/mo><mn>1<\/mn><mo>:<\/mo><mn>2<\/mn><mo>:<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p>This means the cone is exactly <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/semantics><\/math> of the cylinder’s volume, and the sphere is exactly <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/semantics><\/math> — a genuinely elegant shortcut worth memorizing.<\/p>\n","text":"If a cone, sphere, and cylinder all share the same radius and the same height (with the sphere’s height being its own diameter, t = 2 r ): Volume of Cone : Volume of Sphere : Volume of Cylinder = 1 : 2 : 3 This means the cone is exactly 1 3 of the cylinder’s volume, and the sphere is exactly 2 3 — a genuinely elegant shortcut worth memorizing.","min":2,"ex":false},{"id":"9-c5-s5","title":"Worked Examples — 3D Shapes (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — cylinder volume):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the volume of a cylinder with radius 3 cm and height 10 cm. (Use <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π<\/mi><mo>≈<\/mo><mn>3.14<\/mn><\/mrow><\/semantics><\/math>)<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V<\/mi><mo>=<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>t<\/mi><mo>=<\/mo><mn>3.14<\/mn><mo>×<\/mo><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mo>×<\/mo><mn>10<\/mn><mo>=<\/mo><mn>3.14<\/mn><mo>×<\/mo><mn>90<\/mn><mo>=<\/mo><mn>282.6<\/mn><mspace width=\"0.167em\"><\/mspace><msup><mtext mathvariant=\"normal\">cm<\/mtext><mn>3<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Cone slant height, using Pythagorean theorem):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A cone has radius 6 cm and height 8 cm. Find its slant height.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s<\/mi><mo>=<\/mo><msqrt><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>=<\/mo><msqrt><mrow><mn>36<\/mn><mo>+<\/mo><mn>64<\/mn><\/mrow><\/msqrt><mo>=<\/mo><msqrt><mn>100<\/mn><\/msqrt><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math> cm<\/p>\n<p><strong>Example 3 (HOTS — using the 1:2:3 ratio shortcut):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A cylinder, cone, and sphere all share the same radius and height, with the cylinder’s volume equal to 900 cm³. Find the volume of the sphere.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Recall the ratio: Sphere = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/semantics><\/math> of the Cylinder’s volume<\/td>\n<td style=\"text-align: left;\">ratio applied<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Calculate: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><mo>×<\/mo><mn>900<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>600<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The sphere’s volume is <strong>600 cm³<\/strong>. <em>(Without this shortcut, you’d need to first find the shared radius from the cylinder’s volume, then plug it into the sphere formula separately — the ratio saves several steps.)<\/em><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — real-world container comparison):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> An ice cream shop sells a cone-shaped scoop (radius 4 cm, height 12 cm) and is considering switching to a hemisphere-shaped scoop (half a sphere) with the same radius. If they want the new hemisphere scoop to contain the <em>same volume of ice cream<\/em> as the cone, should the hemisphere’s radius be bigger, smaller, or the same as 4 cm? Justify using the volume formulas — no need to calculate an exact new radius.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 29%\" />\n<col style=\"width: 69%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Reasoning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Cone volume: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V<\/mi><mrow><mi>c<\/mi><mi>o<\/mi><mi>n<\/mi><mi>e<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mi>t<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>12<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>64<\/mn><mi>π<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Hemisphere volume (half a sphere): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V<\/mi><mrow><mi>h<\/mi><mi>e<\/mi><mi>m<\/mi><mi>i<\/mi><mi>s<\/mi><mi>p<\/mi><mi>h<\/mi><mi>e<\/mi><mi>r<\/mi><mi>e<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><mfrac><mn>4<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><msup><mi>r<\/mi><mn>3<\/mn><\/msup><\/mrow><\/semantics><\/math>. At <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><mi>π<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>64<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>≈<\/mo><mn>42.7<\/mn><mi>π<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Compare: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>64<\/mn><mi>π<\/mi><mo>&gt;<\/mo><mn>42.7<\/mn><mi>π<\/mi><\/mrow><\/semantics><\/math> — the cone currently holds <em>more<\/em> ice cream than a same-radius hemisphere<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Since the hemisphere at radius 4 holds <em>less<\/em> volume than the cone, the hemisphere’s radius must be made <strong>bigger<\/strong> than 4 cm to match the cone’s volume. <em>(This example tests whether a student can reason about volume formulas comparatively, without needing to solve a messy cube-root equation — a genuinely analytical, pre-olympiad-style skill.)<\/em><\/p>\n","text":"Example 1 (Warm-up — cylinder volume): Question: Find the volume of a cylinder with radius 3 cm and height 10 cm. (Use π ≈ 3.14 ) Solution: V = π r 2 t = 3.14 × 3 2 × 10 = 3.14 × 90 = 282.6 cm 3 Example 2 (Cone slant height, using Pythagorean theorem): Question: A cone has radius 6 cm and height 8 cm. Find its slant height. Solution: s = r 2 + t 2 = 36 + 64 = 100 = 10 cm Example 3 (HOTS — using the 1:2:3 ratio shortcut): Question: A cylinder, cone, and sphere all share the same radius and height, with the cylinder’s volume equal to 900 cm³. Find the volume of the sphere. Solution: Step Action Result 1 Recall the ratio: Sphere = 2 3 of the Cylinder’s volume ratio applied 2 Calculate: 2 3 × 900 600 Answer: The sphere’s volume is 600 cm³ . (Without this shortcut, you’d need to first find the shared radius from the cylinder’s volume, then plug it into the sphere formula separately — the ratio saves several steps.) Example 4 (Pure analogical, above HOTS — real-world container comparison): Question: An ice cream shop sells a cone-shaped scoop (radius 4 cm, height 12 cm) and is considering switching to a hemisphere-shaped scoop (half a sphere) with the same radius. If they want the new hemisphere scoop to contain the same volume of ice cream as the cone, should the hemisphere’s radius be bigger, smaller, or the same as 4 cm? Justify using the volume formulas — no need to calculate an exact new radius. Solution: Step Reasoning 1 Cone volume: V c o n e = 1 3 π r 2 t = 1 3 π ( 4 ) 2 ( 12 ) = 64 π 2 Hemisphere volume (half a sphere): V h e m i s p h e r e = 1 2 × 4 3 π r 2 = 2 3 π r 3 . At r = 4 : 2 3 π ( 64 ) ≈ 42.7 π 3 Compare: 64 π > 42.7 π — the cone currently holds more ice cream than a same-radius hemisphere Answer: Since the hemisphere at radius 4 holds less volume than the cone, the hemisphere’s radius must be made bigger than 4 cm to match the cone’s volume. (This example tests whether a student can reason about volume formulas comparatively, without needing to solve a messy cube-root equation — a genuinely analytical, pre-olympiad-style skill.)","min":2,"ex":true},{"id":"9-c5-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Using the cone’s height instead of its slant height<\/strong> in the surface area formula (or vice versa) — height (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t<\/mi><\/semantics><\/math>) is for volume; slant height (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s<\/mi><\/semantics><\/math>) is for lateral surface area.<\/li>\n<li><strong>Forgetting the<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/semantics><\/math> <strong>in the cone volume formula<\/strong> — a cone is not “the same as a cylinder,” it’s exactly one-third of one (same base, same height).<\/li>\n<li><strong>Applying the 1:2:3 ratio when the shapes do NOT share the same radius and height<\/strong> — the ratio only works under that specific shared condition.<\/li>\n<\/ul>\n","text":"Using the cone’s height instead of its slant height in the surface area formula (or vice versa) — height ( t ) is for volume; slant height ( s ) is for lateral surface area. Forgetting the 1 3 in the cone volume formula — a cone is not “the same as a cylinder,” it’s exactly one-third of one (same base, same height). Applying the 1:2:3 ratio when the shapes do NOT share the same radius and height — the ratio only works under that specific shared condition.","min":2,"ex":false},{"id":"9-c5-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Cylinder volume, r = 3 cm, h = 10 cm (π = 3.14)? Cone with r = 6 and t = 8. Slant height? Volume of a cone is… Cone : Sphere : Cylinder (same r, t = 2r) volume ratio? Cylinder volume is 900 cm³. Sphere with the same r and height? Sphere surface area is…","min":4,"ex":false,"quiz":true}]},{"id":"9-c6","title":"Geometric Transformations","raw":"6. Geometric Transformations","sections":[{"id":"9-c6-s1","title":"The Four Transformation Types, At a Glance","html":"\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 43%\" />\n<col style=\"width: 28%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Transformation<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What It Does<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Everyday Analogy<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Translation<\/strong><\/td>\n<td style=\"text-align: left;\">Slides a shape without turning or resizing it<\/td>\n<td style=\"text-align: left;\">Sliding a book across a table<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Reflection<\/strong><\/td>\n<td style=\"text-align: left;\">Flips a shape over a mirror line<\/td>\n<td style=\"text-align: left;\">Looking in a mirror<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Rotation<\/strong><\/td>\n<td style=\"text-align: left;\">Turns a shape around a fixed point<\/td>\n<td style=\"text-align: left;\">Spinning a wheel<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Dilation<\/strong><\/td>\n<td style=\"text-align: left;\">Enlarges or shrinks a shape, same proportions<\/td>\n<td style=\"text-align: left;\">Zooming a photo in/out<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Transformation What It Does Everyday Analogy Translation Slides a shape without turning or resizing it Sliding a book across a table Reflection Flips a shape over a mirror line Looking in a mirror Rotation Turns a shape around a fixed point Spinning a wheel Dilation Enlarges or shrinks a shape, same proportions Zooming a photo in/out","min":2,"ex":false},{"id":"9-c6-s2","title":"Translation","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mover><mo>→<\/mo><mrow><mi>T<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>,<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mover><mi>A<\/mi><mi>′<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>a<\/mi><mo>,<\/mo><mi>y<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mi>a<\/mi><\/mrow><\/semantics><\/math> moves right, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mi>a<\/mi><\/mrow><\/semantics><\/math> moves left; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mi>b<\/mi><\/mrow><\/semantics><\/math> moves up, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mi>b<\/mi><\/mrow><\/semantics><\/math> moves down.<\/p>\n","text":"A ( x , y ) → T ( a , b ) A ′ ( x + a , y + b ) + a moves right, − a moves left; + b moves up, − b moves down.","min":2,"ex":false},{"id":"9-c6-s3","title":"Reflection","html":"\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 45%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Mirror Line<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Rule<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>-axis<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>→<\/mo><mi>A<\/mi><mi>′<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mo>−<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math>-axis<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>→<\/mo><mi>A<\/mi><mi>′<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Origin <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>0<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>→<\/mo><mi>A<\/mi><mi>′<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mi>x<\/mi><mo>,<\/mo><mo>−<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Line <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>x<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>→<\/mo> <mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> is dilated with a scale factor of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/semantics><\/math> around center <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>,<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>. Find the image point.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 57%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Shift D relative to center: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mi>h<\/mi><mo>,<\/mo><mi>y<\/mi><mo>−<\/mo><mi>k<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>6<\/mn><mo>−<\/mo><mn>2<\/mn><mo>,<\/mo><mn>8<\/mn><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Apply the scale factor: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k<\/mi><mo>×<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Shift back by adding the center’s coordinates: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>+<\/mo><mn>2<\/mn><mo>,<\/mo><mn>3<\/mn><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mi>′<\/mi><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> <em>(Sanity check: since the scale factor is<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/semantics><\/math> <em>(a shrink), the new point should be noticeably closer to center<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>,<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> <em>than the original<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>6<\/mn><mo>,<\/mo><mn>8<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> <em>was — and<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> <em>is indeed much closer. ✓)<\/em><\/p>\n","text":"Example 1 (Warm-up — translation): Question: Translate point A ( 2 , 3 ) by T ( 4 , − 1 ) . Solution: A ′ ( 2 + 4 , 3 + ( − 1 ) ) = A ′ ( 6 , 2 ) Example 2 (Reflection): Question: Reflect point B ( 5 , − 2 ) over the y -axis. Solution: Rule: ( x , y ) → ( − x , y ) . B ′ ( − 5 , − 2 ) Example 3 (HOTS — combined transformation, two steps in sequence): Question: Point C ( 3 , 4 ) is first rotated 90 ∘ counter-clockwise around the origin, then translated by T ( 2 , − 3 ) . Find the final position. Solution: Step Action Result 1 Apply 90 ∘ rotation rule: ( x , y ) → ( − y , x ) → ( 3 , 4 ) → ( − 4 , 3 ) C ′ ( − 4 , 3 ) 2 Apply translation: ( − 4 + 2 , 3 + ( − 3 ) ) C ″ ( − 2 , 0 ) Answer: Final position: ( − 2 , 0 ) Example 4 (Pure analogical, above HOTS — dilation around a non-origin center): Question: Point D ( 6 , 8 ) is dilated with a scale factor of 1 2 around center C ( 2 , 2 ) . Find the image point. Solution: Step Action Result 1 Shift D relative to center: ( x − h , y − k ) = ( 6 − 2 , 8 − 2 ) ( 4 , 6 ) 2 Apply the scale factor: k × ( 4 , 6 ) = 1 2 × ( 4 , 6 ) ( 2 , 3 ) 3 Shift back by adding the center’s coordinates: ( 2 + 2 , 3 + 2 ) ( 4 , 5 ) Answer: D ′ = ( 4 , 5 ) (Sanity check: since the scale factor is 1 2 (a shrink), the new point should be noticeably closer to center C ( 2 , 2 ) than the original D ( 6 , 8 ) was — and ( 4 , 5 ) is indeed much closer. ✓)","min":2,"ex":true},{"id":"9-c6-s7","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Applying dilation around the origin formula when the center is NOT the origin.<\/strong> Always use the shift-scale-unshift version for any center other than <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>0<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>.<\/li>\n<li><strong>Mixing up rotation directions.<\/strong> Positive angles go counter-clockwise; if a problem specifies clockwise, either use a negative angle or the equivalent “opposite” positive angle (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math> clockwise = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>270<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math> counter-clockwise).<\/li>\n<li><strong>Forgetting the order of combined transformations matters.<\/strong> Rotating-then-translating (Example 3) can give a <em>different<\/em> final answer than translating-then-rotating — always follow the order stated in the problem.<\/li>\n<\/ul>\n","text":"Applying dilation around the origin formula when the center is NOT the origin. Always use the shift-scale-unshift version for any center other than ( 0 , 0 ) . Mixing up rotation directions. Positive angles go counter-clockwise; if a problem specifies clockwise, either use a negative angle or the equivalent “opposite” positive angle ( 90 ∘ clockwise = 270 ∘ counter-clockwise). Forgetting the order of combined transformations matters. Rotating-then-translating (Example 3) can give a different final answer than translating-then-rotating — always follow the order stated in the problem.","min":2,"ex":false},{"id":"9-c6-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Translate A(2,3) by T(4,−1). Reflect B(5,−2) over the y-axis. Rotation 90° counter-clockwise about the origin: (x, y) → Reflection over the line y = x: (x, y) → D(6,8) dilated by factor 1/2 around centre (2,2). Rotating then translating versus translating then rotating…","min":4,"ex":false,"quiz":true}]}]},{"id":"tka","name":"TKA prep","sub":"Tka Exam Prep (Kelas 9)","chapters":[{"id":"tka-c1","title":"Pengantar: Bagaimana Cara Memakai Bagian Ini","raw":"Pengantar: Bagaimana Cara Memakai Bagian Ini","sections":[{"id":"tka-c1-s0","title":"Pengantar: Bagaimana Cara Memakai Bagian Ini","html":"\n<p>If you’ve worked through Grade 7, 8, and 9 in this module, you already have almost everything you need for the TKA. This section is <strong>not<\/strong> a repeat of those chapters — repeating material you already know wastes your time and makes you tune out. Instead, this section does three things:<\/p>\n<ol type=\"1\">\n<li><strong>“Quick Recall” boxes<\/strong> — a 30-second refresher with a pointer back to the exact Grade/Section where you learned it in full, for anything that already appeared earlier in this module.<\/li>\n<li><strong>Genuinely new material<\/strong> the TKA tests but that Grade 7–9 alone doesn’t fully cover (Sequences &amp; Series, Scientific Notation, Quartiles, Systems of Equations, Inequalities).<\/li>\n<li><strong>Mixed, cross-topic problems<\/strong> at the end — because the real TKA rarely asks a “pure” question from just one chapter. It blends topics, and that blending is a skill in itself that needs its own practice.<\/li>\n<\/ol>\n","text":"If you’ve worked through Grade 7, 8, and 9 in this module, you already have almost everything you need for the TKA. This section is not a repeat of those chapters — repeating material you already know wastes your time and makes you tune out. Instead, this section does three things: “Quick Recall” boxes — a 30-second refresher with a pointer back to the exact Grade/Section where you learned it in full, for anything that already appeared earlier in this module. Genuinely new material the TKA tests but that Grade 7–9 alone doesn’t fully cover (Sequences & Series, Scientific Notation, Quartiles, Systems of Equations, Inequalities). Mixed, cross-topic problems at the end — because the real TKA rarely asks a “pure” question from just one chapter. It blends topics, and that blending is a skill in itself that needs its own practice.","min":2,"ex":false}]},{"id":"tka-c2","title":"Number System — Completing the Picture","raw":"A. Number System — Completing the Picture","sections":[{"id":"tka-c2-s1","title":"The Family Tree of Numbers","html":"\n<p>Every number you’ve ever worked with belongs to a “family” — and the families are nested inside each other, like Russian nesting dolls. Understanding this hierarchy is what lets you correctly classify <em>any<\/em> number the TKA throws at you.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Natural Numbers<\/mtext><mo>⊂<\/mo><mtext mathvariant=\"normal\">Whole Numbers<\/mtext><mo>⊂<\/mo><mtext mathvariant=\"normal\">Integers<\/mtext><mo>⊂<\/mo><mtext mathvariant=\"normal\">Rational Numbers<\/mtext><mo>⊂<\/mo><mtext mathvariant=\"normal\">Real Numbers<\/mtext><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Irrational Numbers<\/mtext><mo>⊂<\/mo><mtext mathvariant=\"normal\">Real Numbers<\/mtext><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> (but separate from Rational)<\/mtext><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 21%\" />\n<col style=\"width: 45%\" />\n<col style=\"width: 30%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Family<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Definition<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Examples<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Natural<\/strong><\/td>\n<td style=\"text-align: left;\">Basic counting numbers<\/td>\n<td style=\"text-align: left;\">1, 2, 3, 4, …<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Whole<\/strong><\/td>\n<td style=\"text-align: left;\">Natural numbers + zero<\/td>\n<td style=\"text-align: left;\">0, 1, 2, 3, …<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Integer<\/strong><\/td>\n<td style=\"text-align: left;\">Whole numbers + their negatives<\/td>\n<td style=\"text-align: left;\">…, −2, −1, 0, 1, 2, …<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Rational<\/strong><\/td>\n<td style=\"text-align: left;\">Can be written as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><\/semantics><\/math>, where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>,<\/mo><mi>b<\/mi><\/mrow><\/semantics><\/math> are integers, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>≠<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0.75<\/mn><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>6<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Irrational<\/strong><\/td>\n<td style=\"text-align: left;\"><em>Cannot<\/em> be written as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>7<\/mn><\/msqrt><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>π<\/mi><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>The single best way to check if a number belongs to a family: try to place it and see which boxes it satisfies.<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 15%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 15%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 18%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Number<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Natural?<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Whole?<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Integer?<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Rational?<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Irrational?<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>7<\/mn><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0<\/mn><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>7<\/mn><\/msqrt><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>36<\/mn><\/msqrt><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✓<\/td>\n<td style=\"text-align: left;\">✗<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>The trap in the last row:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>36<\/mn><\/msqrt><\/semantics><\/math> <em>looks<\/em> irrational because it has a root sign — but <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>36<\/mn><\/msqrt><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math>, a perfectly ordinary whole number. <strong>A root sign does not automatically mean “irrational.”<\/strong> Only check the <em>simplified<\/em> value.<\/p>\n","text":"Every number you’ve ever worked with belongs to a “family” — and the families are nested inside each other, like Russian nesting dolls. Understanding this hierarchy is what lets you correctly classify any number the TKA throws at you. Natural Numbers ⊂ Whole Numbers ⊂ Integers ⊂ Rational Numbers ⊂ Real Numbers Irrational Numbers ⊂ Real Numbers (but separate from Rational) Family Definition Examples Natural Basic counting numbers 1, 2, 3, 4, … Whole Natural numbers + zero 0, 1, 2, 3, … Integer Whole numbers + their negatives …, −2, −1, 0, 1, 2, … Rational Can be written as a b , where a , b are integers, b ≠ 0 1 2 , − 3 , 0.75 , 6 Irrational Cannot be written as a b 7 , π The single best way to check if a number belongs to a family: try to place it and see which boxes it satisfies. Number Natural? Whole? Integer? Rational? Irrational? 7 ✓ ✓ ✓ ✓ ✗ 0 ✗ ✓ ✓ ✓ ✗ − 4 ✗ ✗ ✓ ✓ ✗ 3 4 ✗ ✗ ✗ ✓ ✗ 7 ✗ ✗ ✗ ✗ ✓ 36 ✓ ✓ ✓ ✓ ✗ The trap in the last row: 36 looks irrational because it has a root sign — but 36 = 6 , a perfectly ordinary whole number. A root sign does not automatically mean “irrational.” Only check the simplified value.","min":2,"ex":false},{"id":"tka-c2-s2","title":"Quick Recall — Integer Operations","html":"\n<p><em>(Full explanation and 15 worked examples: <strong>Grade 7 → Section 1<\/strong>)<\/em><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Operation<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Rule<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Addition, same signs<\/td>\n<td style=\"text-align: left;\">Add absolute values, keep the sign<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Addition, different signs<\/td>\n<td style=\"text-align: left;\">Subtract absolute values, keep the “stronger” sign<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Subtraction<\/td>\n<td style=\"text-align: left;\">Keep–Change–Change, then use addition rules<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Multiplication/Division<\/td>\n<td style=\"text-align: left;\">Same signs → positive; different signs → negative<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"(Full explanation and 15 worked examples: Grade 7 → Section 1 ) Operation Rule Addition, same signs Add absolute values, keep the sign Addition, different signs Subtract absolute values, keep the “stronger” sign Subtraction Keep–Change–Change, then use addition rules Multiplication/Division Same signs → positive; different signs → negative","min":2,"ex":false},{"id":"tka-c2-s3","title":"The “Rules of the Game” — Properties of Integer Operations","html":"\n<p>These properties don’t teach you a new calculation — they explain <em>why<\/em> certain shortcuts and rearrangements are always safe to use.<\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 18%\" />\n<col style=\"width: 31%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Property<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What It Means<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Example<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Closure<\/strong> (add, subtract, multiply)<\/td>\n<td style=\"text-align: left;\">Two integers combined this way always produce <em>another integer<\/em> — you never “fall out” of the integer family<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>9<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mo>−<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math> (still an integer)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Commutative<\/strong> (add, multiply)<\/td>\n<td style=\"text-align: left;\">Order doesn’t matter<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo>=<\/mo><mi>b<\/mi><mo>+<\/mo><mi>a<\/mi><\/mrow><\/semantics><\/math>; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mi>b<\/mi><mo>=<\/mo><mi>b<\/mi><mo>×<\/mo><mi>a<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Identity<\/strong><\/td>\n<td style=\"text-align: left;\">Adding 0 or multiplying by 1 changes nothing<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>+<\/mo><mn>0<\/mn><mo>=<\/mo><mi>a<\/mi><\/mrow><\/semantics><\/math>; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mn>1<\/mn><mo>=<\/mo><mi>a<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Associative<\/strong> (add, multiply)<\/td>\n<td style=\"text-align: left;\">Grouping doesn’t matter<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mi>c<\/mi><mo>=<\/mo><mi>a<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>b<\/mi><mo>+<\/mo><mi>c<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Distributive<\/strong><\/td>\n<td style=\"text-align: left;\">Multiplying a sum equals multiplying each part separately, then adding<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>b<\/mi><mo>+<\/mo><mi>c<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>×<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>×<\/mo><mi>c<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why this matters practically:<\/strong> the Distributive Property is the exact reason “combining like terms” (Grade 7 → Section 3.3) and “factoring using GCF” (Grade 9 → Section 1.2) both work — they’re the same property used in opposite directions.<\/p>\n<p><strong>Quick check — is subtraction commutative?<\/strong> Try <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>−<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> vs <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>−<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>≠<\/mo><mo>−<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>. <strong>No<\/strong> — order matters for subtraction, which is exactly why Keep-Change-Change (Grade 7 → Section 1.6) needs to exist as its own careful procedure.<\/p>\n","text":"These properties don’t teach you a new calculation — they explain why certain shortcuts and rearrangements are always safe to use. Property What It Means Example Closure (add, subtract, multiply) Two integers combined this way always produce another integer — you never “fall out” of the integer family 4 + ( − 9 ) = − 5 (still an integer) Commutative (add, multiply) Order doesn’t matter a + b = b + a ; a × b = b × a Identity Adding 0 or multiplying by 1 changes nothing a + 0 = a ; a × 1 = a Associative (add, multiply) Grouping doesn’t matter ( a + b ) + c = a + ( b + c ) Distributive Multiplying a sum equals multiplying each part separately, then adding a × ( b + c ) = ( a × b ) + ( a × c ) Why this matters practically: the Distributive Property is the exact reason “combining like terms” (Grade 7 → Section 3.3) and “factoring using GCF” (Grade 9 → Section 1.2) both work — they’re the same property used in opposite directions. Quick check — is subtraction commutative? Try 5 − 3 vs 3 − 5 : 2 ≠ − 2 . No — order matters for subtraction, which is exactly why Keep-Change-Change (Grade 7 → Section 1.6) needs to exist as its own careful procedure.","min":2,"ex":false},{"id":"tka-c2-s4","title":"Prime Factorization and Estimation","html":"\n<p><strong>Prime Factorization<\/strong> means breaking a number down into the prime numbers that multiply together to make it — like finding a number’s most “basic ingredients.”<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the prime factorization of 12.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> The factors of 12 are 1, 2, 3, 4, 6, 12. Among these, the <em>prime<\/em> ones are 2 and 3. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>2<\/mn><mo>×<\/mo><mn>3<\/mn><mo>=<\/mo><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>×<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Estimation<\/strong> means quickly approximating a calculation’s result by rounding first — useful for sanity-checking an answer fast, without needing exact precision.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A shirt costs Rp78.900. Estimate this price to make mental math easier.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Rp78.900 is closer to Rp80.000 than to Rp70.000 (since 78.900 is well past the halfway point of 75.000), so round up to <strong>Rp80.000<\/strong>.<\/p>\n<p><em>(For decimal/rational numbers, the same idea applies but focuses on the tenths digit — see Section A.6 below.)<\/em><\/p>\n","text":"Prime Factorization means breaking a number down into the prime numbers that multiply together to make it — like finding a number’s most “basic ingredients.” Question: Find the prime factorization of 12. Solution: The factors of 12 are 1, 2, 3, 4, 6, 12. Among these, the prime ones are 2 and 3. 12 = 2 × 2 × 3 = 2 2 × 3 Estimation means quickly approximating a calculation’s result by rounding first — useful for sanity-checking an answer fast, without needing exact precision. Question: A shirt costs Rp78.900. Estimate this price to make mental math easier. Solution: Rp78.900 is closer to Rp80.000 than to Rp70.000 (since 78.900 is well past the halfway point of 75.000), so round up to Rp80.000 . (For decimal/rational numbers, the same idea applies but focuses on the tenths digit — see Section A.6 below.)","min":2,"ex":false},{"id":"tka-c2-s5","title":"Rational vs. Irratio
