\/mo><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>w<\/mi><mo>+<\/mo><mo>ℓ<\/mo><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>w<\/mi><mo>×<\/mo><mo>ℓ<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Parallelogram<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mi>a<\/mi><mo>×<\/mo><mi>t<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Rhombus<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mn>4<\/mn><mi>p<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><msub><mi>d<\/mi><mn>1<\/mn><\/msub><mo>×<\/mo><msub><mi>d<\/mi><mn>2<\/mn><\/msub><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Kite<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><msub><mi>d<\/mi><mn>1<\/mn><\/msub><mo>×<\/mo><msub><mi>d<\/mi><mn>2<\/mn><\/msub><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Trapezoid<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo>+<\/mo><mi>c<\/mi><mo>+<\/mo><mi>d<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>×<\/mo><mi>t<\/mi><\/mrow><mn>2<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Regular Polygon<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K<\/mi><mo>=<\/mo><mi>n<\/mi><mo>×<\/mo><mi>s<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><mi>K<\/mi><mo>×<\/mo><mtext mathvariant=\"normal\">Apothem<\/mtext><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Noticing the pattern:<\/strong> Rhombus and Kite share the <em>exact same<\/em> area formula (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><msub><mi>d<\/mi><mn>1<\/mn><\/msub><msub><mi>d<\/mi><mn>2<\/mn><\/msub><\/mrow><\/semantics><\/math>) because both shapes are built from two diagonals that cross at a right angle — the formula doesn’t care about the exact shape outline, only about those two diagonal lengths.<\/p>\n","text":"This is genuinely new material — Grade 7–9 never gathered all polygon formulas in one place. Having them side-by-side helps you see the family resemblance between shapes (notice how many area formulas are built from a “base × height” idea, just packaged differently). Shape Perimeter Area Triangle P = a + b + c A = 1 2 × b × h Square P = 4 a A = a 2 Rectangle P = 2 ( w + ℓ ) A = w × ℓ Parallelogram P = 2 ( a + b ) A = a × t Rhombus P = 4 p A = 1 2 × d 1 × d 2 Kite P = 2 ( a + b ) A = 1 2 × d 1 × d 2 Trapezoid P = a + b + c + d A = ( a + b ) × t 2 Regular Polygon K = n × s A = 1 2 × K × Apothem Noticing the pattern: Rhombus and Kite share the exact same area formula ( 1 2 d 1 d 2 ) because both shapes are built from two diagonals that cross at a right angle — the formula doesn’t care about the exact shape outline, only about those two diagonal lengths.","min":2,"ex":false},{"id":"tka-c4-s4","title":"Worked Examples — Geometry Consolidated (Cross-Topic)","html":"\n<p><strong>Example 1 (Warm-up — direct formula):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the area of a kite with diagonals 10 cm and 14 cm.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><mn>10<\/mn><mo>×<\/mo><mn>14<\/mn><mo>=<\/mo><mn>70<\/mn><mspace width=\"0.167em\"><\/mspace><msup><mtext mathvariant=\"normal\">cm<\/mtext><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Combines Pythagorean Theorem + polygon area):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A right triangle has legs 6 cm and 8 cm. Find its area, then find the perimeter (you’ll need the hypotenuse first).<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Area: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><mn>6<\/mn><mo>×<\/mo><mn>8<\/mn><mo>=<\/mo><mn>24<\/mn><mspace width=\"0.167em\"><\/mspace><msup><mtext mathvariant=\"normal\">cm<\/mtext><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> 2. Hypotenuse (Pythagorean theorem): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><msqrt><mrow><msup><mn>6<\/mn><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mn>8<\/mn><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>=<\/mo><msqrt><mn>100<\/mn><\/msqrt><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math> 3. Perimeter: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mn>6<\/mn><mo>+<\/mo><mn>8<\/mn><mo>+<\/mo><mn>10<\/mn><mo>=<\/mo><mn>24<\/mn><\/mrow><\/semantics><\/math> cm<\/p>\n<p><strong>Example 3 (HOTS — combines Similarity + polygon area):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Two similar rectangles have a side ratio of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>. If the smaller rectangle has an area of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>24<\/mn><mspace width=\"0.167em\"><\/mspace><msup><mtext mathvariant=\"normal\">cm<\/mtext><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math>, find the area of the larger rectangle. <em>(Hint: area scales by the square of the side ratio, not the side ratio itself.)<\/em><\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Side ratio = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>, so <strong>area ratio<\/strong> = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>:<\/mo><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mn>4<\/mn><mo>:<\/mo><mn>9<\/mn><\/mrow><\/semantics><\/math> 2. Set up a proportion: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>4<\/mn><mn>9<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>24<\/mn><msub><mi>A<\/mi><mrow><mi>l<\/mi><mi>a<\/mi><mi>r<\/mi><mi>g<\/mi><mi>e<\/mi><\/mrow><\/msub><\/mfrac><\/mrow><\/semantics><\/math> 3. Cross-multiply: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mo>×<\/mo><msub><mi>A<\/mi><mrow><mi>l<\/mi><mi>a<\/mi><mi>r<\/mi><mi>g<\/mi><mi>e<\/mi><\/mrow><\/msub><mo>=<\/mo><mn>9<\/mn><mo>×<\/mo><mn>24<\/mn><mo>=<\/mo><mn>216<\/mn><mo>⇒<\/mo><msub><mi>A<\/mi><mrow><mi>l<\/mi><mi>a<\/mi><mi>r<\/mi><mi>g<\/mi><mi>e<\/mi><\/mrow><\/msub><mo>=<\/mo><mn>54<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> The larger rectangle’s area is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>54<\/mn><mspace width=\"0.167em\"><\/mspace><msup><mtext mathvariant=\"normal\">cm<\/mtext><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math>. <em>(This is a classic TKA trap — students who forget to square the ratio will incorrectly answer 36.)<\/em><\/p>\n","text":"Example 1 (Warm-up — direct formula): Question: Find the area of a kite with diagonals 10 cm and 14 cm. Solution: A = 1 2 × 10 × 14 = 70 cm 2 Example 2 (Combines Pythagorean Theorem + polygon area): Question: A right triangle has legs 6 cm and 8 cm. Find its area, then find the perimeter (you’ll need the hypotenuse first). Solution: 1. Area: A = 1 2 × 6 × 8 = 24 cm 2 2. Hypotenuse (Pythagorean theorem): c = 6 2 + 8 2 = 100 = 10 3. Perimeter: P = 6 + 8 + 10 = 24 cm Example 3 (HOTS — combines Similarity + polygon area): Question: Two similar rectangles have a side ratio of 2 : 3 . If the smaller rectangle has an area of 24 cm 2 , find the area of the larger rectangle. (Hint: area scales by the square of the side ratio, not the side ratio itself.) Solution: 1. Side ratio = 2 : 3 , so area ratio = 2 2 : 3 2 = 4 : 9 2. Set up a proportion: 4 9 = 24 A l a r g e 3. Cross-multiply: 4 × A l a r g e = 9 × 24 = 216 ⇒ A l a r g e = 54 Answer: The larger rectangle’s area is 54 cm 2 . (This is a classic TKA trap — students who forget to square the ratio will incorrectly answer 36.)","min":2,"ex":true},{"id":"tka-c4-s5","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Forgetting to square the scale ratio when comparing areas of similar shapes<\/strong> (Example 3).<\/li>\n<li><strong>Using the wrong “height” in a trapezoid or parallelogram<\/strong> — it must be the <em>perpendicular<\/em> distance between the parallel sides, not a slanted side length.<\/li>\n<li><strong>Confusing when to add all sides (perimeter) vs. multiply (area)<\/strong> — always re-read what the question is actually asking for.<\/li>\n<\/ul>\n","text":"Forgetting to square the scale ratio when comparing areas of similar shapes (Example 3). Using the wrong “height” in a trapezoid or parallelogram — it must be the perpendicular distance between the parallel sides, not a slanted side length. Confusing when to add all sides (perimeter) vs. multiply (area) — always re-read what the question is actually asking for.","min":2,"ex":false},{"id":"tka-c4-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Area of a kite with diagonals 10 cm and 14 cm? Similar rectangles with side ratio 2:3. Smaller area 24 cm². Larger? Rhombus and kite share the area formula… Right triangle with legs 6 and 8. Perimeter? Trapezoid area is…","min":3,"ex":false,"quiz":true}]},{"id":"tka-c5","title":"Data & Probability — Going Deeper","raw":"D. Data & Probability — Going Deeper","sections":[{"id":"tka-c5-s1","title":"Quick Recall","html":"\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 21%\" />\n<col style=\"width: 38%\" />\n<col style=\"width: 38%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Topic<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Where You Learned It<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>10-Second Reminder<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Mean, Median, Mode<\/strong><\/td>\n<td style=\"text-align: left;\">Grade 8 → Section 4<\/td>\n<td style=\"text-align: left;\">Mean = sum ÷ count; Median = middle value (sorted); Mode = most frequent<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Basic Probability<\/strong><\/td>\n<td style=\"text-align: left;\">Grade 8 → Section 3<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Topic Where You Learned It 10-Second Reminder Mean, Median, Mode Grade 8 → Section 4 Mean = sum ÷ count; Median = middle value (sorted); Mode = most frequent Basic Probability Grade 8 → Section 3 P ( A ) = n ( A ) n ( S )","min":2,"ex":false},{"id":"tka-c5-s2","title":"Types and Collection of Data — Filling in the Vocabulary","html":"\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Classification<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Types<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Example<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>By nature<\/strong><\/td>\n<td style=\"text-align: left;\">Qualitative (descriptive) vs. Quantitative (numerical)<\/td>\n<td style=\"text-align: left;\">Favorite food (qualitative) vs. height (quantitative)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>By source<\/strong><\/td>\n<td style=\"text-align: left;\">Primary (collected yourself) vs. Secondary (from an existing source)<\/td>\n<td style=\"text-align: left;\">Measuring classmates’ heights (primary) vs. census data (secondary)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Five collection methods:<\/strong> Questionnaire/Survey, Experiment, Observation, Measurement, Interview — each simply describes <em>how<\/em> the data was physically gathered.<\/p>\n<p><strong>Five ways to present data<\/strong>, each suited to a different job:<\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Method<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Best For<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Table<\/strong><\/td>\n<td style=\"text-align: left;\">Grouping raw values/categories with their frequencies<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Bar Chart<\/strong><\/td>\n<td style=\"text-align: left;\">Comparing separate categories side-by-side<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Line Graph<\/strong><\/td>\n<td style=\"text-align: left;\">Showing a trend over continuous time<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Pie Chart<\/strong><\/td>\n<td style=\"text-align: left;\">Showing each category’s share of a whole (as %)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Histogram<\/strong><\/td>\n<td style=\"text-align: left;\">Showing the frequency distribution of continuous numerical data<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Classification Types Example By nature Qualitative (descriptive) vs. Quantitative (numerical) Favorite food (qualitative) vs. height (quantitative) By source Primary (collected yourself) vs. Secondary (from an existing source) Measuring classmates’ heights (primary) vs. census data (secondary) Five collection methods: Questionnaire/Survey, Experiment, Observation, Measurement, Interview — each simply describes how the data was physically gathered. Five ways to present data , each suited to a different job: Method Best For Table Grouping raw values/categories with their frequencies Bar Chart Comparing separate categories side-by-side Line Graph Showing a trend over continuous time Pie Chart Showing each category’s share of a whole (as %) Histogram Showing the frequency distribution of continuous numerical data","min":2,"ex":false},{"id":"tka-c5-s3","title":"Quartiles and the Interquartile Range (IQR) — Median’s Bigger Siblings","html":"\n<p><strong>The big picture:<\/strong> the median splits an ordered dataset into two equal halves. Quartiles take this one step further and split the data into <strong>four<\/strong> equal parts — giving you a much richer picture of how spread out the data is, not just where the middle sits.<\/p>\n<pre><code>[DIAGRAM: Ordered dataset split into quarters]\n|——25%——|——25%——|——25%——|——25%——|\nMin      Q1      Q2(Median)  Q3     Max<\/code><\/pre>\n<ul>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/semantics><\/math> (Lower Quartile) — the value below which 25% of the data falls<\/li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/semantics><\/math> — this <strong>is<\/strong> the median (50%)<\/li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>3<\/mn><\/msub><\/semantics><\/math> (Upper Quartile) — the value below which 75% of the data falls<\/li>\n<li><strong>Interquartile Range:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I<\/mi><mi>Q<\/mi><mi>R<\/mi><mo>=<\/mo><msub><mi>Q<\/mi><mn>3<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/mrow><\/semantics><\/math> — the spread of the “middle 50%” of the data, ignoring extreme outliers<\/li>\n<li><strong>Quartile Deviation:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q<\/mi><mi>d<\/mi><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msub><mi>Q<\/mi><mn>3<\/mn><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/li>\n<\/ul>\n<p><strong>Analogy:<\/strong> if the median is “the one representative in the middle of the room,” quartiles are like splitting the whole room into four equally-sized groups and asking where each group boundary stands — a much more complete snapshot of the whole crowd, not just its center.<\/p>\n","text":"The big picture: the median splits an ordered dataset into two equal halves. Quartiles take this one step further and split the data into four equal parts — giving you a much richer picture of how spread out the data is, not just where the middle sits. [DIAGRAM: Ordered dataset split into quarters] |——25%——|——25%——|——25%——|——25%——| Min Q1 Q2(Median) Q3 Max Q 1 (Lower Quartile) — the value below which 25% of the data falls Q 2 — this is the median (50%) Q 3 (Upper Quartile) — the value below which 75% of the data falls Interquartile Range: I Q R = Q 3 − Q 1 — the spread of the “middle 50%” of the data, ignoring extreme outliers Quartile Deviation: Q d = 1 2 ( Q 3 − Q 1 ) Analogy: if the median is “the one representative in the middle of the room,” quartiles are like splitting the whole room into four equally-sized groups and asking where each group boundary stands — a much more complete snapshot of the whole crowd, not just its center.","min":2,"ex":false},{"id":"tka-c5-s4","title":"Combined Mean — Averaging Two Groups Fairly","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mrow><mi>c<\/mi><mi>o<\/mi><mi>m<\/mi><mi>b<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>1<\/mn><\/msub><mo>⋅<\/mo><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mn>2<\/mn><\/msub><mo>⋅<\/mo><msub><mi>n<\/mi><mn>2<\/mn><\/msub><\/mrow><mrow><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>n<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Why you can’t just average the two averages directly:<\/strong> if Class A (30 students) averages 80, and Class B (10 students) averages 60, the <em>combined<\/em> average is <strong>not<\/strong> simply <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mn>80<\/mn><mo>+<\/mo><mn>60<\/mn><\/mrow><mn>2<\/mn><\/mfrac><mo>=<\/mo><mn>70<\/mn><\/mrow><\/semantics><\/math> — that would unfairly treat both classes as equally “important” even though Class A has three times as many students. The formula weights each class’s average by <em>how many students<\/em> contributed to it — exactly like a weighted average.<\/p>\n","text":"x ‾ c o m b = x ‾ 1 ⋅ n 1 + x ‾ 2 ⋅ n 2 n 1 + n 2 Why you can’t just average the two averages directly: if Class A (30 students) averages 80, and Class B (10 students) averages 60, the combined average is not simply 80 + 60 2 = 70 — that would unfairly treat both classes as equally “important” even though Class A has three times as many students. The formula weights each class’s average by how many students contributed to it — exactly like a weighted average.","min":2,"ex":false},{"id":"tka-c5-s5","title":"Multi-Stage Sample Spaces, Relative Frequency & Expected Frequency","html":"\n<p><strong>Multi-stage sample space:<\/strong> when an experiment happens in stages (e.g., flip a coin, <em>then<\/em> roll a die), the total number of outcomes multiplies:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>×<\/mo><msub><mi>n<\/mi><mn>2<\/mn><\/msub><mo>×<\/mo><mi>…<\/mi><mo>×<\/mo><msub><mi>n<\/mi><mi>k<\/mi><\/msub><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Handy reference — common sample space sizes:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Experiment<\/strong><\/th>\n<th style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1 coin<\/td>\n<td style=\"text-align: left;\">2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2 coins<\/td>\n<td style=\"text-align: left;\">4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3 coins<\/td>\n<td style=\"text-align: left;\">8<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1 die<\/td>\n<td style=\"text-align: left;\">6<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">2 dice<\/td>\n<td style=\"text-align: left;\">36<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1 coin + 1 die<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>×<\/mo><mn>6<\/mn><mo>=<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Relative Frequency<\/strong> is probability estimated <em>empirically<\/em>, from actually running trials, rather than from counting theoretical outcomes:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F<\/mi><mi>r<\/mi><\/msub><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>P<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">(number of times A occurred<\/mtext><mo>÷<\/mo><mtext mathvariant=\"normal\">total trials run)<\/mtext><\/mrow><\/semantics><\/math><\/p>\n<p>This is different from <strong>Theoretical Probability<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow><\/semantics><\/math>, which is calculated <em>before<\/em> running any trials, just from counting possibilities. The two tend to get closer to each other the <em>more<\/em> trials you run — but they are not automatically equal.<\/p>\n<p><strong>Properties every probability must satisfy:<\/strong> - <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>≤<\/mo><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>≤<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math> — probability is never negative, never above 1 - <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math> → the event is impossible - <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math> → the event is certain - <strong>Complementary Event:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>A<\/mi><mi>c<\/mi><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> — the probability that A does <em>NOT<\/em> happen<\/p>\n<p><strong>Expected Frequency:<\/strong> how many times you’d <em>expect<\/em> an event to happen over <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> trials, based on its theoretical probability:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F<\/mi><mi>h<\/mi><\/msub><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mi>n<\/mi><mo>×<\/mo><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n","text":"Multi-stage sample space: when an experiment happens in stages (e.g., flip a coin, then roll a die), the total number of outcomes multiplies: n ( S ) = n 1 × n 2 × … × n k Handy reference — common sample space sizes: Experiment n ( S ) 1 coin 2 2 coins 4 3 coins 8 1 die 6 2 dice 36 1 coin + 1 die 2 × 6 = 12 Relative Frequency is probability estimated empirically , from actually running trials, rather than from counting theoretical outcomes: F r ( A ) = n ( A ) n ( P ) (number of times A occurred ÷ total trials run) This is different from Theoretical Probability P ( A ) = n ( A ) n ( S ) , which is calculated before running any trials, just from counting possibilities. The two tend to get closer to each other the more trials you run — but they are not automatically equal. Properties every probability must satisfy: - 0 ≤ P ( A ) ≤ 1 — probability is never negative, never above 1 - P ( A ) = 0 → the event is impossible - P ( A ) = 1 → the event is certain - Complementary Event: P ( A c ) = 1 − P ( A ) — the probability that A does NOT happen Expected Frequency: how many times you’d expect an event to happen over n trials, based on its theoretical probability: F h ( A ) = n × P ( A )","min":2,"ex":false},{"id":"tka-c5-s6","title":"Worked Examples — Data & Probability Extended (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — quartiles):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/semantics><\/math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>3<\/mn><\/msub><\/semantics><\/math> for the dataset: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>,<\/mo><mn>7<\/mn><mo>,<\/mo><mn>8<\/mn><mo>,<\/mo><mn>12<\/mn><mo>,<\/mo><mn>13<\/mn><mo>,<\/mo><mn>14<\/mn><mo>,<\/mo><mn>18<\/mn><mo>,<\/mo><mn>21<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Data is already sorted, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>8<\/mn><\/mrow><\/semantics><\/math> (even). 2. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/semantics><\/math> (median) = average of the 4th and 5th values: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mn>12<\/mn><mo>+<\/mo><mn>13<\/mn><\/mrow><mn>2<\/mn><\/mfrac><mo>=<\/mo><mn>12.5<\/mn><\/mrow><\/semantics><\/math> 3. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><\/semantics><\/math> = median of the lower half (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>,<\/mo><mn>7<\/mn><mo>,<\/mo><mn>8<\/mn><mo>,<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math>): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mn>7<\/mn><mo>+<\/mo><mn>8<\/mn><\/mrow><mn>2<\/mn><\/mfrac><mo>=<\/mo><mn>7.5<\/mn><\/mrow><\/semantics><\/math> 4. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q<\/mi><mn>3<\/mn><\/msub><\/semantics><\/math> = median of the upper half (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>13<\/mn><mo>,<\/mo><mn>14<\/mn><mo>,<\/mo><mn>18<\/mn><mo>,<\/mo><mn>21<\/mn><\/mrow><\/semantics><\/math>): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mn>14<\/mn><mo>+<\/mo><mn>18<\/mn><\/mrow><mn>2<\/mn><\/mfrac><mo>=<\/mo><mn>16<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Combined mean):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Class A (25 students) averages 78 on a test. Class B (15 students) averages 88. Find the combined average.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>x<\/mi><mo accent=\"true\">‾<\/mo><\/mover><mrow><mi>c<\/mi><mi>o<\/mi><mi>m<\/mi><mi>b<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mrow><mn>78<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>25<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>88<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mn>25<\/mn><mo>+<\/mo><mn>15<\/mn><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mn>1950<\/mn><mo>+<\/mo><mn>1320<\/mn><\/mrow><mn>40<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>3270<\/mn><mn>40<\/mn><\/mfrac><mo>=<\/mo><mn>81.75<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — mixes IQR with expected frequency):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> In a dataset of 8 values, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I<\/mi><mi>Q<\/mi><mi>R<\/mi><mo>=<\/mo><mn>8.5<\/mn><\/mrow><\/semantics><\/math>. Separately, a spinner has a <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/semantics><\/math> probability of landing on red. If the spinner is spun 200 times, how many times would you <em>expect<\/em> it to land on red — and is this expected frequency bigger or smaller than the IQR value?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Expected frequency: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F<\/mi><mi>h<\/mi><\/msub><mo>=<\/mo><mi>n<\/mi><mo>×<\/mo><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>200<\/mn><mo>×<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><mo>=<\/mo><mn>50<\/mn><\/mrow><\/semantics><\/math> 2. Compare: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50<\/mn><mo>&gt;<\/mo><mn>8.5<\/mn><\/mrow><\/semantics><\/math> — the expected frequency is much larger. <em>(This example is intentionally a bit unusual — it exists to make sure you don’t confuse an IQR, which describes data spread, with an expected frequency, which describes predicted event counts. They measure completely different things and should never be compared as if related — the “trick” here is realizing the comparison itself is a bit of a red herring, and simply computing both correctly is what matters.)<\/em><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A game has two independent stages: first flip a coin, then roll a die. If landing on “Heads” AND rolling a number greater than 4 counts as a win, find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mtext mathvariant=\"normal\">win<\/mtext><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, then use it to find the expected number of wins over 60 attempts.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Total sample space (multi-stage): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>6<\/mn><mo>=<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math> 2. Favorable outcomes: Heads (1 way) × rolling 5 or 6 (2 ways) = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>×<\/mo><mn>2<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math> 3. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mtext mathvariant=\"normal\">win<\/mtext><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mn>2<\/mn><mn>12<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/semantics><\/math> 4. Expected wins over 60 attempts: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F<\/mi><mi>h<\/mi><\/msub><mo>=<\/mo><mn>60<\/mn><mo>×<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mtext mathvariant=\"normal\">win<\/mtext><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/semantics><\/math>, and you’d expect <strong>10 wins<\/strong> out of 60 attempts.<\/p>\n","text":"Example 1 (Warm-up — quartiles): Question: Find Q 1 , Q 2 , and Q 3 for the dataset: 3 , 7 , 8 , 12 , 13 , 14 , 18 , 21 . Solution: 1. Data is already sorted, n = 8 (even). 2. Q 2 (median) = average of the 4th and 5th values: 12 + 13 2 = 12.5 3. Q 1 = median of the lower half ( 3 , 7 , 8 , 12 ): 7 + 8 2 = 7.5 4. Q 3 = median of the upper half ( 13 , 14 , 18 , 21 ): 14 + 18 2 = 16 Example 2 (Combined mean): Question: Class A (25 students) averages 78 on a test. Class B (15 students) averages 88. Find the combined average. Solution: x ‾ c o m b = 78 ( 25 ) + 88 ( 15 ) 25 + 15 = 1950 + 1320 40 = 3270 40 = 81.75 Example 3 (HOTS — mixes IQR with expected frequency): Question: In a dataset of 8 values, I Q R = 8.5 . Separately, a spinner has a 1 4 probability of landing on red. If the spinner is spun 200 times, how many times would you expect it to land on red — and is this expected frequency bigger or smaller than the IQR value? Solution: 1. Expected frequency: F h = n × P ( A ) = 200 × 1 4 = 50 2. Compare: 50 > 8.5 — the expected frequency is much larger. (This example is intentionally a bit unusual — it exists to make sure you don’t confuse an IQR, which describes data spread, with an expected frequency, which describes predicted event counts. They measure completely different things and should never be compared as if related — the “trick” here is realizing the comparison itself is a bit of a red herring, and simply computing both correctly is what matters.) Example 4 (Pure analogical, above HOTS): Question: A game has two independent stages: first flip a coin, then roll a die. If landing on “Heads” AND rolling a number greater than 4 counts as a win, find P ( win ) , then use it to find the expected number of wins over 60 attempts. Solution: 1. Total sample space (multi-stage): n ( S ) = 2 × 6 = 12 2. Favorable outcomes: Heads (1 way) × rolling 5 or 6 (2 ways) = 1 × 2 = 2 3. P ( win ) = 2 12 = 1 6 4. Expected wins over 60 attempts: F h = 60 × 1 6 = 10 Answer: P ( win ) = 1 6 , and you’d expect 10 wins out of 60 attempts.","min":3,"ex":true},{"id":"tka-c5-s7","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Forgetting that complementary probabilities must add to 1<\/strong> — if <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>0.3<\/mn><\/mrow><\/semantics><\/math>, then <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>A<\/mi><mi>c<\/mi><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> must be <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0.7<\/mn><\/semantics><\/math>, not something calculated separately from scratch.<\/li>\n<li><strong>Forgetting to sort the data first<\/strong> before finding the median or quartiles.<\/li>\n<li><strong>Averaging two group averages directly<\/strong> instead of using the weighted Combined Mean formula.<\/li>\n<li><strong>Confusing relative frequency (from actual trials) with theoretical probability (from counting outcomes)<\/strong> — they usually get <em>close<\/em> over many trials, but they are not automatically the same number.<\/li>\n<li><strong>Off-by-one errors when locating quartile positions<\/strong>, especially with even vs. odd numbers of data points — always double-check by re-splitting the sorted list into clear halves first.<\/li>\n<\/ul>\n","text":"Forgetting that complementary probabilities must add to 1 — if P ( A ) = 0.3 , then P ( A c ) must be 0.7 , not something calculated separately from scratch. Forgetting to sort the data first before finding the median or quartiles. Averaging two group averages directly instead of using the weighted Combined Mean formula. Confusing relative frequency (from actual trials) with theoretical probability (from counting outcomes) — they usually get close over many trials, but they are not automatically the same number. Off-by-one errors when locating quartile positions , especially with even vs. odd numbers of data points — always double-check by re-splitting the sorted list into clear halves first.","min":2,"ex":false},{"id":"tka-c5-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Q1 of 3, 7, 8, 12, 13, 14, 18, 21? IQR equals… Class A: 25 students avg 78. Class B: 15 students avg 88. Combined mean? Number of outcomes when tossing 3 coins? A spinner has P(red) = 1/4. Expected reds in 200 spins? Which display shows each category's share of a whole? Relative frequency is…","min":4,"ex":false,"quiz":true}]},{"id":"tka-c6","title":"Master Formula Cheat Sheet","raw":"E. Master Formula Cheat Sheet","sections":[{"id":"tka-c6-s0","title":"Master Formula Cheat Sheet","html":"\n<p><em>(One page, organized by domain, for final review before the exam.)<\/em><\/p>\n<p><strong>Number<\/strong> | Concept | Formula | |—|—| | Absolute value | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">|<\/mo><mi>n<\/mi><mo stretchy=\"true\" form=\"postfix\">|<\/mo><\/mrow><\/semantics><\/math> = distance from 0 | | Scientific notation | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><msup><mn>10<\/mn><mi>n<\/mi><\/msup><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>&lt;<\/mo><mi>a<\/mi><mo>&lt;<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math> | | Fraction addition/subtraction | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>±<\/mo><mfrac><mi>c<\/mi><mi>d<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mi>d<\/mi><mo>±<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><mrow><mi>b<\/mi><mi>d<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math> | | Fraction multiplication/division | <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<
