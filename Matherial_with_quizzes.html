ft;\">Loss from refunds: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>×<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>20.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>60.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Combine both losses (same signs, add absolute values): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>120.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>60.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>180.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Total loss: <strong>Rp180.000<\/strong>.<\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — mixes division and multiplication):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> The temperature on a mountain drops at a <em>constant rate<\/em> as you climb. It drops by a total of 24°C over a climb of 6 km. Assuming the rate stays constant, predict the temperature change over a 10 km climb.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Find the rate using division: total change ÷ total distance = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>24<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>÷<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math> °C/km<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Apply the rate to the new distance using multiplication: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>×<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>40<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Over a 10 km climb, the temperature would drop by <strong>40°C<\/strong>. <em>(This example quietly introduces the idea of “rate,” which becomes central later in Linear Equations in Grade 8 — the slope of a line is exactly this same idea.)<\/em><\/p>\n<p><strong>Example 5 (Conceptual trap):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mi>b<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math>, what can you conclude about the signs of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math>? Is it possible to know the <em>exact<\/em> signs of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math> individually just from this information?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mi>b<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math> (negative) only happens when the two numbers have different signs — one positive, one negative. But we <em>cannot<\/em> know which one is positive and which is negative — both <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>=<\/mo><mo>+<\/mo><mo>,<\/mo><mi>b<\/mi><mo>=<\/mo><mo>−<\/mo><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>=<\/mo><mo>−<\/mo><mo>,<\/mo><mi>b<\/mi><mo>=<\/mo><mo>+<\/mo><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> satisfy the condition.<\/p>\n<p><strong>Answer:<\/strong> They must have <strong>opposite signs<\/strong>, but their individual signs cannot be determined from this information alone. This is a genuine pre-analytical reasoning question — it tests whether the rule is understood as a two-way relationship, not just a lookup table.<\/p>\n","text":"Most textbooks just hand you this table: Combination Result Example Positive × Positive Positive 4 × 3 = 12 Negative × Negative Positive (−4) × (−3) = 12 Positive × Negative Negative 4 × (−3) = −12 Negative ÷ Positive Negative (−12) ÷ 3 = −4 That’s fine for memorizing, but it doesn’t explain why a negative times a negative becomes positive — which is the single most confusing rule in this whole chapter. Let’s actually see why, using a pattern instead of a rule to memorize. Building the pattern — Positive × Negative: Look at what happens to 3 × n as n counts down by 1 each time: 3 × 2 = 6 3 × 1 = 3 3 × 0 = 0 3 × ( − 1 ) = ? Notice the pattern: every time n drops by 1, the answer drops by 3 (6 → 3 → 0 → …). If we keep that pattern going, the next answer must be 0 − 3 = − 3 . So: 3 × ( − 1 ) = − 3 , 3 × ( − 2 ) = − 6 , … This is why positive × negative = negative — it’s not an arbitrary rule, it’s the only answer that keeps the pattern consistent. Building the pattern — Negative × Negative: Now do the same thing starting from ( − 3 ) × n : ( − 3 ) × 2 = − 6 ( − 3 ) × 1 = − 3 ( − 3 ) × 0 = 0 ( − 3 ) × ( − 1 ) = ? Each time n drops by 1, the answer goes up by 3 (−6 → −3 → 0 → …). Continuing the pattern: ( − 3 ) × ( − 1 ) = 3 , ( − 3 ) × ( − 2 ) = 6 , … This is why negative × negative = positive — the pattern of “going up by 3 each time” doesn’t just stop being true once n crosses into negative territory. Division follows the same rules as multiplication , because division is just the reverse operation: ( − 12 ) ÷ 3 = − 4 because − 4 × 3 = − 12 . Five Worked Examples — Multiplication & Division (Easy → Pure Analogical) Example 1 (Warm-up): Question: Calculate ( − 6 ) × 7 . Solution: Different signs → negative. 6 × 7 = 42 . ( − 6 ) × 7 = − 42 Example 2 (Slightly harder): Question: Calculate ( − 45 ) ÷ ( − 9 ) . Solution: Same signs (both negative) → positive. 45 ÷ 9 = 5 . ( − 45 ) ÷ ( − 9 ) = 5 Example 3 (HOTS — mixes multiplication and addition, business scenario): Question: A small online shop loses Rp15.000 in profit for every unsold item at the end of the month. If 8 items go unsold this month, and the shop also had to refund 3 customers Rp20.000 each, what is the shop’s total loss this month? Solution: Step What to Do Result 1 Loss from unsold items: 8 × ( − 15.000 ) − 120.000 2 Loss from refunds: 3 × ( − 20.000 ) − 60.000 3 Combine both losses (same signs, add absolute values): ( − 120.000 ) + ( − 60.000 ) − 180.000 Answer: Total loss: Rp180.000 . Example 4 (Pure analogical, above HOTS — mixes division and multiplication): Question: The temperature on a mountain drops at a constant rate as you climb. It drops by a total of 24°C over a climb of 6 km. Assuming the rate stays constant, predict the temperature change over a 10 km climb. Solution: Step What to Do Result 1 Find the rate using division: total change ÷ total distance = ( − 24 ) ÷ 6 − 4 °C/km 2 Apply the rate to the new distance using multiplication: ( − 4 ) × 10 − 40 Answer: Over a 10 km climb, the temperature would drop by 40°C . (This example quietly introduces the idea of “rate,” which becomes central later in Linear Equations in Grade 8 — the slope of a line is exactly this same idea.) Example 5 (Conceptual trap): Question: If a × b < 0 , what can you conclude about the signs of a and b ? Is it possible to know the exact signs of a and b individually just from this information? Solution: a × b < 0 (negative) only happens when the two numbers have different signs — one positive, one negative. But we cannot know which one is positive and which is negative — both ( a = + , b = − ) and ( a = − , b = + ) satisfy the condition. Answer: They must have opposite signs , but their individual signs cannot be determined from this information alone. This is a genuine pre-analytical reasoning question — it tests whether the rule is understood as a two-way relationship, not just a lookup table.","min":5,"ex":false},{"id":"7-c1-s8","title":"Common Mistakes Box","html":"\n<p>These are the specific errors students make most often on this topic. Recognizing them <em>before<\/em> you make them is half the battle.<\/p>\n<ul>\n<li><strong>Mistake 1 — Forgetting Keep-Change-Change applies to the whole term.<\/strong> In <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8<\/mn><mo>−<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>×<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>, students sometimes flip the sign of −2 but forget that multiplication comes before the sign flip in order of operations gets applied correctly — always resolve what’s inside the parentheses/exponents first (see Section 1.5’s order-of-operations foundation), <em>then<\/em> apply Keep-Change-Change to the subtraction step.<\/li>\n<li><strong>Mistake 2 — Treating “bigger digit” as “bigger number” for negatives.<\/strong> Thinking −10 &gt; −3 because “10 is a bigger number than 3.” Remember: for negatives, the <em>smaller<\/em> the absolute value, the <em>bigger<\/em> the actual number. −3 &gt; −10.<\/li>\n<li><strong>Mistake 3 — Dropping the sign of the “stronger” number in addition.<\/strong> In <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>8<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>, students sometimes calculate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8<\/mn><mo>−<\/mo><mn>5<\/mn><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> correctly but then write <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> instead of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>, forgetting to check which number was “stronger” (had the bigger absolute value).<\/li>\n<li><strong>Mistake 4 — Applying multiplication sign rules to addition.<\/strong> Some students think “negative + negative = positive” because they mix up the multiplication rule with addition. Addition rules and multiplication rules are <strong>different systems<\/strong> — always double check which operation you’re doing.<\/li>\n<li><strong>Mistake 5 — Losing track of double negatives in long expressions.<\/strong> In something like <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, count the negative signs: three negatives (odd number) means the final answer stays negative → <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>. An even number of negatives always cancels out to positive.<\/li>\n<\/ul>\n","text":"These are the specific errors students make most often on this topic. Recognizing them before you make them is half the battle. Mistake 1 — Forgetting Keep-Change-Change applies to the whole term. In 8 − ( − 2 ) × 3 , students sometimes flip the sign of −2 but forget that multiplication comes before the sign flip in order of operations gets applied correctly — always resolve what’s inside the parentheses/exponents first (see Section 1.5’s order-of-operations foundation), then apply Keep-Change-Change to the subtraction step. Mistake 2 — Treating “bigger digit” as “bigger number” for negatives. Thinking −10 > −3 because “10 is a bigger number than 3.” Remember: for negatives, the smaller the absolute value, the bigger the actual number. −3 > −10. Mistake 3 — Dropping the sign of the “stronger” number in addition. In ( − 8 ) + 5 , students sometimes calculate 8 − 5 = 3 correctly but then write + 3 instead of − 3 , forgetting to check which number was “stronger” (had the bigger absolute value). Mistake 4 — Applying multiplication sign rules to addition. Some students think “negative + negative = positive” because they mix up the multiplication rule with addition. Addition rules and multiplication rules are different systems — always double check which operation you’re doing. Mistake 5 — Losing track of double negatives in long expressions. In something like − ( − ( − 5 ) ) , count the negative signs: three negatives (odd number) means the final answer stays negative → − 5 . An even number of negatives always cancels out to positive.","min":2,"ex":false},{"id":"7-c1-s9","title":"Quick Recap Card","html":"\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 35%\" />\n<col style=\"width: 30%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Operation<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Rule<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Memory Hook<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Addition, same signs<\/strong><\/td>\n<td style=\"text-align: left;\">Add absolute values, keep the sign<\/td>\n<td style=\"text-align: left;\">“Walking further in the same direction”<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Addition, different signs<\/strong><\/td>\n<td style=\"text-align: left;\">Subtract smaller absolute value from larger, keep the “stronger” sign<\/td>\n<td style=\"text-align: left;\">“Tug-of-war — biggest pull wins”<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Subtraction<\/strong><\/td>\n<td style=\"text-align: left;\">Keep, Change, Change → then use addition rules<\/td>\n<td style=\"text-align: left;\">“KCC turns it into addition”<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Multiplication/Division, same signs<\/strong><\/td>\n<td style=\"text-align: left;\">Positive<\/td>\n<td style=\"text-align: left;\">“Same team = positive”<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Multiplication/Division, different signs<\/strong><\/td>\n<td style=\"text-align: left;\">Negative<\/td>\n<td style=\"text-align: left;\">“Different teams = negative”<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Operation Rule Memory Hook Addition, same signs Add absolute values, keep the sign “Walking further in the same direction” Addition, different signs Subtract smaller absolute value from larger, keep the “stronger” sign “Tug-of-war — biggest pull wins” Subtraction Keep, Change, Change → then use addition rules “KCC turns it into addition” Multiplication/Division, same signs Positive “Same team = positive” Multiplication/Division, different signs Negative “Different teams = negative”","min":2,"ex":false},{"id":"7-c1-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Which statement is true? (−8) + 5 = ? −8 − (−15) = ? The absolute value of −5 is… In (−3)×2, (−3)×1, (−3)×0, the answers rise by 3 each step. What is (−3)×(−1)? (−45) ÷ (−9) = ?","min":4,"ex":false,"quiz":true}]},{"id":"7-c2","title":"Ratio","raw":"2. Ratio","sections":[{"id":"7-c2-s1","title":"What Is a Ratio? Starting From Something Every Student Already Knows: Recipes","html":"\n<p>Imagine a recipe for iced tea says “2 parts sugar syrup to 5 parts water.” That relationship — 2 to 5 — is a <strong>ratio<\/strong>. It doesn’t tell you the <em>exact<\/em> amount of syrup or water; it tells you how they compare to each other. Whether you’re making a small glass or a giant pitcher, as long as you keep that 2-to-5 relationship, the tea tastes the same.<\/p>\n<blockquote>\n<p>A <strong>ratio<\/strong> compares two or more quantities to show how large one value is relative to another.<\/p>\n<\/blockquote>\n<p><strong>Three ways to write the same ratio<\/strong> (all mean exactly the same thing): 1. With a colon: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>:<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math> 2. With the word “to”: 3 to 4 3. As a fraction: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/semantics><\/math><\/p>\n","text":"Imagine a recipe for iced tea says “2 parts sugar syrup to 5 parts water.” That relationship — 2 to 5 — is a ratio . It doesn’t tell you the exact amount of syrup or water; it tells you how they compare to each other. Whether you’re making a small glass or a giant pitcher, as long as you keep that 2-to-5 relationship, the tea tastes the same. A ratio compares two or more quantities to show how large one value is relative to another. Three ways to write the same ratio (all mean exactly the same thing): 1. With a colon: 3 : 4 2. With the word “to”: 3 to 4 3. As a fraction: 3 4","min":2,"ex":false},{"id":"7-c2-s2","title":"Order Matters — This Is the #1 Source of Mistakes","html":"\n<p>Ratios are <strong>not<\/strong> like normal addition, where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>+<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>+<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> give the same answer. In a ratio, the <em>order you list the quantities in must match the order they’re described in the question.<\/em><\/p>\n<p><strong>Visual model:<\/strong><\/p>\n<pre><code>[DIAGRAM: Box of balls]\n🔴🔴🔴  🔵🔵🔵🔵🔵\n3 red balls        5 blue balls<\/code><\/pre>\n<ul>\n<li>Ratio of red to blue = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>:<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/li>\n<li>Ratio of blue to red = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>:<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/li>\n<\/ul>\n<p>These describe the <em>same box<\/em>, but they are <strong>different ratios<\/strong> because the order of description flipped. Always re-read the question to check which quantity is asked for first.<\/p>\n","text":"Ratios are not like normal addition, where 3 + 5 and 5 + 3 give the same answer. In a ratio, the order you list the quantities in must match the order they’re described in the question. Visual model: [DIAGRAM: Box of balls] 🔴🔴🔴 🔵🔵🔵🔵🔵 3 red balls 5 blue balls Ratio of red to blue = 3 : 5 Ratio of blue to red = 5 : 3 These describe the same box , but they are different ratios because the order of description flipped. Always re-read the question to check which quantity is asked for first.","min":2,"ex":false},{"id":"7-c2-s3","title":"Simplifying Ratios — Same Idea as Simplifying Fractions","html":"\n<p>A ratio is “simplified” when both numbers share no common factor except 1. You simplify by dividing both sides by their <strong>Greatest Common Divisor (GCD)<\/strong> — exactly like reducing a fraction to lowest terms.<\/p>\n<p><strong>Worked Example:<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Simplify the ratio <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mo>:<\/mo><mn>100<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Find the GCD of 20 and 100<\/td>\n<td style=\"text-align: left;\">GCD = 20<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Divide both numbers by the GCD: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mo>÷<\/mo><mn>20<\/mn><mo>=<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100<\/mn><mo>÷<\/mo><mn>20<\/mn><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>:<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mo>:<\/mo><mn>100<\/mn><mo>=<\/mo><mn>1<\/mn><mo>:<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/p>\n","text":"A ratio is “simplified” when both numbers share no common factor except 1. You simplify by dividing both sides by their Greatest Common Divisor (GCD) — exactly like reducing a fraction to lowest terms. Worked Example: Question: Simplify the ratio 20 : 100 . Step What to Do Result 1 Find the GCD of 20 and 100 GCD = 20 2 Divide both numbers by the GCD: 20 ÷ 20 = 1 , 100 ÷ 20 = 5 1 : 5 Answer: 20 : 100 = 1 : 5","min":2,"ex":false},{"id":"7-c2-s4","title":"Worked Examples — Ratio (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A class has 12 boys and 18 girls. Write the ratio of boys to girls in simplest form.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> GCD of 12 and 18 is 6. Divide both: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>÷<\/mo><mn>6<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>18<\/mn><mo>÷<\/mo><mn>6<\/mn><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Order-matters trap):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> In a fruit basket there are 8 apples and 20 mangoes. What is the ratio of mangoes to apples, in simplest form?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Notice the question asks for <strong>mangoes to apples<\/strong> — mangoes first. Ratio: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mo>:<\/mo><mn>8<\/mn><\/mrow><\/semantics><\/math>. GCD of 20 and 8 is 4. Divide both: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mo>÷<\/mo><mn>4<\/mn><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8<\/mn><mo>÷<\/mo><mn>4<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>:<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math> <em>(Writing<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math> <em>instead would be the classic order-reversal mistake.)<\/em><\/p>\n<p><strong>Example 3 (HOTS — ratio combined with real quantities):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A juice mix uses concentrate and water in the ratio <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math>. If Kiki wants to make 900 ml of juice total, how much concentrate and how much water does she need?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Add the ratio parts to find “how many parts total”: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>+<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">9 parts<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Find the value of 1 part: total volume ÷ total parts = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>900<\/mn><mo>÷<\/mo><mn>9<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">100 ml per part<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Concentrate = 2 parts: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>×<\/mo><mn>100<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">200 ml<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Water = 7 parts: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7<\/mn><mo>×<\/mo><mn>100<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">700 ml<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <strong>200 ml concentrate<\/strong> and <strong>700 ml water<\/strong>. <em>(Check:<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>200<\/mn><mo>+<\/mo><mn>700<\/mn><mo>=<\/mo><mn>900<\/mn><\/mrow><\/semantics><\/math> <em>✓)<\/em><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Two paint mixtures both use blue and yellow paint. Mixture A has a ratio of blue to yellow of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>:<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>. Mixture B has a ratio of blue to yellow of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>. If both mixtures are combined into one bucket, and Mixture A contributed 24 liters of blue paint, while Mixture B contributed 400 ml <em>less total paint<\/em> than Mixture A, find the total amount of yellow paint in the final combined bucket. <em>(Assume Mixture A’s total was 3.6 L.)<\/em><\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Mixture A: blue is 3 parts = 24 L, so 1 part = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>24<\/mn><mo>÷<\/mo><mn>3<\/mn><mo>=<\/mo><mn>8<\/mn><\/mrow><\/semantics><\/math> L. Yellow is 5 parts: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>×<\/mo><mn>8<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">40 L yellow (A)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Mixture A’s total paint (check against given): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.6<\/mn><mspace width=\"0.167em\"><\/mspace><mtext mathvariant=\"normal\">L<\/mtext><mo>=<\/mo><mn>3600<\/mn><mspace width=\"0.167em\"><\/mspace><mtext mathvariant=\"normal\">ml<\/mtext><\/mrow><\/semantics><\/math>; but blue alone is 24 L = 24000 ml, which is already bigger than the stated total — this is a contradiction in the problem.<\/td>\n<td style=\"text-align: left;\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> This problem is intentionally unsolvable as stated — the numbers contradict each other (blue paint alone already exceeds the stated total mixture volume). <em>(This is a deliberate “trap” example: real exams sometimes include problems with hidden inconsistencies, and a strong student should be able to notice the numbers don’t add up rather than force an answer. Always sanity-check your intermediate results against the given totals.)<\/em><\/p>\n","text":"Example 1 (Warm-up): Question: A class has 12 boys and 18 girls. Write the ratio of boys to girls in simplest form. Solution: GCD of 12 and 18 is 6. Divide both: 12 ÷ 6 = 2 , 18 ÷ 6 = 3 . Answer: 2 : 3 Example 2 (Order-matters trap): Question: In a fruit basket there are 8 apples and 20 mangoes. What is the ratio of mangoes to apples, in simplest form? Solution: Notice the question asks for mangoes to apples — mangoes first. Ratio: 20 : 8 . GCD of 20 and 8 is 4. Divide both: 20 ÷ 4 = 5 , 8 ÷ 4 = 2 . Answer: 5 : 2 (Writing 2 : 5 instead would be the classic order-reversal mistake.) Example 3 (HOTS — ratio combined with real quantities): Question: A juice mix uses concentrate and water in the ratio 2 : 7 . If Kiki wants to make 900 ml of juice total, how much concentrate and how much water does she need? Solution: Step What to Do Result 1 Add the ratio parts to find “how many parts total”: 2 + 7 9 parts 2 Find the value of 1 part: total volume ÷ total parts = 900 ÷ 9 100 ml per part 3 Concentrate = 2 parts: 2 × 100 200 ml 4 Water = 7 parts: 7 × 100 700 ml Answer: 200 ml concentrate and 700 ml water . (Check: 200 + 700 = 900 ✓) Example 4 (Pure analogical, above HOTS): Question: Two paint mixtures both use blue and yellow paint. Mixture A has a ratio of blue to yellow of 3 : 5 . Mixture B has a ratio of blue to yellow of 2 : 3 . If both mixtures are combined into one bucket, and Mixture A contributed 24 liters of blue paint, while Mixture B contributed 400 ml less total paint than Mixture A, find the total amount of yellow paint in the final combined bucket. (Assume Mixture A’s total was 3.6 L.) Solution: Step What to Do Result 1 Mixture A: blue is 3 parts = 24 L, so 1 part = 24 ÷ 3 = 8 L. Yellow is 5 parts: 5 × 8 40 L yellow (A) 2 Mixture A’s total paint (check against given): 3.6 L = 3600 ml ; but blue alone is 24 L = 24000 ml, which is already bigger than the stated total — this is a contradiction in the problem. — Answer: This problem is intentionally unsolvable as stated — the numbers contradict each other (blue paint alone already exceeds the stated total mixture volume). (This is a deliberate “trap” example: real exams sometimes include problems with hidden inconsistencies, and a strong student should be able to notice the numbers don’t add up rather than force an answer. Always sanity-check your intermediate results against the given totals.)","min":3,"ex":true},{"id":"7-c2-s5","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Reversing the order.<\/strong> Always match the order the question asks for — “ratio of X to Y” means X comes first.<\/li>\n<li><strong>Forgetting to fully simplify.<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mo>:<\/mo><mn>100<\/mn><\/mrow><\/semantics><\/math> simplified to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math> is <em>not<\/em> fully simplified — check that the GCD you used was truly the <em>greatest<\/em> common divisor.<\/li>\n<li><strong>Treating “2 parts” as “2 units of the final answer.”<\/strong> In part-based problems (Example 3), always find the value of <em>one part<\/em> first before multiplying — don’t assume the ratio numbers are the final quantities.<\/li>\n<li><strong>Mixing up ratio with fraction of the whole.<\/strong> A ratio of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>:<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math> means the whole is divided into <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>+<\/mo><mn>5<\/mn><mo>=<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math> parts, <em>not<\/em> 5 parts. A common error is writing the first quantity as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>2<\/mn><mn>5<\/mn><\/mfrac><\/semantics><\/math> of the total, when it’s actually <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>2<\/mn><mn>7<\/mn><\/mfrac><\/semantics><\/math> of the total.<\/li>\n<\/ul>\n","text":"Reversing the order. Always match the order the question asks for — “ratio of X to Y” means X comes first. Forgetting to fully simplify. 20 : 100 simplified to 2 : 10 is not fully simplified — check that the GCD you used was truly the greatest common divisor. Treating “2 parts” as “2 units of the final answer.” In part-based problems (Example 3), always find the value of one part first before multiplying — don’t assume the ratio numbers are the final quantities. Mixing up ratio with fraction of the whole. A ratio of 2 : 5 means the whole is divided into 2 + 5 = 7 parts, not 5 parts. A common error is writing the first quantity as 2 5 of the total, when it’s actually 2 7 of the total.","min":2,"ex":false},{"id":"7-c2-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"A class has 12 boys and 18 girls. Ratio of boys to girls in simplest form? 8 apples and 20 mangoes. Ratio of mangoes to apples, simplified? Concentrate and water are mixed 2:7 to make 900 ml. How much concentrate? In a ratio 2:5, the first quantity is what fraction of the whole?","min":2,"ex":false,"quiz":true}]},{"id":"7-c3","title":"Algebra","raw":"3. Algebra","sections":[{"id":"7-c3-s1","title":"What Is Algebra, Really? From “Finding an Answer” to “Finding an Input”","html":"\n<p>In basic arithmetic, you’re given the full problem and asked to find the answer:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mspace width=\"0.333em\"><\/mspace><mi>?<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p>In algebra, the <em>game changes<\/em>: you’re given the answer and part of the problem, and you have to figure out the missing piece:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>+<\/mo><mi>x<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p>Here, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> is a placeholder — a box with an unknown number hidden inside. Algebra is simply the set of tools for figuring out what’s inside that box.<\/p>\n","text":"In basic arithmetic, you’re given the full problem and asked to find the answer: 2 + 3 = ? In algebra, the game changes : you’re given the answer and part of the problem, and you have to figure out the missing piece: 2 + x = 5 Here, x is a placeholder — a box with an unknown number hidden inside. Algebra is simply the set of tools for figuring out what’s inside that box.","min":2,"ex":false},{"id":"7-c3-s2","title":"The Building Blocks of Algebra","html":"\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 21%\" />\n<col style=\"width: 30%\" />\n<col style=\"width: 45%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Term<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Meaning<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Example<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Variable<\/strong><\/td>\n<td style=\"text-align: left;\">A letter representing an unknown number<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Constant<\/strong><\/td>\n<td style=\"text-align: left;\">A fixed number that never changes<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>5<\/mn><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Coefficient<\/strong><\/td>\n<td style=\"text-align: left;\">The number multiplied by a variable<\/td>\n<td style=\"text-align: left;\">the 3 in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Operator<\/strong><\/td>\n<td style=\"text-align: left;\">A math symbol: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+<\/mo><mo>,<\/mo><mo>−<\/mo><mo>,<\/mo><mo>×<\/mo><mo>,<\/mo><mo>÷<\/mo><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Expression<\/strong><\/td>\n<td style=\"text-align: left;\">A combination of variables, numbers, and operators (no equals sign)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Equation<\/strong><\/td>\n<td style=\"text-align: left;\">Two expressions set equal to each other<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>7<\/mn><mo>=<\/mo><mn>15<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Term Meaning Example Variable A letter representing an unknown number x Constant A fixed number that never changes 5 , − 12 Coefficient The number multiplied by a variable the 3 in 3 x Operator A math symbol: + , − , × , ÷ Expression A combination of variables, numbers, and operators (no equals sign) 2 x + 7 Equation Two expressions set equal to each other 2 x + 7 = 15","min":2,"ex":false},{"id":"7-c3-s3","title":"Simplifying Expressions — Combining Like Terms","html":"\n<p>Before solving equations, there’s one housekeeping skill you need: cleaning up a messy expression by combining <strong>like terms<\/strong> — terms that have the exact same variable (and same power of that variable).<\/p>\n<p><strong>Analogy:<\/strong> imagine sorting a mixed pile of apples and oranges into two separate baskets before counting each. You can’t add “3 apples + 2 oranges” into one number — but you <em>can<\/em> combine “3 apples + 5 apples” into “8 apples.” Like terms are the same idea: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>-terms only combine with other <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>-terms; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math>-terms only combine with other <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math>-terms.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Simplify <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><mi>y<\/mi><mo>+<\/mo><mn>5<\/mn><mi>y<\/mi><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Group the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>-terms together: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mi>x<\/mi><mo>=<\/mo><mn>10<\/mn><mi>x<\/mi><\/mrow><\/semantics><\/math> 2. Group the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math>-terms together: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>2<\/mn><mi>y<\/mi><mo>+<\/mo><mn>5<\/mn><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><mi>y<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><mi>y<\/mi><mo>+<\/mo><mn>5<\/mn><mi>y<\/mi><mo>=<\/mo><mn>10<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mi>y<\/mi><\/mrow><\/semantics><\/math><\/p>\n","text":"Before solving equations, there’s one housekeeping skill you need: cleaning up a messy expression by combining like terms — terms that have the exact same variable (and same power of that variable). Analogy: imagine sorting a mixed pile of apples and oranges into two separate baskets before counting each. You can’t add “3 apples + 2 oranges” into one number — but you can combine “3 apples + 5 apples” into “8 apples.” Like terms are the same idea: x -terms only combine with other x -terms; y -terms only combine with other y -terms. Question: Simplify 7 x + 3 x − 2 y + 5 y . Solution: 1. Group the x -terms together: 7 x + 3 x = 10 x 2. Group the y -terms together: − 2 y + 5 y = 3 y 7 x + 3 x − 2 y + 5 y = 10 x + 3 y","min":2,"ex":false},{"id":"7-c3-s4","title":"Solving Equations — The Balance Scale Analogy","html":"\n<p>Think of an equation like a <strong>balance scale<\/strong>: whatever is on the left side weighs <em>exactly<\/em> the same as whatever is on the right side. Your job is to get <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> alone on one side — but if you remove or add anything to one side, you <strong>must<\/strong> do the exact same thing to the other side, or the scale tips and the equation becomes false.<\/p>\n<pre><code>[DIAGRAM: Balance scale]\n   ┌──────────┴──────────┐\n   │   ⚖️  BALANCED  ⚖️   │\n   │  x + 2       =    5  │\n   └───────────────────────┘<\/code><\/pre>\n<p><strong>Worked walkthrough, every step labeled:<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>+<\/mo><mi>x<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 30%\" />\n<col style=\"width: 30%\" />\n<col style=\"width: 24%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Reason<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Subtract 2 from both sides<\/td>\n<td style=\"text-align: left;\">To cancel the +2 on the left, keeping the scale balanced<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>−<\/mo><mn>2<\/mn><mo>+<\/mo><mi>x<\/mi><mo>=<\/mo><mn>5<\/mn><mo>−<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Simplify both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math> on the left; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> on the right<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Think of an equation like a balance scale : whatever is on the left side weighs exactly the same as whatever is on the right side. Your job is to get x alone on one side — but if you remove or add anything to one side, you must do the exact same thing to the other side, or the scale tips and the equation becomes false. [DIAGRAM: Balance scale] ┌──────────┴──────────┐ │ ⚖️ BALANCED ⚖️ │ │ x + 2 = 5 │ └───────────────────────┘ Worked walkthrough, every step labeled: 2 + x = 5 Step Action Reason Result 1 Subtract 2 from both sides To cancel the +2 on the left, keeping the scale balanced 2 − 2 + x = 5 − 2 2 Simplify both sides 2 − 2 = 0 on the left; 5 − 2 = 3 on the right x = 3","min":2,"ex":false},{"id":"7-c3-s5","title":"Worked Examples — Algebra (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up, one-step):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Solve for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>−<\/mo><mn>7<\/mn><mo>=<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math><\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 55%\" />\n<col style=\"width: 28%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Add 7 to both sides (to cancel −7)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>−<\/mo><mn>7<\/mn><mo>+<\/mo><mn>7<\/mn><mo>=<\/mo><mn>12<\/mn><mo>+<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Simplify<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>19<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>19<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Two-step equation):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Solve for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>4<\/mn><mo>=<\/mo><mn>19<\/mn><\/mrow><\/semantics><\/math><\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Subtract 4 from both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>=<\/mo><mn>15<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Divide both sides by 3 (to isolate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — variables on both sides, mixes integer rules from Section 1):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Solve for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>−<\/mo><mn>8<\/mn><mo>=<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>13<\/mn><\/mrow><\/semantics><\/math><\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Subtract <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/semantics><\/math> from both sides (gather the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>’s on one side)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>8<\/mn><mo>=<\/mo><mn>13<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Add 8 to both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>=<\/mo><mn>21<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Divide both sides by 3<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math> <em>(Check:<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>7<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>−<\/mo><mn>8<\/mn><mo>=<\/mo><mn>27<\/mn><\/mrow><\/semantics><\/math> <em>and<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>7<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>13<\/mn><mo>=<\/mo><mn>27<\/mn><\/mrow><\/semantics><\/math> <em>✓)<\/em><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — word problem requiring you to build the equation yourself):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Reza is saving money. He started with some amount of savings, then earned Rp15.000 per day for 6 days from a small job, and spent Rp20.000 on a book. He now has Rp85.000. How much did Reza start with?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 54%\" />\n<col style=\"width: 29%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> = Reza’s starting savings. Total earned: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15.000<\/mn><mo>×<\/mo><mn>6<\/mn><mo>=<\/mo><mn>90.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">equation building<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Build the equation: starting + earned − spent = final → <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mn>90.000<\/mn><mo>−<\/mo><mn>20.000<\/mn><mo>=<\/mo><mn>85.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mn>70.000<\/mn><mo>=<\/mo><mn>85.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Subtract 70.000 from both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>15.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Reza started with <strong>Rp15.000<\/strong>.<\/p>\n","text":"Example 1 (Warm-up, one-step): Question: Solve for x : x − 7 = 12 Step Action Result 1 Add 7 to both sides (to cancel −7) x − 7 + 7 = 12 + 7 2 Simplify x = 19 Answer: x = 19 Example 2 (Two-step equation): Question: Solve for x : 3 x + 4 = 19 Step Action Result 1 Subtract 4 from both sides 3 x = 15 2 Divide both sides by 3 (to isolate x ) x = 5 Answer: x = 5 Example 3 (HOTS — variables on both sides, mixes integer rules from Section 1): Question: Solve for x : 5 x − 8 = 2 x + 13 Step Action Result 1 Subtract 2 x from both sides (gather the x ’s on one side) 3 x − 8 = 13 2 Add 8 to both sides 3 x = 21 3 Divide both sides by 3 x = 7 Answer: x = 7 (Check: 5 ( 7 ) − 8 = 27 and 2 ( 7 ) + 13 = 27 ✓) Example 4 (Pure analogical, above HOTS — word problem requiring you to build the equation yourself): Question: Reza is saving money. He started with some amount of savings, then earned Rp15.000 per day for 6 days from a small job, and spent Rp20.000 on a book. He now has Rp85.000. How much did Reza start with? Solution: Step What to Do Result 1 Let x = Reza’s starting savings. Total earned: 15.000 × 6 = 90.000 equation building 2 Build the equation: starting + earned − spent = final → x + 90.000 − 20.000 = 85.000 x + 70.000 = 85.000 3 Subtract 70.000 from both sides x = 15.000 Answer: Reza started with Rp15.000 .","min":2,"ex":true},{"id":"7-c3-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Doing an operation to only one side.<\/strong> Whatever you do to one side of the equation, you <em>must<\/em> do to the other — always.<\/li>\n<li><strong>Sign errors when moving terms.<\/strong> Moving <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>8<\/mn><\/mrow><\/semantics><\/math> to the other side means <em>adding<\/em> 8, not subtracting it. Think Keep-Change-Change from Section 1.6 — it’s the same idea.<\/li>\n<li><strong>Forgetting to divide by the coefficient.<\/strong> After <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>=<\/mo><mn>21<\/mn><\/mrow><\/semantics><\/math>, students sometimes stop, forgetting <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> still has a coefficient of 3 attached — always finish by isolating the variable completely.<\/li>\n<li><strong>Not checking the answer.<\/strong> Plugging your solution back into the <em>original<\/em> equation (like in Example 3) is the fastest way to catch a sign error before it costs you marks.<\/li>\n<\/ul>\n","text":"Doing an operation to only one side. Whatever you do to one side of the equation, you must do to the other — always. Sign errors when moving terms. Moving − 8 to the other side means adding 8, not subtracting it. Think Keep-Change-Change from Section 1.6 — it’s the same idea. Forgetting to divide by the coefficient. After 3 x = 21 , students sometimes stop, forgetting x still has a coefficient of 3 attached — always finish by isolating the variable completely. Not checking the answer. Plugging your solution back into the original equation (like in Example 3) is the fastest way to catch a sign error before it costs you marks.","min":2,"ex":false},{"id":"7-c3-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"In the term 3x, the number 3 is called the… Simplify 7x + 3x − 2y + 5y. Solve 3x + 4 = 19. Solve 5x − 8 = 2x + 13.","min":2,"ex":false,"quiz":true}]},{"id":"7-c4","title":"Pythagorean Theorem","raw":"4. Pythagorean Theorem","sections":[{"id":"7-c4-s1","title":"The Big Idea, Visually","html":"\n<p>The Pythagorean Theorem only works on <strong>right triangles<\/strong> — triangles with one 90° angle. It describes a fixed relationship between the three sides.<\/p>\n<pre><code>[DIAGRAM: Right triangle with squares on each side]\n              C (hypotenuse)\n             ╱│\n       c   ╱  │\n         ╱    │  b (height)\n       ╱ 90°__│\n      ◄────────►\n          a (base)\n\n  Area of square on a  +  Area of square on b  =  Area of square on c<\/code><\/pre>\n<p>The longest side — always the one <em>opposite<\/em> the right angle — is called the <strong>hypotenuse<\/strong>, labeled <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math>. The other two sides, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math>, are called the <strong>legs<\/strong>.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Why squares?<\/strong> Literally: if you build an actual square using each side of the triangle as one edge, the area of the two smaller squares added together <em>exactly<\/em> equals the area of the biggest square. This has been physically verified for thousands of years — it’s one of the oldest proven facts in mathematics.<\/p>\n","text":"The Pythagorean Theorem only works on right triangles — triangles with one 90° angle. It describes a fixed relationship between the three sides. [DIAGRAM: Right triangle with squares on each side] C (hypotenuse) ╱│ c ╱ │ ╱ │ b (height) ╱ 90°__│ ◄────────► a (base) Area of square on a + Area of square on b = Area of square on c The longest side — always the one opposite the right angle — is called the hypotenuse , labeled c . The other two sides, a and b , are called the legs . a 2 + b 2 = c 2 Why squares? Literally: if you build an actual square using each side of the triangle as one edge, the area of the two smaller squares added together exactly equals the area of the biggest square. This has been physically verified for thousands of years — it’s one of the oldest proven facts in mathematics.","min":2,"ex":false},{"id":"7-c4-s2","title":"Identifying the Hypotenuse — The Step Students Skip (and Regret)","html":"\n<p><strong>The single most common mistake in this entire topic<\/strong> is plugging numbers into the formula without first identifying which side is the hypotenuse. Remember: <strong>the hypotenuse is always the side directly across from the 90° angle<\/strong>, and it is always the <em>longest<\/em> side. If you’re not sure which number goes where, look for the right-angle mark in the diagram first.<\/p>\n","text":"The single most common mistake in this entire topic is plugging numbers into the formula without first identifying which side is the hypotenuse. Remember: the hypotenuse is always the side directly across from the 90° angle , and it is always the longest side. If you’re not sure which number goes where, look for the right-angle mark in the diagram first.","min":2,"ex":false},{"id":"7-c4-s3","title":"Worked Examples — Pythagorean Theorem (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — find the hypotenuse):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A right triangle has legs of 6 cm and 8 cm. Find the hypotenuse.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 53%\" />\n<col style=\"width: 31%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Write the formula<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Substitute: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>6<\/mn><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mn>8<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>36<\/mn><mo>+<\/mo><mn>64<\/mn><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Add<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100<\/mn><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Take the square root of both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The hypotenuse is <strong>10 cm<\/strong>.<\/p>\n<p><strong>Example 2 (Finding a leg, not the hypotenuse — a different rearrangement):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A right triangle has a hypotenuse of 13 cm and one leg of 5 cm. Find the other leg.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Write the formula, solving for the missing leg <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> becomes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">rearranged<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Substitute: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mn>13<\/mn><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mn>5<\/mn><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>169<\/mn><mo>−<\/mo><mn>25<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Subtract<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>144<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Take the square root<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>=<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The other leg is <strong>12 cm<\/strong>. <em>(Notice: since the hypotenuse is being solved for a leg instead, we subtract instead of add — a very common source of errors if the formula is memorized without understanding which side is missing.)<\/em><\/p>\n<p><strong>Example 3 (HOTS — real-world ladder problem):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A ladder is leaning against a wall. The base of the ladder is 3 m from the wall, and the ladder reaches 4 m up the wall. How long is the ladder?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> The ladder itself is the hypotenuse (it’s the longest side, opposite the right angle formed by the wall and the ground).<\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Substitute into <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mn>4<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mo>+<\/mo><mn>16<\/mn><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Add<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25<\/mn><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Square root<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The ladder is <strong>5 m<\/strong> long.<\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — combines two right triangles):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A rectangular field is 30 m long and 16 m wide. Andi wants to walk diagonally across the field instead of walking along two edges. How many meters shorter is the diagonal path compared to walking along the two edges?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Walking along two edges: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30<\/mn><mo>+<\/mo><mn>16<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">46 m<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">The diagonal is the hypotenuse of a right triangle with legs 30 and 16: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>30<\/mn><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mn>16<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>900<\/mn><mo>+<\/mo><mn>256<\/mn><mo>=<\/mo><mn>1156<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Square root: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><msqrt><mn>1156<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mn>34<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Difference: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>46<\/mn><mo>−<\/mo><mn>34<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>12<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The diagonal path is <strong>12 m shorter<\/strong>.<\/p>\n","text":"Example 1 (Warm-up — find the hypotenuse): Question: A right triangle has legs of 6 cm and 8 cm. Find the hypotenuse. Step Action Result 1 Write the formula a 2 + b 2 = c 2 2 Substitute: 6 2 + 8 2 = c 2 36 + 64 = c 2 3 Add 100 = c 2 4 Take the square root of both sides c = 10 Answer: The hypotenuse is 10 cm . Example 2 (Finding a leg, not the hypotenuse — a different rearrangement): Question: A right triangle has a hypotenuse of 13 cm and one leg of 5 cm. Find the other leg. Step Action Result 1 Write the formula, solving for the missing leg b : a 2 + b 2 = c 2 becomes b 2 = c 2 − a 2 rearranged 2 Substitute: b 2 = 13 2 − 5 2 b 2 = 169 − 25 3 Subtract b 2 = 144 4 Take the square root b = 12 Answer: The other leg is 12 cm . (Notice: since the hypotenuse is being solved for a leg instead, we subtract instead of add — a very common source of errors if the formula is memorized without understanding which side is missing.) Example 3 (HOTS — real-world ladder problem): Question: A ladder is leaning against a wall. The base of the ladder is 3 m from the wall, and the ladder reaches 4 m up the wall. How long is the ladder? Solution: The ladder itself is the hypotenuse (it’s the longest side, opposite the right angle formed by the wall and the ground). Step Action Result 1 Substitute into a 2 + b 2 = c 2 : 3 2 + 4 2 = c 2 9 + 16 = c 2 2 Add 25 = c 2 3 Square root c = 5 Answer: The ladder is 5 m long. Example 4 (Pure analogical, above HOTS — combines two right triangles): Question: A rectangular field is 30 m long and 16 m wide. Andi wants to walk diagonally across the field instead of walking along two edges. How many meters shorter is the diagonal path compared to walking along the two edges? Solution: Step What to Do Result 1 Walking along two edges: 30 + 16 46 m 2 The diagonal is the hypotenuse of a right triangle with legs 30 and 16: 30 2 + 16 2 = c 2 900 + 256 = 1156 3 Square root: c = 1156 c = 34 4 Difference: 46 − 34 12 Answer: The diagonal path is 12 m shorter .","min":3,"ex":true},{"id":"7-c4-s4","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Assuming the longest given number is automatically the hypotenuse<\/strong> — check the diagram; the hypotenuse must be <em>opposite the right angle<\/em>, not just “the biggest number in the problem.”<\/li>\n<li><strong>Adding when you should subtract.<\/strong> If the hypotenuse is already known and you’re solving for a leg, you subtract (Example 2), not add.<\/li>\n<li><strong>Forgetting the square root at the end.<\/strong> Getting <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>c<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>100<\/mn><\/mrow><\/semantics><\/math> and writing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mn>100<\/mn><\/mrow><\/semantics><\/math> instead of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math> is an extremely common slip under time pressure.<\/li>\n<li><strong>Using the theorem on non-right triangles.<\/strong> This formula <em>only<\/em> works when there’s a genuine 90° angle in the triangle.<\/li>\n<\/ul>\n","text":"Assuming the longest given number is automatically the hypotenuse — check the diagram; the hypotenuse must be opposite the right angle , not just “the biggest number in the problem.” Adding when you should subtract. If the hypotenuse is already known and you’re solving for a leg, you subtract (Example 2), not add. Forgetting the square root at the end. Getting c 2 = 100 and writing c = 100 instead of c = 10 is an extremely common slip under time pressure. Using the theorem on non-right triangles. This formula only works when there’s a genuine 90° angle in the triangle.","min":2,"ex":false},{"id":"7-c4-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"A right triangle has legs 6 cm and 8 cm. The hypotenuse is… Hypotenuse 13 cm, one leg 5 cm. The other leg is… The hypotenuse is always… A ladder's base is 3 m from a wall and it reaches 4 m up. Its length?","min":2,"ex":false,"quiz":true}]},{"id":"7-c5","title":"Set (Himpunan)","raw":"5. Set (Himpunan)","sections":[{"id":"7-c5-s1","title":"What Is a Set?","html":"\n<p>A <strong>set<\/strong> is simply a well-defined collection of distinct objects, called <strong>elements<\/strong> or <strong>members<\/strong>. “Well-defined” means anyone looking at the rule would agree on exactly which objects belong and which don’t — “the set of all even numbers less than 10” is well-defined; “the set of tasty foods” is not (tasty is a matter of opinion).<\/p>\n<p>Sets are usually named with capital letters and written with curly braces:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>
