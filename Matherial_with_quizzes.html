nal — Telling Them Apart in Decimal Form","html":"\n<p>There’s a fast visual test: write the number as a decimal.<\/p>\n<ul>\n<li><strong>Rational<\/strong> decimals either <strong>stop<\/strong> (terminate), like <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0.75<\/mn><\/semantics><\/math>, or <strong>repeat forever in a fixed block<\/strong>, like <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.333<\/mn><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><mo>=<\/mo><mn>0<\/mn><mi>.<\/mi><mover><mn>3<\/mn><mo accent=\"true\">¯<\/mo><\/mover><\/mrow><\/semantics><\/math>.<\/li>\n<li><strong>Irrational<\/strong> decimals go on <strong>forever with no repeating pattern<\/strong>, like <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π<\/mi><mo>=<\/mo><mn>3.14159265<\/mn><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/li>\n<\/ul>\n<p><strong>Analogy:<\/strong> think of a rational decimal as a song stuck on a repeating loop — eventually you can predict every note. An irrational decimal is like white noise — it never settles into a pattern you could predict, no matter how long you listen.<\/p>\n","text":"There’s a fast visual test: write the number as a decimal. Rational decimals either stop (terminate), like 0.75 , or repeat forever in a fixed block , like 0.333 . . . = 0 . 3 ¯ . Irrational decimals go on forever with no repeating pattern , like π = 3.14159265 . . . Analogy: think of a rational decimal as a song stuck on a repeating loop — eventually you can predict every note. An irrational decimal is like white noise — it never settles into a pattern you could predict, no matter how long you listen.","min":2,"ex":false},{"id":"tka-c2-s6","title":"Types of Fractions and Arithmetic with Rational Numbers","html":"\n<p>Rational numbers show up in several everyday “costumes” that are all secretly the same underlying idea:<\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Type<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Example<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Common fraction<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>2<\/mn><mn>5<\/mn><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Mixed number<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Decimal fraction<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0.15<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Percentage<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8<\/mn><mi>%<\/mi><mo>=<\/mo><mfrac><mn>8<\/mn><mn>100<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Equivalent fractions<\/strong> are different-looking fractions with the same value — found by multiplying or dividing both the numerator and denominator by the <em>same<\/em> number: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mo>×<\/mo><mi>c<\/mi><\/mrow><mrow><mi>b<\/mi><mo>×<\/mo><mi>c<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math>.<\/p>\n<p><strong>Arithmetic with fractions<\/strong> (let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>,<\/mo><mi>b<\/mi><mo>,<\/mo><mi>c<\/mi><mo>,<\/mo><mi>d<\/mi><\/mrow><\/semantics><\/math> be integers, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>,<\/mo><mi>d<\/mi><mo>≠<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math>):<\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 30%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Operation<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Formula<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Addition<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>+<\/mo><mfrac><mi>c<\/mi><mi>d<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mi>d<\/mi><mo>+<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><mrow><mi>b<\/mi><mi>d<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Subtraction<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>−<\/mo><mfrac><mi>c<\/mi><mi>d<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mi>d<\/mi><mo>−<\/mo><mi>b<\/mi><mi>c<\/mi><\/mrow><mrow><mi>b<\/mi><mi>d<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Multiplication<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>×<\/mo><mfrac><mi>c<\/mi><mi>d<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mi>c<\/mi><\/mrow><mrow><mi>b<\/mi><mi>d<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Division<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>÷<\/mo><mfrac><mi>c<\/mi><mi>d<\/mi><\/mfrac><mo>=<\/mo><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>×<\/mo><mfrac><mi>d<\/mi><mi>c<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mi>d<\/mi><\/mrow><mrow><mi>b<\/mi><mi>c<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why addition/subtraction need a common denominator (the<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mi>d<\/mi><\/mrow><\/semantics><\/math> <strong>in the formula) but multiplication doesn’t:<\/strong> you can only directly add or subtract things measured in the <em>same-sized pieces<\/em> — you can’t add “2 thirds” and “1 quarter” without first re-cutting both into matching-sized pieces. Multiplication doesn’t have this restriction because you’re scaling, not combining like-sized pieces.<\/p>\n<p><strong>Estimating rational number results<\/strong> uses the same rounding logic as Section A.4, but focused on the <strong>tenths digit<\/strong>: if it’s 5 or more, round up; if less than 5, round down.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Estimate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15.8<\/mn><mo>×<\/mo><mn>4.2<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>15.8<\/mn><\/semantics><\/math> rounds up to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>16<\/mn><\/semantics><\/math> (tenths digit is 8). <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>4.2<\/mn><\/semantics><\/math> rounds down to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>4<\/mn><\/semantics><\/math> (tenths digit is 2). Estimate: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>16<\/mn><mo>×<\/mo><mn>4<\/mn><mo>=<\/mo><mn>64<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n","text":"Rational numbers show up in several everyday “costumes” that are all secretly the same underlying idea: Type Example Common fraction 2 5 Mixed number 3 1 2 Decimal fraction 0.15 Percentage 8 % = 8 100 Equivalent fractions are different-looking fractions with the same value — found by multiplying or dividing both the numerator and denominator by the same number: a b = a × c b × c . Arithmetic with fractions (let a , b , c , d be integers, b , d ≠ 0 ): Operation Formula Addition a b + c d = a d + b c b d Subtraction a b − c d = a d − b c b d Multiplication a b × c d = a c b d Division a b ÷ c d = a b × d c = a d b c Why addition/subtraction need a common denominator (the b d in the formula) but multiplication doesn’t: you can only directly add or subtract things measured in the same-sized pieces — you can’t add “2 thirds” and “1 quarter” without first re-cutting both into matching-sized pieces. Multiplication doesn’t have this restriction because you’re scaling, not combining like-sized pieces. Estimating rational number results uses the same rounding logic as Section A.4, but focused on the tenths digit : if it’s 5 or more, round up; if less than 5, round down. Question: Estimate 15.8 × 4.2 . Solution: 15.8 rounds up to 16 (tenths digit is 8). 4.2 rounds down to 4 (tenths digit is 2). Estimate: 16 × 4 = 64 .","min":2,"ex":false},{"id":"tka-c2-s7","title":"Scientific Notation — Taming Very Big and Very Small Numbers","html":"\n<p><strong>The big picture:<\/strong> scientific notation is a compact way to write numbers that are too big or too small to comfortably write out in full — imagine writing “the distance from Earth to the Sun” in meters without it (149,600,000,000 m) versus with it (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.496<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>11<\/mn><\/msup><\/mrow><\/semantics><\/math> m). Same number, far easier to read and compare.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><msup><mn>10<\/mn><mi>n<\/mi><\/msup><mo>,<\/mo><mspace width=\"1.0em\"><\/mspace><mrow><mtext mathvariant=\"normal\">where <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mn>0<\/mn><mo>&lt;<\/mo><mi>a<\/mi><mo>&lt;<\/mo><mn>10<\/mn><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> and <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mi>n<\/mi><mrow><mspace width=\"0.333em\"><\/mspace><mtext mathvariant=\"normal\"> is an integer<\/mtext><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>The rule for the exponent<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math><strong>:<\/strong> - <strong>Big numbers<\/strong> (bigger than 10) → <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> is <strong>positive<\/strong>, and equals how many places you moved the decimal point <strong>left<\/strong> to get <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> into the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>&lt;<\/mo><mi>a<\/mi><mo>&lt;<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math> range. - <strong>Small numbers<\/strong> (between 0 and 1) → <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> is <strong>negative<\/strong>, and equals how many places you moved the decimal point <strong>right<\/strong>.<\/p>\n<p><strong>Worked walkthrough:<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>23<\/mn><mo>,<\/mo><mn>000<\/mn><mo>,<\/mo><mn>000<\/mn><mo>=<\/mo><mn>2.3<\/mn><mo>×<\/mo><mn>10<\/mn><mo>,<\/mo><mn>000<\/mn><mo>,<\/mo><mn>000<\/mn><mo>=<\/mo><mn>2.3<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>7<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><em>(You moved the decimal point 7 places to the left to turn 23,000,000 into 2.3 — so the exponent is +7.)<\/em><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.000456<\/mn><mo>=<\/mo><mn>4.56<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>4<\/mn><\/mrow><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><em>(You moved the decimal point 4 places to the right to turn 0.000456 into 4.56 — so the exponent is −4.)<\/em><\/p>\n","text":"The big picture: scientific notation is a compact way to write numbers that are too big or too small to comfortably write out in full — imagine writing “the distance from Earth to the Sun” in meters without it (149,600,000,000 m) versus with it ( 1.496 × 10 11 m). Same number, far easier to read and compare. a × 10 n , where 0 < a < 10 and n is an integer The rule for the exponent n : - Big numbers (bigger than 10) → n is positive , and equals how many places you moved the decimal point left to get a into the 0 < a < 10 range. - Small numbers (between 0 and 1) → n is negative , and equals how many places you moved the decimal point right . Worked walkthrough: 23 , 000 , 000 = 2.3 × 10 , 000 , 000 = 2.3 × 10 7 (You moved the decimal point 7 places to the left to turn 23,000,000 into 2.3 — so the exponent is +7.) 0.000456 = 4.56 × 10 − 4 (You moved the decimal point 4 places to the right to turn 0.000456 into 4.56 — so the exponent is −4.)","min":2,"ex":false},{"id":"tka-c2-s8","title":"Worked Examples — Number System (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — classification):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mrow><\/semantics><\/math> a natural number, whole number, integer, or rational number?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> It’s a fraction that isn’t a whole value, so it fails Natural, Whole, and Integer. But it can be written as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><\/semantics><\/math> with integers <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mo>−<\/mo><mn>5<\/mn><mo>,<\/mo><mi>b<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>, so it <strong>is<\/strong> rational.<\/p>\n<p><strong>Example 2 (Scientific notation conversion):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Convert 0.0032 into scientific notation.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Move the decimal 3 places right to get 3.2 (which is between 0 and 10). Since we moved right, the exponent is negative.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.0032<\/mn><mo>=<\/mo><mn>3.2<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>3<\/mn><\/mrow><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — comparing scientific notation):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Star A is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4.2<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>16<\/mn><\/msup><\/mrow><\/semantics><\/math> meters from Earth. Star B is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.9<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>17<\/mn><\/msup><\/mrow><\/semantics><\/math> meters from Earth. Which star is farther, and by roughly how many times?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 43%\" />\n<col style=\"width: 54%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Reasoning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Compare the exponents first — <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>10<\/mn><mn>17<\/mn><\/msup><mo>&gt;<\/mo><msup><mn>10<\/mn><mn>16<\/mn><\/msup><\/mrow><\/semantics><\/math>, so Star B is farther <em>before<\/em> even looking at the leading digit<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">To compare precisely, rewrite Star A’s exponent to match: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4.2<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>16<\/mn><\/msup><mo>=<\/mo><mn>0.42<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>17<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Compare <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.42<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>17<\/mn><\/msup><\/mrow><\/semantics><\/math> vs <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.9<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>17<\/mn><\/msup><\/mrow><\/semantics><\/math>: Star B is farther<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Divide to find “how many times”: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.9<\/mn><mo>÷<\/mo><mn>0.42<\/mn><mo>≈<\/mo><mn>9.3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Star B is farther, roughly <strong>9.3 times<\/strong> the distance of Star A.<\/p>\n<p><strong>Example 4 (Conceptual trap):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A student writes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>23<\/mn><mo>,<\/mo><mn>000<\/mn><mo>,<\/mo><mn>000<\/mn><mo>=<\/mo><mn>23<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>6<\/mn><\/msup><\/mrow><\/semantics><\/math>. Is this correct scientific notation? Explain.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> No. Scientific notation requires <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>&lt;<\/mo><mi>a<\/mi><mo>&lt;<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>23<\/mn><\/semantics><\/math> is not in that range (it’s bigger than 10). The correct form is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.3<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>7<\/mn><\/msup><\/mrow><\/semantics><\/math> — notice the exponent also had to change to compensate.<\/p>\n","text":"Example 1 (Warm-up — classification): Question: Is − 5 2 a natural number, whole number, integer, or rational number? Solution: It’s a fraction that isn’t a whole value, so it fails Natural, Whole, and Integer. But it can be written as a b with integers a = − 5 , b = 2 , so it is rational. Example 2 (Scientific notation conversion): Question: Convert 0.0032 into scientific notation. Solution: Move the decimal 3 places right to get 3.2 (which is between 0 and 10). Since we moved right, the exponent is negative. 0.0032 = 3.2 × 10 − 3 Example 3 (HOTS — comparing scientific notation): Question: Star A is 4.2 × 10 16 meters from Earth. Star B is 3.9 × 10 17 meters from Earth. Which star is farther, and by roughly how many times? Solution: Step Reasoning 1 Compare the exponents first — 10 17 > 10 16 , so Star B is farther before even looking at the leading digit 2 To compare precisely, rewrite Star A’s exponent to match: 4.2 × 10 16 = 0.42 × 10 17 3 Compare 0.42 × 10 17 vs 3.9 × 10 17 : Star B is farther 4 Divide to find “how many times”: 3.9 ÷ 0.42 ≈ 9.3 Answer: Star B is farther, roughly 9.3 times the distance of Star A. Example 4 (Conceptual trap): Question: A student writes 23 , 000 , 000 = 23 × 10 6 . Is this correct scientific notation? Explain. Solution: No. Scientific notation requires 0 < a < 10 , and 23 is not in that range (it’s bigger than 10). The correct form is 2.3 × 10 7 — notice the exponent also had to change to compensate.","min":2,"ex":true},{"id":"tka-c2-s9","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Assuming every square root is irrational.<\/strong> Always simplify first — <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>36<\/mn><\/msqrt><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math> is rational.<\/li>\n<li><strong>Forgetting the<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>&lt;<\/mo><mi>a<\/mi><mo>&lt;<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math> <strong>rule in scientific notation<\/strong> (writing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>23<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>6<\/mn><\/msup><\/mrow><\/semantics><\/math> instead of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.3<\/mn><mo>×<\/mo><msup><mn>10<\/mn><mn>7<\/mn><\/msup><\/mrow><\/semantics><\/math>).<\/li>\n<li><strong>Comparing scientific notation numbers by only looking at the leading digit<\/strong>, ignoring that the exponent matters far more (Example 3 above).<\/li>\n<li><strong>Adding or subtracting fractions without a common denominator first<\/strong> — this is the single most frequent fraction error at this level.<\/li>\n<li><strong>Rounding based on the wrong digit<\/strong> — estimation always looks at the digit <em>immediately after<\/em> the place you’re rounding to, not further along.<\/li>\n<\/ul>\n","text":"Assuming every square root is irrational. Always simplify first — 36 = 6 is rational. Forgetting the 0 < a < 10 rule in scientific notation (writing 23 × 10 6 instead of 2.3 × 10 7 ). Comparing scientific notation numbers by only looking at the leading digit , ignoring that the exponent matters far more (Example 3 above). Adding or subtracting fractions without a common denominator first — this is the single most frequent fraction error at this level. Rounding based on the wrong digit — estimation always looks at the digit immediately after the place you’re rounding to, not further along.","min":2,"ex":false},{"id":"tka-c2-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"√36 is… Write 0.0032 in scientific notation. Which is correct scientific notation? Prime factorization of 12? Which property is the Distributive Property? A decimal that never ends and never repeats is… 2/3 + 1/4 = ?","min":4,"ex":false,"quiz":true}]},{"id":"tka-c3","title":"Algebra — Beyond a Single Equation","raw":"B. Algebra — Beyond a Single Equation","sections":[{"id":"tka-c3-s1","title":"Ratios and Proportions — Beyond Simple Ratios","html":"\n<p><em>(Basic ratio-writing and simplifying: <strong>Grade 7 → Section 2<\/strong>. This section adds the ideas the TKA needs on top of that foundation.)<\/em><\/p>\n<p><strong>Scale<\/strong> compares a size on a drawing/map to the real-world size:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Scale<\/mtext><mo>=<\/mo><mfrac><mtext mathvariant=\"normal\">size on drawing<\/mtext><mtext mathvariant=\"normal\">actual size<\/mtext><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n<p>Written as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>:<\/mo><mi>a<\/mi><\/mrow><\/semantics><\/math> — meaning 1 unit on the drawing equals <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> units in real life. A map scale of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>:<\/mo><mn>10.000<\/mn><\/mrow><\/semantics><\/math> means 1 cm on the map equals 10.000 cm (100 m) in reality.<\/p>\n<p><strong>Proportion<\/strong> is simply a statement that two ratios are equal: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>=<\/mo><mfrac><mi>c<\/mi><mi>d<\/mi><\/mfrac><\/mrow><\/semantics><\/math>.<\/p>\n<p><strong>Rate of Change<\/strong> compares two <em>different kinds<\/em> of units — like price per bag, or speed (distance per time). The “per one unit” version is called the <strong>unit rate<\/strong>.<\/p>\n<p><strong>Direct Proportion:<\/strong> as one quantity increases, the other increases too, at a matched rate.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>=<\/mo><mfrac><mi>p<\/mi><mi>q<\/mi><\/mfrac><mspace width=\"1.0em\"><\/mspace><mo>⇔<\/mo><mspace width=\"1.0em\"><\/mspace><mi>a<\/mi><mo>×<\/mo><mi>q<\/mi><mo>=<\/mo><mi>b<\/mi><mo>×<\/mo><mi>p<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p><em>Everyday examples:<\/em> more items bought → higher total price; more fuel used → farther distance traveled.<\/p>\n<p><strong>Inverse Proportion:<\/strong> as one quantity increases, the other <em>decreases<\/em>.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo>=<\/mo><mfrac><mi>q<\/mi><mi>p<\/mi><\/mfrac><mspace width=\"1.0em\"><\/mspace><mo>⇔<\/mo><mspace width=\"1.0em\"><\/mspace><mi>a<\/mi><mo>×<\/mo><mi>p<\/mi><mo>=<\/mo><mi>b<\/mi><mo>×<\/mo><mi>q<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p><em>Everyday examples:<\/em> faster speed → less travel time; more workers on a job → less time needed to finish it.<\/p>\n<p><strong>Telling them apart (the actual skill being tested):<\/strong> ask yourself, “if quantity A goes up, does quantity B go up too, or does it go down?” Up-with-up (or down-with-down) is direct; up-with-down is inverse.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> 8 workers can finish building a fence in 15 days. If only 5 workers are available, how many days will it take? (Direct or inverse?)<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Fewer workers → <em>more<\/em> days needed → this is <strong>inverse<\/strong> proportion. 2. Inverse relationship: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mi>p<\/mi><mo>=<\/mo><mi>b<\/mi><mo>×<\/mo><mi>q<\/mi><\/mrow><\/semantics><\/math>, using workers as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>,<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> and days as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>p<\/mi><mo>,<\/mo><mi>q<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8<\/mn><mo>×<\/mo><mn>15<\/mn><mo>=<\/mo><mn>5<\/mn><mo>×<\/mo><mi>q<\/mi><\/mrow><\/semantics><\/math> 3. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>120<\/mn><mo>=<\/mo><mn>5<\/mn><mi>q<\/mi><mo>⇒<\/mo><mi>q<\/mi><mo>=<\/mo><mn>24<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <strong>24 days<\/strong>.<\/p>\n","text":"(Basic ratio-writing and simplifying: Grade 7 → Section 2 . This section adds the ideas the TKA needs on top of that foundation.) Scale compares a size on a drawing/map to the real-world size: Scale = size on drawing actual size Written as 1 : a — meaning 1 unit on the drawing equals a units in real life. A map scale of 1 : 10.000 means 1 cm on the map equals 10.000 cm (100 m) in reality. Proportion is simply a statement that two ratios are equal: a b = c d . Rate of Change compares two different kinds of units — like price per bag, or speed (distance per time). The “per one unit” version is called the unit rate . Direct Proportion: as one quantity increases, the other increases too, at a matched rate. a b = p q ⇔ a × q = b × p Everyday examples: more items bought → higher total price; more fuel used → farther distance traveled. Inverse Proportion: as one quantity increases, the other decreases . a b = q p ⇔ a × p = b × q Everyday examples: faster speed → less travel time; more workers on a job → less time needed to finish it. Telling them apart (the actual skill being tested): ask yourself, “if quantity A goes up, does quantity B go up too, or does it go down?” Up-with-up (or down-with-down) is direct; up-with-down is inverse. Question: 8 workers can finish building a fence in 15 days. If only 5 workers are available, how many days will it take? (Direct or inverse?) Solution: 1. Fewer workers → more days needed → this is inverse proportion. 2. Inverse relationship: a × p = b × q , using workers as ( a , b ) and days as ( p , q ) : 8 × 15 = 5 × q 3. 120 = 5 q ⇒ q = 24 Answer: 24 days .","min":2,"ex":false},{"id":"tka-c3-s2","title":"Inequalities in One Variable","html":"\n<p>Solving an inequality (using <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>&lt;<\/mo><mo>,<\/mo><mo>&gt;<\/mo><mo>,<\/mo><mo>≤<\/mo><mo>,<\/mo><mo>≥<\/mo><\/mrow><\/semantics><\/math> instead of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>=<\/mo><\/semantics><\/math>) works <strong>exactly like solving an equation<\/strong> — with exactly <strong>one extra rule<\/strong> that catches almost every student at least once:<\/p>\n<blockquote>\n<p><strong>The Golden Rule of Inequalities:<\/strong> whenever you multiply or divide <strong>both sides by a negative number<\/strong>, you must <strong>flip the inequality sign<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>Why this happens (not just a rule to memorize):<\/strong> Think about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>&lt;<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math> — clearly true. Now multiply both sides by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math>: you’d get <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>. But <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>2<\/mn><mo>&gt;<\/mo><mo>−<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math> (remember Grade 7’s number line — less negative is bigger!). The <em>inequality relationship reversed<\/em> simply because negative numbers flip the order on the number line. The flip rule exists to keep the statement mathematically true.<\/p>\n<p><strong>Worked walkthrough:<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo>&gt;<\/mo><mn>23<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo>−<\/mo><mn>3<\/mn><mo>&gt;<\/mo><mn>23<\/mn><mo>−<\/mo><mn>3<\/mn><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">(subtract 3 from both sides — sign stays the same, no negative multiplication happened)<\/mtext><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>&gt;<\/mo><mn>20<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mn>5<\/mn><mi>x<\/mi><\/mrow><mn>5<\/mn><\/mfrac><mo>&gt;<\/mo><mfrac><mn>20<\/mn><mn>5<\/mn><\/mfrac><mspace width=\"1.0em\"><\/mspace><mtext mathvariant=\"normal\">(divide by +5 — still positive, sign stays the same)<\/mtext><\/mrow><\/semantics><\/math><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>&gt;<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math><\/p>\n","text":"Solving an inequality (using < , > , ≤ , ≥ instead of = ) works exactly like solving an equation — with exactly one extra rule that catches almost every student at least once: The Golden Rule of Inequalities: whenever you multiply or divide both sides by a negative number , you must flip the inequality sign . Why this happens (not just a rule to memorize): Think about 2 < 5 — clearly true. Now multiply both sides by − 1 : you’d get − 2 and − 5 . But − 2 > − 5 (remember Grade 7’s number line — less negative is bigger!). The inequality relationship reversed simply because negative numbers flip the order on the number line. The flip rule exists to keep the statement mathematically true. Worked walkthrough: 5 x + 3 > 23 5 x + 3 − 3 > 23 − 3 (subtract 3 from both sides — sign stays the same, no negative multiplication happened) 5 x > 20 5 x 5 > 20 5 (divide by +5 — still positive, sign stays the same) x > 4","min":2,"ex":false},{"id":"tka-c3-s3","title":"Systems of Linear Equations in Two Variables (SPLDV)","html":"\n<p><strong>The big picture:<\/strong> a single equation like <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math> has <em>infinitely many<\/em> solutions (any point on that line). But if you have <strong>two<\/strong> equations at once, you’re looking for the <strong>one specific point<\/strong> that satisfies <em>both<\/em> — the point where two lines cross.<\/p>\n<p>There are four methods. All four <em>must<\/em> arrive at the same answer — they’re just different tools for the same job.<\/p>\n<p><strong>Method 1 — Substitution:<\/strong> Solve one equation for one variable, then plug that expression into the other equation.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Solve <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>−<\/mo><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. From the second equation, isolate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>3<\/mn><mo>−<\/mo><mi>y<\/mi><\/mrow><\/semantics><\/math> 2. Substitute into the first equation: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo>−<\/mo><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>−<\/mo><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> 3. Expand and simplify: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mo>−<\/mo><mn>2<\/mn><mi>y<\/mi><mo>−<\/mo><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><mo>⇒<\/mo><mn>6<\/mn><mo>−<\/mo><mn>3<\/mn><mi>y<\/mi><mo>=<\/mo><mn>3<\/mn><mo>⇒<\/mo><mo>−<\/mo><mn>3<\/mn><mi>y<\/mi><mo>=<\/mo><mo>−<\/mo><mn>3<\/mn><mo>⇒<\/mo><mi>y<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math> 4. Substitute <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math> back: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>3<\/mn><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>2<\/mn><mo>,<\/mo><mi>y<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Method 2 — Elimination:<\/strong> Multiply the equations so that one variable’s coefficients match, then add or subtract the equations to cancel it out.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Solve <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mi>y<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>−<\/mo><mn>3<\/mn><mi>y<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. To eliminate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>: multiply the first equation by 1 and the second by 3, so both have “<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><\/mrow><\/semantics><\/math>”: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mi>y<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>9<\/mn><mi>y<\/mi><mo>=<\/mo><mn>15<\/mn><\/mrow><\/semantics><\/math> 2. Subtract: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>−<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>9<\/mn><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>4<\/mn><mo>−<\/mo><mn>15<\/mn><mo>⇒<\/mo><mn>11<\/mn><mi>y<\/mi><mo>=<\/mo><mo>−<\/mo><mn>11<\/mn><mo>⇒<\/mo><mi>y<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math> 3. To eliminate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math> instead (double-check / find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>): multiply the first by 3 and second by 2: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><mi>y<\/mi><mo>=<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>−<\/mo><mn>6<\/mn><mi>y<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math>. Add: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>11<\/mn><mi>x<\/mi><mo>=<\/mo><mn>22<\/mn><mo>⇒<\/mo><mi>x<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>2<\/mn><mo>,<\/mo><mi>y<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Method 3 — Combined (fastest for exams):<\/strong> Use elimination to quickly find <em>one<\/em> variable, then substitute that number into either original equation to get the second variable — no need to eliminate twice.<\/p>\n<p><strong>Method 4 — Graphical:<\/strong> Plot both lines; the intersection point is the answer. Good for <em>understanding<\/em>, slower for exams — best used to double-check an algebraic answer visually.<\/p>\n","text":"The big picture: a single equation like x + y = 4 has infinitely many solutions (any point on that line). But if you have two equations at once, you’re looking for the one specific point that satisfies both — the point where two lines cross. There are four methods. All four must arrive at the same answer — they’re just different tools for the same job. Method 1 — Substitution: Solve one equation for one variable, then plug that expression into the other equation. Question: Solve 2 x − y = 3 and x + y = 3 . Solution: 1. From the second equation, isolate x : x = 3 − y 2. Substitute into the first equation: 2 ( 3 − y ) − y = 3 3. Expand and simplify: 6 − 2 y − y = 3 ⇒ 6 − 3 y = 3 ⇒ − 3 y = − 3 ⇒ y = 1 4. Substitute y = 1 back: x = 3 − 1 = 2 Answer: x = 2 , y = 1 Method 2 — Elimination: Multiply the equations so that one variable’s coefficients match, then add or subtract the equations to cancel it out. Question: Solve 3 x + 2 y = 4 and x − 3 y = 5 . Solution: 1. To eliminate x : multiply the first equation by 1 and the second by 3, so both have “ 3 x ”: 3 x + 2 y = 4 and 3 x − 9 y = 15 2. Subtract: ( 3 x + 2 y ) − ( 3 x − 9 y ) = 4 − 15 ⇒ 11 y = − 11 ⇒ y = − 1 3. To eliminate y instead (double-check / find x ): multiply the first by 3 and second by 2: 9 x + 6 y = 12 and 2 x − 6 y = 10 . Add: 11 x = 22 ⇒ x = 2 Answer: x = 2 , y = − 1 Method 3 — Combined (fastest for exams): Use elimination to quickly find one variable, then substitute that number into either original equation to get the second variable — no need to eliminate twice. Method 4 — Graphical: Plot both lines; the intersection point is the answer. Good for understanding , slower for exams — best used to double-check an algebraic answer visually.","min":2,"ex":false},{"id":"tka-c3-s4","title":"Quick Recall Boxes","html":"\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 34%\" />\n<col style=\"width: 43%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Topic<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Where You Learned It<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>10-Second Reminder<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Factoring<\/strong><\/td>\n<td style=\"text-align: left;\">Grade 9 → Section 1<\/td>\n<td style=\"text-align: left;\">GCF, difference of squares <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, trinomial factoring<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Relations &amp; Functions<\/strong><\/td>\n<td style=\"text-align: left;\">Grade 8 → Section 5<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mi>a<\/mi><mi>x<\/mi><mo>+<\/mo><mi>b<\/mi><\/mrow><\/semantics><\/math>; plug in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>, get <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> out<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Topic Where You Learned It 10-Second Reminder Factoring Grade 9 → Section 1 GCF, difference of squares a 2 − b 2 = ( a − b ) ( a + b ) , trinomial factoring Relations & Functions Grade 8 → Section 5 f ( x ) = a x + b ; plug in x , get f ( x ) out","min":2,"ex":false},{"id":"tka-c3-s5","title":"Number Patterns, Sequences, and Series — Finding the Pattern, Then Predicting Far Ahead","html":"\n<p><strong>Number Patterns — The Building Blocks<\/strong><\/p>\n<p>Before formal sequences, it helps to recognize a few classic patterns by sight:<\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Pattern<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Terms<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Rule<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Odd numbers<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>5<\/mn><mo>,<\/mo><mn>7<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Even numbers<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>8<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>n<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Square numbers<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><mn>4<\/mn><mo>,<\/mo><mn>9<\/mn><mo>,<\/mo><mn>16<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Triangular numbers<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>,<\/mo><mn>3<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>10<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mn>2<\/mn><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Rectangular numbers<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>12<\/mn><mo>,<\/mo><mn>20<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Object configuration patterns<\/strong> are the same idea shown as physical arrangements — like dots forming bigger and bigger triangles:<\/p>\n<pre><code>[DIAGRAM: Dot triangles growing]\n  •      •         •\n • •    • •       • •\n       • • •     • • •\n                • • • •\n (1 dot)  (3 dots)  (6 dots)  (10 dots)...<\/code><\/pre>\n<p>This is exactly the <strong>triangular number<\/strong> pattern above — the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math>-th triangle has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mn>2<\/mn><\/mfrac><\/semantics><\/math> dots. Recognizing “this looks like the triangular number pattern” instantly gives you the formula, without needing to count a large figure by hand.<\/p>\n<p><strong>The big picture (Sequences and Series):<\/strong> a <em>sequence<\/em> is an ordered list of numbers following a rule. A <em>series<\/em> is what you get when you <strong>add up<\/strong> the terms of a sequence. The entire goal of this topic is: given a few terms, figure out the rule well enough to predict <em>any<\/em> term — even the 100th one — without listing all 100.<\/p>\n<h4 id=\"arithmetic-sequences-same-size-steps\">Arithmetic Sequences — “Same-Size Steps”<\/h4>\n<p><strong>Analogy:<\/strong> climbing a staircase where every step is exactly the same height. If you know the height of one step and how many steps you’ve climbed, you instantly know your total height — no need to walk it out one step at a time.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mi>a<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>b<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> is the first term, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math> is the <strong>common difference<\/strong> (the constant “step size” between terms), and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> is which term number you want.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the 20th term of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>8<\/mn><mo>,<\/mo><mn>10<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math> (each term is 2 more than the last). <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mn>20<\/mn><\/msub><mo>=<\/mo><mn>4<\/mn><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>20<\/mn><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>4<\/mn><mo>+<\/mo><mn>38<\/mn><mo>=<\/mo><mn>42<\/mn><\/mrow><\/semantics><\/math><\/p>\n<h4 id=\"geometric-sequences-multiplying-instead-of-adding\">Geometric Sequences — “Multiplying Instead of Adding”<\/h4>\n<p><strong>Analogy:<\/strong> this is exactly the pattern of <em>compound growth<\/em> — like a rumor that doubles the number of people who’ve heard it every day, or a savings account earning compound interest (a connection back to Grade 7’s Social Arithmetics!). Instead of adding the same amount each step, you <strong>multiply<\/strong> by the same amount each step.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mi>a<\/mi><mo>×<\/mo><msup><mi>r<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r<\/mi><\/semantics><\/math> is the <strong>common ratio<\/strong>.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the 6th term of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mo>,<\/mo><mn>6<\/mn><mo>,<\/mo><mn>12<\/mn><mo>,<\/mo><mn>24<\/mn><mo>,<\/mo><mi>.<\/mi><mi>.<\/mi><mi>.<\/mi><\/mrow><\/semantics><\/math><\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math> (each term is double the last). <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mn>6<\/mn><\/msub><mo>=<\/mo><mn>3<\/mn><mo>×<\/mo><msup><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>6<\/mn><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/msup><mo>=<\/mo><mn>3<\/mn><mo>×<\/mo><mn>32<\/mn><mo>=<\/mo><mn>96<\/mn><\/mrow><\/semantics><\/math><\/p>\n<h4 id=\"series-the-running-total\">Series — The Running Total<\/h4>\n<p><strong>Arithmetic Series (sum of an arithmetic sequence):<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mfrac><mi>n<\/mi><mn>2<\/mn><\/mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>a<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Geometric Series (sum of a geometric sequence):<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>r<\/mi><mi>n<\/mi><\/msup><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>r<\/mi><mo>−<\/mo><mn>1<\/mn><\/mrow><\/mfrac><mspace width=\"0.333em\"><\/mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mrow><mtext mathvariant=\"normal\">for <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mi>r<\/mi><mo>&gt;<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><msub><mi>S<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo>−<\/mo><msup><mi>r<\/mi><mi>n<\/mi><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mn>1<\/mn><mo>−<\/mo><mi>r<\/mi><\/mrow><\/mfrac><mspace width=\"0.333em\"><\/mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mrow><mtext mathvariant=\"normal\">for <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mi>r<\/mi><mo>&lt;<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Why there’s a shortcut formula at all:<\/strong> imagine having to sum the first 50 terms of a sequence by hand, one by one. That would take forever and invite arithmetic slips. The series formula lets you jump straight to the total using only <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math> (or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r<\/mi><\/semantics><\/math>), and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> — a huge time-saver, especially under exam pressure.<\/p>\n","text":"Number Patterns — The Building Blocks Before formal sequences, it helps to recognize a few classic patterns by sight: Pattern Terms Rule Odd numbers 1 , 3 , 5 , 7 , . . . 2 n − 1 Even numbers 2 , 4 , 6 , 8 , . . . 2 n Square numbers 1 , 4 , 9 , 16 , . . . n 2 Triangular numbers 1 , 3 , 6 , 10 , . . . n ( n + 1 ) 2 Rectangular numbers 2 , 6 , 12 , 20 , . . . n ( n + 1 ) Object configuration patterns are the same idea shown as physical arrangements — like dots forming bigger and bigger triangles: [DIAGRAM: Dot triangles growing] • • • • • • • • • • • • • • • • • • • (1 dot) (3 dots) (6 dots) (10 dots)... This is exactly the triangular number pattern above — the n -th triangle has n ( n + 1 ) 2 dots. Recognizing “this looks like the triangular number pattern” instantly gives you the formula, without needing to count a large figure by hand. The big picture (Sequences and Series): a sequence is an ordered list of numbers following a rule. A series is what you get when you add up the terms of a sequence. The entire goal of this topic is: given a few terms, figure out the rule well enough to predict any term — even the 100th one — without listing all 100. Arithmetic Sequences — “Same-Size Steps” Analogy: climbing a staircase where every step is exactly the same height. If you know the height of one step and how many steps you’ve climbed, you instantly know your total height — no need to walk it out one step at a time. U n = a + ( n − 1 ) b where a is the first term, b is the common difference (the constant “step size” between terms), and n is which term number you want. Question: Find the 20th term of 4 , 6 , 8 , 10 , . . . Solution: a = 4 , b = 2 (each term is 2 more than the last). U 20 = 4 + ( 20 − 1 ) ( 2 ) = 4 + 38 = 42 Geometric Sequences — “Multiplying Instead of Adding” Analogy: this is exactly the pattern of compound growth — like a rumor that doubles the number of people who’ve heard it every day, or a savings account earning compound interest (a connection back to Grade 7’s Social Arithmetics!). Instead of adding the same amount each step, you multiply by the same amount each step. U n = a × r ( n − 1 ) where r is the common ratio . Question: Find the 6th term of 3 , 6 , 12 , 24 , . . . Solution: a = 3 , r = 2 (each term is double the last). U 6 = 3 × 2 ( 6 − 1 ) = 3 × 32 = 96 Series — The Running Total Arithmetic Series (sum of an arithmetic sequence): S n = n 2 ( 2 a + ( n − 1 ) b ) Geometric Series (sum of a geometric sequence): S n = a ( r n − 1 ) r − 1 ( for r > 1 ) S n = a ( 1 − r n ) 1 − r ( for r < 1 ) Why there’s a shortcut formula at all: imagine having to sum the first 50 terms of a sequence by hand, one by one. That would take forever and invite arithmetic slips. The series formula lets you jump straight to the total using only a , b (or r ), and n — a huge time-saver, especially under exam pressure.","min":4,"ex":false},{"id":"tka-c3-s6","title":"Worked Examples — Algebra Extended (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — inequality):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Solve <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>7<\/mn><mo>≤<\/mo><mn>8<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>≤<\/mo><mn>15<\/mn><mo>⇒<\/mo><mi>x<\/mi><mo>≤<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math> <em>(divided by positive 3 — no flip needed)<\/em><\/p>\n<p><strong>Example 2 (SPLDV, real-world framing):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Two items, a pen and a notebook, are bought together. 2 pens + 1 notebook cost Rp13.000. 1 pen + 3 notebooks cost Rp24.000. Find the price of one pen and one notebook.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Let pen = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p<\/mi><\/semantics><\/math>, notebook = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math>. Equations: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>p<\/mi><mo>+<\/mo><mi>n<\/mi><mo>=<\/mo><mn>13.000<\/mn><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>+<\/mo><mn>3<\/mn><mi>n<\/mi><mo>=<\/mo><mn>24.000<\/mn><\/mrow><\/semantics><\/math> 2. From the second equation: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>=<\/mo><mn>24.000<\/mn><mo>−<\/mo><mn>3<\/mn><mi>n<\/mi><\/mrow><\/semantics><\/math> 3. Substitute into the first: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>24.000<\/mn><mo>−<\/mo><mn>3<\/mn><mi>n<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mi>n<\/mi><mo>=<\/mo><mn>13.000<\/mn><mo>⇒<\/mo><mn>48.000<\/mn><mo>−<\/mo><mn>6<\/mn><mi>n<\/mi><mo>+<\/mo><mi>n<\/mi><mo>=<\/mo><mn>13.000<\/mn><mo>⇒<\/mo><mo>−<\/mo><mn>5<\/mn><mi>n<\/mi><mo>=<\/mo><mo>−<\/mo><mn>35.000<\/mn><mo>⇒<\/mo><mi>n<\/mi><mo>=<\/mo><mn>7.000<\/mn><\/mrow><\/semantics><\/math> 4. Substitute back: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p<\/mi><mo>=<\/mo><mn>24.000<\/mn><mo>−<\/mo><mn>3<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>7.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>24.000<\/mn><mo>−<\/mo><mn>21.000<\/mn><mo>=<\/mo><mn>3.000<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> A pen costs <strong>Rp3.000<\/strong>, a notebook costs <strong>Rp7.000<\/strong>.<\/p>\n<p><strong>Example 3 (HOTS — sequences applied to a real scenario):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A gym membership costs Rp150.000 to join, plus Rp80.000 for each month. Using a sequence formula (not a running list), find the total amount paid <em>by the end of<\/em> the 12th month (i.e., the 12th monthly payment, not including further months).<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. This is arithmetic: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mn>150.000<\/mn><mo>+<\/mo><mn>80.000<\/mn><mo>=<\/mo><mn>230.000<\/mn><\/mrow><\/semantics><\/math> (total paid after month 1), <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b<\/mi><mo>=<\/mo><mn>80.000<\/mn><\/mrow><\/semantics><\/math> (each month adds a fixed amount) 2. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mn>12<\/mn><\/msub><mo>=<\/mo><mi>a<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>12<\/mn><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>b<\/mi><mo>=<\/mo><mn>230.000<\/mn><mo>+<\/mo><mn>11<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>80.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>230.000<\/mn><mo>+<\/mo><mn>880.000<\/mn><mo>=<\/mo><mn>1.110<\/mn><mn>.000<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> By the end of month 12, total paid is <strong>Rp1.110.000<\/strong>.<\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — combines inequality reasoning with sequences):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Using the same gym from Example 3, after how many months will the <em>total amount paid<\/em> first exceed Rp1.500.000? (You do not need to test every month one by one — set up an inequality using the arithmetic series or sequence idea.)<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> 1. Total paid after <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> months: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>=<\/mo><mn>230.000<\/mn><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>80.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> 2. We want <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U<\/mi><mi>n<\/mi><\/msub><mo>&gt;<\/mo><mn>1.500<\/mn><mn>.000<\/mn><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>230.000<\/mn><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>80.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>&gt;<\/mo><mn>1.500<\/mn><mn>.000<\/mn><\/mrow><\/semantics><\/math> 3. Subtract 230.000: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>80.000<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>&gt;<\/mo><mn>1.270<\/mn><mn>.000<\/mn><\/mrow><\/semantics><\/math> 4. Divide by 80.000 (positive, no flip): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>−<\/mo><mn>1<\/mn><mo>&gt;<\/mo><mn>15.875<\/mn><\/mrow><\/semantics><\/math> 5. Add 1: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>&gt;<\/mo><mn>16.875<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> Since <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> must be a whole number of months, the total first exceeds Rp1.500.000 in the <strong>17th month<\/strong>. <em>(This is a genuinely analytical question — it forces combining an inequality’s logic with a sequence formula, exactly the kind of blending the TKA rewards.)<\/em><\/p>\n","text":"Example 1 (Warm-up — inequality): Question: Solve 3 x − 7 ≤ 8 . Solution: 3 x ≤ 15 ⇒ x ≤ 5 (divided by positive 3 — no flip needed) Example 2 (SPLDV, real-world framing): Question: Two items, a pen and a notebook, are bought together. 2 pens + 1 notebook cost Rp13.000. 1 pen + 3 notebooks cost Rp24.000. Find the price of one pen and one notebook. Solution: 1. Let pen = p , notebook = n . Equations: 2 p + n = 13.000 and p + 3 n = 24.000 2. From the second equation: p = 24.000 − 3 n 3. Substitute into the first: 2 ( 24.000 − 3 n ) + n = 13.000 ⇒ 48.000 − 6 n + n = 13.000 ⇒ − 5 n = − 35.000 ⇒ n = 7.000 4. Substitute back: p = 24.000 − 3 ( 7.000 ) = 24.000 − 21.000 = 3.000 Answer: A pen costs Rp3.000 , a notebook costs Rp7.000 . Example 3 (HOTS — sequences applied to a real scenario): Question: A gym membership costs Rp150.000 to join, plus Rp80.000 for each month. Using a sequence formula (not a running list), find the total amount paid by the end of the 12th month (i.e., the 12th monthly payment, not including further months). Solution: 1. This is arithmetic: a = 150.000 + 80.000 = 230.000 (total paid after month 1), b = 80.000 (each month adds a fixed amount) 2. U 12 = a + ( 12 − 1 ) b = 230.000 + 11 ( 80.000 ) = 230.000 + 880.000 = 1.110 .000 Answer: By the end of month 12, total paid is Rp1.110.000 . Example 4 (Pure analogical, above HOTS — combines inequality reasoning with sequences): Question: Using the same gym from Example 3, after how many months will the total amount paid first exceed Rp1.500.000? (You do not need to test every month one by one — set up an inequality using the arithmetic series or sequence idea.) Solution: 1. Total paid after n months: U n = 230.000 + ( n − 1 ) ( 80.000 ) 2. We want U n > 1.500 .000 : 230.000 + ( n − 1 ) ( 80.000 ) > 1.500 .000 3. Subtract 230.000: ( n − 1 ) ( 80.000 ) > 1.270 .000 4. Divide by 80.000 (positive, no flip): n − 1 > 15.875 5. Add 1: n > 16.875 Answer: Since n must be a whole number of months, the total first exceeds Rp1.500.000 in the 17th month . (This is a genuinely analytical question — it forces combining an inequality’s logic with a sequence formula, exactly the kind of blending the TKA rewards.)","min":3,"ex":true},{"id":"tka-c3-s7","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Mixing up direct and inverse proportion.<\/strong> Always ask first: “if one goes up, does the other go up or down?” before picking a formula.<\/li>\n<li><strong>Forgetting to flip the inequality sign<\/strong> when multiplying/dividing by a negative number.<\/li>\n<li><strong>Mixing up arithmetic and geometric sequence formulas<\/strong> — check whether terms are separated by a constant <em>difference<\/em> (arithmetic) or constant <em>ratio<\/em> (geometric) before picking a formula.<\/li>\n<li><strong>Sign errors during elimination<\/strong> — when subtracting one whole equation from another, every term (not just some) must have its sign flipped correctly.<\/li>\n<li><strong>Rounding<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> <strong>incorrectly in sequence inequalities<\/strong> (Example 4) — always round <em>up<\/em> to the next whole term if the exact value isn’t a whole number, since you need the total to <em>exceed<\/em> the target.<\/li>\n<\/ul>\n","text":"Mixing up direct and inverse proportion. Always ask first: “if one goes up, does the other go up or down?” before picking a formula. Forgetting to flip the inequality sign when multiplying/dividing by a negative number. Mixing up arithmetic and geometric sequence formulas — check whether terms are separated by a constant difference (arithmetic) or constant ratio (geometric) before picking a formula. Sign errors during elimination — when subtracting one whole equation from another, every term (not just some) must have its sign flipped correctly. Rounding n incorrectly in sequence inequalities (Example 4) — always round up to the next whole term if the exact value isn’t a whole number, since you need the total to exceed the target.","min":2,"ex":false},{"id":"tka-c3-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"8 workers finish in 15 days. How many days for 5 workers? Solve −2x > 6. Solve 2x − y = 3 and x + y = 3. 20th term of 4, 6, 8, 10, … 6th term of 3, 6, 12, 24, … Triangular numbers 1, 3, 6, 10 follow… A map scale 1:10.000 means 1 cm equals…","min":4,"ex":false,"quiz":true}]},{"id":"tka-c4","title":"Geometry & Measurement — The Consolidated View","raw":"C. Geometry & Measurement — The Consolidated View","sections":[{"id":"tka-c4-s1","title":"Lines — How Two Straight Paths Can Relate","html":"\n<p>Before angles, it’s worth naming the four ways two lines can sit relative to each other on a flat surface:<\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Position<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Description<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Sketch<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Intersecting<\/strong><\/td>\n<td style=\"text-align: left;\">Cross at exactly 1 point<\/td>\n<td style=\"text-align: left;\">✕<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Overlapping<\/strong><\/td>\n<td style=\"text-align: left;\">Share more than 1 point (they lie on top of each other)<\/td>\n<td style=\"text-align: left;\">═══<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Parallel<\/strong><\/td>\n<td style=\"text-align: left;\">Never intersect, no matter how far extended<\/td>\n<td style=\"text-align: left;\">═══ ═══<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Perpendicular<\/strong><\/td>\n<td style=\"text-align: left;\">Intersect at exactly 1 point, forming a 90° angle<\/td>\n<td style=\"text-align: left;\">⊥<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why this matters beyond just vocabulary:<\/strong> “parallel” and “perpendicular” reappear constantly — in Grade 8’s Linear Equations (parallel lines share the same slope; perpendicular slopes are negative reciprocals) and in polygon formulas (a rectangle is defined by having 4 right angles, i.e., perpendicular sides).<\/p>\n","text":"Before angles, it’s worth naming the four ways two lines can sit relative to each other on a flat surface: Position Description Sketch Intersecting Cross at exactly 1 point ✕ Overlapping Share more than 1 point (they lie on top of each other) ═══ Parallel Never intersect, no matter how far extended ═══ ═══ Perpendicular Intersect at exactly 1 point, forming a 90° angle ⊥ Why this matters beyond just vocabulary: “parallel” and “perpendicular” reappear constantly — in Grade 8’s Linear Equations (parallel lines share the same slope; perpendicular slopes are negative reciprocals) and in polygon formulas (a rectangle is defined by having 4 right angles, i.e., perpendicular sides).","min":2,"ex":false},{"id":"tka-c4-s2","title":"Quick Recall Map","html":"\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 37%\" />\n<col style=\"width: 37%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Topic<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Where You Learned It<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>10-Second Reminder<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Pythagorean Theorem<\/strong><\/td>\n<td style=\"text-align: left;\">Grade 7 → Section 4<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> — right triangles only, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math> is always the hypotenuse<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Angles<\/strong> (types, complementary, supplementary)<\/td>\n<td style=\"text-align: left;\">Grade 8 → Section 2<\/td>\n<td style=\"text-align: left;\">Complementary sums to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>, supplementary sums to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>180<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Congruency &amp; Similarity<\/strong><\/td>\n<td style=\"text-align: left;\">Grade 9 → Section 3<\/td>\n<td style=\"text-align: left;\">Congruent = identical; Similar = same shape, scaled size<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Circle<\/strong> (parts, angle theorems, arc/sector)<\/td>\n<td style=\"text-align: left;\">Grade 9 → Section 4<\/td>\n<td style=\"text-align: left;\">Arc/Sector fraction = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>θ<\/mi><mn>360<\/mn><\/mfrac><\/semantics><\/math> of the full circumference/area<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Topic Where You Learned It 10-Second Reminder Pythagorean Theorem Grade 7 → Section 4 a 2 + b 2 = c 2 — right triangles only, c is always the hypotenuse Angles (types, complementary, supplementary) Grade 8 → Section 2 Complementary sums to 90 ∘ , supplementary sums to 180 ∘ Congruency & Similarity Grade 9 → Section 3 Congruent = identical; Similar = same shape, scaled size Circle (parts, angle theorems, arc/sector) Grade 9 → Section 4 Arc/Sector fraction = θ 360 of the full circumference/area","min":2,"ex":false},{"id":"tka-c4-s3","title":"Polygon Formula Reference Sheet","html":"\n<p>This is genuinely new material — Grade 7–9 never gathered all polygon formulas in one place. Having them side-by-side helps you see the <em>family resemblance<\/em> between shapes (notice how many area formulas are built from a “base × height” idea, just packaged differently).<\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 23%\" />\n<col style=\"width: 23%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Shape<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Perimeter<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Area<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Triangle<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo>+<\/mo><mi>c<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>×<\/mo><mi>b<\/mi><mo>×<\/mo><mi>h<\/mi><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Square<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mn>4<\/mn><mi>a<\/mi><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Rectangle<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<
