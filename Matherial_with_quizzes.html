row><mn>25<\/mn><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>5<\/mn><mi>y<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>16<\/mn><mo>=<\/mo><msup><mn>4<\/mn><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math>.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25<\/mn><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>16<\/mn><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>5<\/mn><mi>y<\/mi><mo>−<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>5<\/mn><mi>y<\/mi><mo>+<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — factoring combined with solving an equation):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Solve for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>7<\/mn><mi>x<\/mi><mo>+<\/mo><mn>10<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math><\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Find two numbers that add to 7 and multiply to 10 → 2 and 5<\/td>\n<td style=\"text-align: left;\">factors found<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Factor: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">equation factored<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">If a product equals zero, at least one factor must be zero: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mn>5<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">zero-product reasoning<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Solve each mini-equation<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mo>−<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mo>−<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mo>−<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mo>−<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — factoring a fraction, as in the original textbook style):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Simplify: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mn>15<\/mn><mi>b<\/mi><mo>−<\/mo><mn>10<\/mn><\/mrow><mrow><mn>15<\/mn><mi>b<\/mi><mo>+<\/mo><mn>9<\/mn><\/mrow><\/mfrac><mo>÷<\/mo><\/mrow><\/semantics><\/math> … <em>(simplify the fraction by factoring numerator and denominator using a common structural factor)<\/em>: given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mi>b<\/mi><mo>−<\/mo><mn>10<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mi>b<\/mi><mo>+<\/mo><mn>9<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mn>15<\/mn><\/mfrac><\/semantics><\/math>, simplify fully.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">The denominator 15 doesn’t divide either factor cleanly — break it into <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mo>×<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15<\/mn><mo>=<\/mo><mn>5<\/mn><mo>×<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Divide <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mi>b<\/mi><mo>−<\/mo><mn>10<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> by 5: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15<\/mn><mi>b<\/mi><mo>÷<\/mo><mn>5<\/mn><mo>=<\/mo><mn>3<\/mn><mi>b<\/mi><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10<\/mn><mo>÷<\/mo><mn>5<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>b<\/mi><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Divide <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>15<\/mn><mi>b<\/mi><mo>+<\/mo><mn>9<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math> by 3: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15<\/mn><mi>b<\/mi><mo>÷<\/mo><mn>3<\/mn><mo>=<\/mo><mn>5<\/mn><mi>b<\/mi><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mo>÷<\/mo><mn>3<\/mn><mo>=<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>5<\/mn><mi>b<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>b<\/mi><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>5<\/mn><mi>b<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> <em>(This is a genuinely tricky move: instead of dividing the whole numerator by 15, split 15 into two smaller factors and divide each bracket by a different one — a technique that only makes sense once you deeply understand what factoring is actually doing.)<\/em><\/p>\n","text":"Example 1 (Warm-up — GCF): Question: Factor 12 x + 18 . Solution: GCF of 12 and 18 is 6. 12 x + 18 = 6 ( 2 x + 3 ) Answer: 6 ( 2 x + 3 ) Example 2 (Difference of squares): Question: Factor 25 y 2 − 16 . Solution: 25 y 2 = ( 5 y ) 2 and 16 = 4 2 . 25 y 2 − 16 = ( 5 y − 4 ) ( 5 y + 4 ) Example 3 (HOTS — factoring combined with solving an equation): Question: Solve for x : x 2 + 7 x + 10 = 0 Step Action Result 1 Find two numbers that add to 7 and multiply to 10 → 2 and 5 factors found 2 Factor: ( x + 2 ) ( x + 5 ) = 0 equation factored 3 If a product equals zero, at least one factor must be zero: x + 2 = 0 or x + 5 = 0 zero-product reasoning 4 Solve each mini-equation x = − 2 or x = − 5 Answer: x = − 2 or x = − 5 Example 4 (Pure analogical, above HOTS — factoring a fraction, as in the original textbook style): Question: Simplify: 15 b − 10 15 b + 9 ÷ … (simplify the fraction by factoring numerator and denominator using a common structural factor) : given ( 15 b − 10 ) ( 15 b + 9 ) 15 , simplify fully. Step Action Result 1 The denominator 15 doesn’t divide either factor cleanly — break it into 5 × 3 15 = 5 × 3 2 Divide ( 15 b − 10 ) by 5: 15 b ÷ 5 = 3 b , 10 ÷ 5 = 2 ( 3 b − 2 ) 3 Divide ( 15 b + 9 ) by 3: 15 b ÷ 3 = 5 b , 9 ÷ 3 = 3 ( 5 b + 3 ) Answer: ( 3 b − 2 ) ( 5 b + 3 ) (This is a genuinely tricky move: instead of dividing the whole numerator by 15, split 15 into two smaller factors and divide each bracket by a different one — a technique that only makes sense once you deeply understand what factoring is actually doing.)","min":2,"ex":true},{"id":"9-c1-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Forgetting to check for a GCF first<\/strong>, before trying more complicated patterns — always factor out the GCF <em>first<\/em>, every time.<\/li>\n<li><strong>Using difference-of-squares on a <em>sum<\/em> of squares<\/strong> (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> does <strong>not<\/strong> factor this way — only subtraction does).<\/li>\n<li><strong>Sign errors when finding the two numbers<\/strong> that add/multiply correctly — if <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math> is negative, the two numbers must have opposite signs; if <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math> is positive and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math> is negative, both numbers must be negative.<\/li>\n<\/ul>\n","text":"Forgetting to check for a GCF first , before trying more complicated patterns — always factor out the GCF first , every time. Using difference-of-squares on a sum of squares ( a 2 + b 2 does not factor this way — only subtraction does). Sign errors when finding the two numbers that add/multiply correctly — if c is negative, the two numbers must have opposite signs; if c is positive and b is negative, both numbers must be negative.","min":2,"ex":false},{"id":"9-c1-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Factor 12x + 18 using the GCF. Factor 25y² − 16. Factor x² + 5x + 6. Factor x² + 6x + 9. Solve x² + 7x + 10 = 0.","min":3,"ex":false,"quiz":true}]},{"id":"9-c2","title":"Exponents and Roots","raw":"2. Exponents and Roots","sections":[{"id":"9-c2-s1","title":"What Is an Exponent, Really?","html":"\n<p>An exponent is just <strong>repeated multiplication written in shorthand<\/strong>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>a<\/mi><mi>b<\/mi><\/msup><\/semantics><\/math> means “multiply <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> by itself, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math> times.”<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mn>3<\/mn><mo>×<\/mo><mn>3<\/mn><mo>=<\/mo><mn>9<\/mn><\/mrow><\/semantics><\/math><\/p>\n","text":"An exponent is just repeated multiplication written in shorthand : a b means “multiply a by itself, b times.” 3 2 = 3 × 3 = 9","min":2,"ex":false},{"id":"9-c2-s2","title":"The Exponent Rules — With the Logic Behind Each","html":"\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 52%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Rule<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Formula<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Why It Works<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Multiplying powers<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mi>m<\/mi><\/msup><mo>×<\/mo><msup><mi>a<\/mi><mi>n<\/mi><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mrow><mi>m<\/mi><mo>+<\/mo><mi>n<\/mi><\/mrow><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>×<\/mo><msup><mi>a<\/mi><mn>3<\/mn><\/msup><\/mrow><\/semantics><\/math> means <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>⋅<\/mo><mi>a<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>⋅<\/mo><mi>a<\/mi><mo>⋅<\/mo><mi>a<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> = 5 total <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math>’s multiplied<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Dividing powers<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mi>m<\/mi><\/msup><mo>÷<\/mo><msup><mi>a<\/mi><mi>n<\/mi><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mrow><mi>m<\/mi><mo>−<\/mo><mi>n<\/mi><\/mrow><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">Matching <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math>’s in top and bottom cancel out<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Power of a power<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>a<\/mi><mi>m<\/mi><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>n<\/mi><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mrow><mi>m<\/mi><mo>×<\/mo><mi>n<\/mi><\/mrow><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">Repeating a group of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m<\/mi><\/semantics><\/math> multiplications, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> times total<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Power of a product<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>m<\/mi><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mi>m<\/mi><\/msup><msup><mi>b<\/mi><mi>m<\/mi><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">Each factor inside gets raised separately<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Power of a quotient<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mi>m<\/mi><\/msup><mo>=<\/mo><mfrac><msup><mi>a<\/mi><mi>m<\/mi><\/msup><msup><mi>b<\/mi><mi>m<\/mi><\/msup><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">Same idea as power of a product, applied to both top and bottom<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Zero exponent<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>0<\/mn><\/msup><mo>=<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">Following the division rule: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mi>m<\/mi><\/msup><mo>÷<\/mo><msup><mi>a<\/mi><mi>m<\/mi><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mn>0<\/mn><\/msup><\/mrow><\/semantics><\/math>, but anything divided by itself is 1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Negative exponent<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mrow><mo>−<\/mo><mi>n<\/mi><\/mrow><\/msup><mo>=<\/mo><mfrac><mn>1<\/mn><msup><mi>a<\/mi><mi>n<\/mi><\/msup><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">A “negative” repeat count means “flip to the denominator” instead of multiplying<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Rule Formula Why It Works Multiplying powers a m × a n = a m + n a 2 × a 3 means ( a ⋅ a ) ( a ⋅ a ⋅ a ) = 5 total a ’s multiplied Dividing powers a m ÷ a n = a m − n Matching a ’s in top and bottom cancel out Power of a power ( a m ) n = a m × n Repeating a group of m multiplications, n times total Power of a product ( a b ) m = a m b m Each factor inside gets raised separately Power of a quotient ( a b ) m = a m b m Same idea as power of a product, applied to both top and bottom Zero exponent a 0 = 1 Following the division rule: a m ÷ a m = a 0 , but anything divided by itself is 1 Negative exponent a − n = 1 a n A “negative” repeat count means “flip to the denominator” instead of multiplying","min":2,"ex":false},{"id":"9-c2-s3","title":"Radical Form — The Inverse of Exponents","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mrow><mi>m<\/mi><mi>/<\/mi><mi>n<\/mi><\/mrow><\/msup><mo>=<\/mo><mroot><msup><mi>a<\/mi><mi>m<\/mi><\/msup><mi>n<\/mi><\/mroot><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Simplifying radicals:<\/strong> find a perfect-square factor hiding inside the number.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Simplify <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>18<\/mn><\/msqrt><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>18<\/mn><mo>=<\/mo><mn>9<\/mn><mo>×<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>, and 9 is a perfect square.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>18<\/mn><\/msqrt><mo>=<\/mo><msqrt><mrow><mn>9<\/mn><mo>×<\/mo><mn>2<\/mn><\/mrow><\/msqrt><mo>=<\/mo><msqrt><mn>9<\/mn><\/msqrt><mo>×<\/mo><msqrt><mn>2<\/mn><\/msqrt><mo>=<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Operations with radicals:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 24%\" />\n<col style=\"width: 49%\" />\n<col style=\"width: 24%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Operation<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Rule<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Note<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Addition/Subtraction<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><msqrt><mi>c<\/mi><\/msqrt><mo>±<\/mo><mi>b<\/mi><msqrt><mi>c<\/mi><\/msqrt><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>±<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><msqrt><mi>c<\/mi><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">Only works if the number <strong>inside<\/strong> the radical is identical — just like combining like terms (Grade 7 → Section 3.3), <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mi>c<\/mi><\/msqrt><\/semantics><\/math> acts as the “variable” being combined<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Multiplication<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mi>a<\/mi><\/msqrt><mo>×<\/mo><msqrt><mi>b<\/mi><\/msqrt><mo>=<\/mo><msqrt><mrow><mi>a<\/mi><mo>×<\/mo><mi>b<\/mi><\/mrow><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Division<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mi>a<\/mi><\/msqrt><mo>÷<\/mo><msqrt><mi>b<\/mi><\/msqrt><mo>=<\/mo><msqrt><mrow><mi>a<\/mi><mo>÷<\/mo><mi>b<\/mi><\/mrow><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Question:<\/strong> Simplify <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><msqrt><mn>3<\/mn><\/msqrt><mo>+<\/mo><mn>2<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Same radical part (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>3<\/mn><\/msqrt><\/semantics><\/math>) → combine the coefficients like like-terms: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>5<\/mn><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><msqrt><mn>3<\/mn><\/msqrt><mo>=<\/mo><mn>7<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/p>\n","text":"a m / n = a m n Simplifying radicals: find a perfect-square factor hiding inside the number. Question: Simplify 18 . Solution: 18 = 9 × 2 , and 9 is a perfect square. 18 = 9 × 2 = 9 × 2 = 3 2 Operations with radicals: Operation Rule Note Addition/Subtraction a c ± b c = ( a ± b ) c Only works if the number inside the radical is identical — just like combining like terms (Grade 7 → Section 3.3), c acts as the “variable” being combined Multiplication a × b = a × b Division a ÷ b = a ÷ b Question: Simplify 5 3 + 2 3 . Solution: Same radical part ( 3 ) → combine the coefficients like like-terms: ( 5 + 2 ) 3 = 7 3","min":2,"ex":false},{"id":"9-c2-s4","title":"Rationalizing the Denominator","html":"\n<p>Fractions should never have a root sitting in the denominator. Fix it by multiplying top and bottom by the right expression.<\/p>\n<ul>\n<li><strong>Simple case:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>a<\/mi><msqrt><mi>b<\/mi><\/msqrt><\/mfrac><mo>=<\/mo><mfrac><mi>a<\/mi><msqrt><mi>b<\/mi><\/msqrt><\/mfrac><mo>×<\/mo><mfrac><msqrt><mi>b<\/mi><\/msqrt><msqrt><mi>b<\/mi><\/msqrt><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>a<\/mi><msqrt><mi>b<\/mi><\/msqrt><\/mrow><mi>b<\/mi><\/mfrac><\/mrow><\/semantics><\/math><\/li>\n<li><strong>Conjugate case:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>c<\/mi><mrow><mi>a<\/mi><mo>+<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mi>c<\/mi><mrow><mi>a<\/mi><mo>+<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><\/mfrac><mo>×<\/mo><mfrac><mrow><mi>a<\/mi><mo>−<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><mrow><mi>a<\/mi><mo>−<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>c<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><msqrt><mi>b<\/mi><\/msqrt><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mi>b<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/li>\n<\/ul>\n<p><strong>Why the conjugate trick works:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><msqrt><mi>b<\/mi><\/msqrt><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><msqrt><mi>b<\/mi><\/msqrt><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> is a difference of squares — the exact same pattern from Section 1.3! It cleanly eliminates the square root from the denominator because <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mi>b<\/mi><\/msqrt><mo>×<\/mo><msqrt><mi>b<\/mi><\/msqrt><mo>=<\/mo><mi>b<\/mi><\/mrow><\/semantics><\/math>, a whole number.<\/p>\n","text":"Fractions should never have a root sitting in the denominator. Fix it by multiplying top and bottom by the right expression. Simple case: a b = a b × b b = a b b Conjugate case: c a + b = c a + b × a − b a − b = c ( a − b ) a 2 − b Why the conjugate trick works: ( a + b ) ( a − b ) is a difference of squares — the exact same pattern from Section 1.3! It cleanly eliminates the square root from the denominator because b × b = b , a whole number.","min":2,"ex":false},{"id":"9-c2-s5","title":"Worked Examples — Exponents and Roots (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Simplify <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>2<\/mn><mn>3<\/mn><\/msup><mo>×<\/mo><msup><mn>2<\/mn><mn>4<\/mn><\/msup><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Same base → add exponents: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>2<\/mn><mrow><mn>3<\/mn><mo>+<\/mo><mn>4<\/mn><\/mrow><\/msup><mo>=<\/mo><msup><mn>2<\/mn><mn>7<\/mn><\/msup><mo>=<\/mo><mn>128<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Negative exponent):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Evaluate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mn>4<\/mn><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><\/msup><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>4<\/mn><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><\/msup><mo>=<\/mo><mfrac><mn>1<\/mn><msup><mn>4<\/mn><mn>2<\/mn><\/msup><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>16<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — combining multiple exponent rules):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Simplify <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>×<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><\/mfrac><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 10%\" />\n<col style=\"width: 51%\" />\n<col style=\"width: 35%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Apply power of a power: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>x<\/mi><mrow><mn>3<\/mn><mo>×<\/mo><mn>2<\/mn><\/mrow><\/msup><mo>=<\/mo><msup><mi>x<\/mi><mn>6<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><msup><mi>x<\/mi><mn>6<\/mn><\/msup><mo>×<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><msup><mi>x<\/mi><mn>5<\/mn><\/msup><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Multiply powers in the numerator: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mrow><mn>6<\/mn><mo>+<\/mo><mn>4<\/mn><\/mrow><\/msup><mo>=<\/mo><msup><mi>x<\/mi><mn>10<\/mn><\/msup><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><msup><mi>x<\/mi><mn>10<\/mn><\/msup><msup><mi>x<\/mi><mn>5<\/mn><\/msup><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Divide powers: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>x<\/mi><mrow><mn>10<\/mn><mo>−<\/mo><mn>5<\/mn><\/mrow><\/msup><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>x<\/mi><mn>5<\/mn><\/msup><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>x<\/mi><mn>5<\/mn><\/msup><\/semantics><\/math><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — rationalizing a conjugate denominator):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Rationalize and simplify: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>6<\/mn><mrow><mn>2<\/mn><mo>+<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/mfrac><\/semantics><\/math><\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 7%\" />\n<col style=\"width: 30%\" />\n<col style=\"width: 61%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Multiply top and bottom by the conjugate, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>−<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>6<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>−<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>+<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>−<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Expand the denominator (difference of squares): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>=<\/mo><mn>4<\/mn><mo>−<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>1<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Expand the numerator: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mo>×<\/mo><mn>2<\/mn><mo>−<\/mo><mn>6<\/mn><mo>×<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>−<\/mo><mn>6<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Divide by the denominator (which is just 1)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>−<\/mo><mn>6<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>−<\/mo><mn>6<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/semantics><\/math><\/p>\n","text":"Example 1 (Warm-up): Question: Simplify 2 3 × 2 4 . Solution: Same base → add exponents: 2 3 + 4 = 2 7 = 128 Example 2 (Negative exponent): Question: Evaluate 4 − 2 . Solution: 4 − 2 = 1 4 2 = 1 16 Example 3 (HOTS — combining multiple exponent rules): Question: Simplify ( x 3 ) 2 × x 4 x 5 . Step Action Result 1 Apply power of a power: ( x 3 ) 2 = x 3 × 2 = x 6 x 6 × x 4 x 5 2 Multiply powers in the numerator: x 6 + 4 = x 10 x 10 x 5 3 Divide powers: x 10 − 5 x 5 Answer: x 5 Example 4 (Pure analogical, above HOTS — rationalizing a conjugate denominator): Question: Rationalize and simplify: 6 2 + 3 Step Action Result 1 Multiply top and bottom by the conjugate, 2 − 3 6 ( 2 − 3 ) ( 2 + 3 ) ( 2 − 3 ) 2 Expand the denominator (difference of squares): 2 2 − ( 3 ) 2 = 4 − 3 1 3 Expand the numerator: 6 × 2 − 6 × 3 12 − 6 3 4 Divide by the denominator (which is just 1) 12 − 6 3 Answer: 12 − 6 3","min":2,"ex":true},{"id":"9-c2-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Adding exponents when the bases are different.<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>×<\/mo><msup><mi>b<\/mi><mn>3<\/mn><\/msup><\/mrow><\/semantics><\/math> does <strong>not<\/strong> simplify further — the multiplying-powers rule only works when the <em>base<\/em> is identical.<\/li>\n<li><strong>Thinking<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>0<\/mn><\/msup><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math><strong>.<\/strong> Any nonzero number to the power of 0 is <strong>1<\/strong>, not 0.<\/li>\n<li><strong>Rationalizing with the wrong sign.<\/strong> The conjugate of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>+<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><\/semantics><\/math> is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>−<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><\/semantics><\/math> (flip the middle sign only) — using <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mi>a<\/mi><mo>+<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><\/semantics><\/math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mi>a<\/mi><mo>−<\/mo><msqrt><mi>b<\/mi><\/msqrt><\/mrow><\/semantics><\/math> won’t cancel the root correctly.<\/li>\n<\/ul>\n","text":"Adding exponents when the bases are different. a 2 × b 3 does not simplify further — the multiplying-powers rule only works when the base is identical. Thinking a 0 = 0 . Any nonzero number to the power of 0 is 1 , not 0. Rationalizing with the wrong sign. The conjugate of a + b is a − b (flip the middle sign only) — using − a + b or − a − b won’t cancel the root correctly.","min":2,"ex":false},{"id":"9-c2-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"2³ × 2⁴ = ? 4⁻² = ? Any nonzero number to the power 0 equals… √18 simplifies to… 5√3 + 2√3 = ? Rationalize 6 / (2 + √3).","min":4,"ex":false,"quiz":true}]},{"id":"9-c3","title":"Congruency and Similarity","raw":"3. Congruency and Similarity","sections":[{"id":"9-c3-s1","title":"The Core Difference, In One Sentence","html":"\n<p><strong>Congruent<\/strong> shapes are identical twins — same shape, same size. <strong>Similar<\/strong> shapes are like a photo and its enlargement — same shape, different size, but every dimension scaled by the same factor.<\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 37%\" />\n<col style=\"width: 34%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Characteristic<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Congruency (<\/strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>≅<\/mo><\/semantics><\/math><strong>)<\/strong><\/th>\n<th><strong>Similarity (<\/strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>∼<\/mo><\/semantics><\/math><strong>)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Shape<\/td>\n<td style=\"text-align: left;\">Exactly the same<\/td>\n<td>Exactly the same<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Size<\/td>\n<td style=\"text-align: left;\">Equal<\/td>\n<td>Different (scaled)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Corresponding angles<\/td>\n<td style=\"text-align: left;\">Equal<\/td>\n<td>Equal<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Corresponding sides<\/td>\n<td style=\"text-align: left;\">Equal in length<\/td>\n<td>Proportional (equal <em>ratio<\/em>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Congruent shapes are identical twins — same shape, same size. Similar shapes are like a photo and its enlargement — same shape, different size, but every dimension scaled by the same factor. Characteristic Congruency ( ≅ ) Similarity ( ∼ ) Shape Exactly the same Exactly the same Size Equal Different (scaled) Corresponding angles Equal Equal Corresponding sides Equal in length Proportional (equal ratio )","min":2,"ex":false},{"id":"9-c3-s2","title":"Conditions for Triangle Congruence","html":"\n<p>You don’t need to check <em>all six<\/em> measurements (3 sides + 3 angles) to prove two triangles are congruent — these shortcuts are enough:<\/p>\n<ul>\n<li><strong>SSS<\/strong> (Side-Side-Side): all three pairs of sides match<\/li>\n<li><strong>SAS<\/strong> (Side-Angle-Side): two sides match, <em>and<\/em> the angle between them matches<\/li>\n<li><strong>ASA<\/strong> (Angle-Side-Angle): two angles match, <em>and<\/em> the side between them matches<\/li>\n<li><strong>AAS<\/strong> (Angle-Angle-Side): two angles match, and a side next to them (not between them) matches<\/li>\n<\/ul>\n","text":"You don’t need to check all six measurements (3 sides + 3 angles) to prove two triangles are congruent — these shortcuts are enough: SSS (Side-Side-Side): all three pairs of sides match SAS (Side-Angle-Side): two sides match, and the angle between them matches ASA (Angle-Side-Angle): two angles match, and the side between them matches AAS (Angle-Angle-Side): two angles match, and a side next to them (not between them) matches","min":2,"ex":false},{"id":"9-c3-s3","title":"Conditions for Triangle Similarity","html":"\n<ul>\n<li><strong>AA<\/strong> (Angle-Angle): two pairs of angles match (the third automatically matches too, since angles sum to 180°)<\/li>\n<li><strong>SSS<\/strong> (proportional): all three side ratios are equal<\/li>\n<li><strong>SAS<\/strong> (proportional): two side ratios are equal, and the angle between them matches<\/li>\n<\/ul>\n","text":"AA (Angle-Angle): two pairs of angles match (the third automatically matches too, since angles sum to 180°) SSS (proportional): all three side ratios are equal SAS (proportional): two side ratios are equal, and the angle between them matches","min":2,"ex":false},{"id":"9-c3-s4","title":"Three Powerful Similarity Formulas","html":"\n<p><strong>A. Triangle Within a Triangle (parallel line cuts a triangle):<\/strong> if <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D<\/mi><mi>E<\/mi><mo>∥<\/mo><mi>B<\/mi><mi>C<\/mi><\/mrow><\/semantics><\/math> inside triangle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mi>C<\/mi><\/mrow><\/semantics><\/math>, then triangle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><mi>E<\/mi><mo>∼<\/mo><\/mrow><\/semantics><\/math> triangle <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mi>C<\/mi><\/mrow><\/semantics><\/math>, giving:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mi>A<\/mi><mi>D<\/mi><\/mrow><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>A<\/mi><mi>E<\/mi><\/mrow><mrow><mi>A<\/mi><mi>C<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>D<\/mi><mi>E<\/mi><\/mrow><mrow><mi>B<\/mi><mi>C<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n<p><strong>B. Right Triangle Altitude Formula:<\/strong> in a right triangle with the altitude drawn to the hypotenuse, three similar triangles are created, giving:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><msup><mi>D<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mi>B<\/mi><mi>D<\/mi><mo>×<\/mo><mi>C<\/mi><mi>D<\/mi><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mi>A<\/mi><msup><mi>B<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mi>B<\/mi><mi>D<\/mi><mo>×<\/mo><mi>B<\/mi><mi>C<\/mi><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mi>A<\/mi><msup><mi>C<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mi>C<\/mi><mi>D<\/mi><mo>×<\/mo><mi>C<\/mi><mi>B<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p><strong>C. Trapezoid (“Belt”) Formula:<\/strong> for a trapezoid with a segment <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mi>F<\/mi><\/mrow><\/semantics><\/math> parallel to both bases:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mi>E<\/mi><mo>×<\/mo><mi>C<\/mi><mi>D<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>E<\/mi><mi>D<\/mi><mo>×<\/mo><mi>A<\/mi><mi>B<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>A<\/mi><mi>E<\/mi><mo>+<\/mo><mi>E<\/mi><mi>D<\/mi><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n","text":"A. Triangle Within a Triangle (parallel line cuts a triangle): if D E ∥ B C inside triangle A B C , then triangle A D E ∼ triangle A B C , giving: A D A B = A E A C = D E B C B. Right Triangle Altitude Formula: in a right triangle with the altitude drawn to the hypotenuse, three similar triangles are created, giving: A D 2 = B D × C D A B 2 = B D × B C A C 2 = C D × C B C. Trapezoid (“Belt”) Formula: for a trapezoid with a segment E F parallel to both bases: E F = ( A E × C D ) + ( E D × A B ) A E + E D","min":2,"ex":false},{"id":"9-c3-s5","title":"Worke mn>36<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Square root<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — the trapezoid “belt” formula, real-world framing):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A trapezoid-shaped plot of land <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mi>C<\/mi><mi>D<\/mi><\/mrow><\/semantics><\/math> has a fence <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mi>F<\/mi><\/mrow><\/semantics><\/math> running parallel to both parallel sides, connecting points <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E<\/mi><\/semantics><\/math> (on side <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>D<\/mi><\/mrow><\/semantics><\/math>) and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F<\/mi><\/semantics><\/math> (on side <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mi>C<\/mi><\/mrow><\/semantics><\/math>). Given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>E<\/mi><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math> m, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E<\/mi><mi>D<\/mi><mo>=<\/mo><mn>4<\/mn>
