+<\/mo><mn>10<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math> and the other is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 53%\" />\n<col style=\"width: 30%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Set up the equation: supplementary angles sum to 180°<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>10<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>3<\/mn><mi>x<\/mi><mo>=<\/mo><mn>180<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Combine like terms<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>10<\/mn><mo>=<\/mo><mn>180<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Subtract 10 from both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>=<\/mo><mn>170<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Divide both sides by 5<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>34<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>34<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — triangle angle sum, multi-step):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> In a triangle, the second angle is twice the first angle, and the third angle is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math> more than the second angle. Find all three angles.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 51%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Let the first angle = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>. Second = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/semantics><\/math>. Third = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>20<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">variables defined<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Set up the equation: all three sum to 180°<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>20<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>180<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Combine like terms<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>20<\/mn><mo>=<\/mo><mn>180<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Subtract 20, then divide by 5<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>32<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The angles are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>32<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>64<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>84<\/mn><msup><mi><\/mi><mo>∘<\/mo><\/msup><\/mrow><\/semantics><\/math>. <em>(Check:<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>32<\/mn><mo>+<\/mo><mn>64<\/mn><mo>+<\/mo><mn>84<\/mn><mo>=<\/mo><mn>180<\/mn><\/mrow><\/semantics><\/math> <em>✓)<\/em><\/p>\n","text":"Example 1 (Warm-up — complementary): Question: Two angles are complementary. One of them is 37 ∘ . Find the other. Solution: 90 ∘ − 37 ∘ = 53 ∘ Answer: 53° Example 2 (Supplementary, algebraic): Question: Two angles are supplementary. One angle is 2 x + 10 ∘ and the other is 3 x ∘ . Find x . Step Action Result 1 Set up the equation: supplementary angles sum to 180° ( 2 x + 10 ) + 3 x = 180 2 Combine like terms 5 x + 10 = 180 3 Subtract 10 from both sides 5 x = 170 4 Divide both sides by 5 x = 34 Answer: x = 34 Example 3 (HOTS — triangle angle sum, multi-step): Question: In a triangle, the second angle is twice the first angle, and the third angle is 20 ∘ more than the second angle. Find all three angles. Solution: Step What to Do Result 1 Let the first angle = x . Second = 2 x . Third = 2 x + 20 variables defined 2 Set up the equation: all three sum to 180° x + 2 x + ( 2 x + 20 ) = 180 3 Combine like terms 5 x + 20 = 180 4 Subtract 20, then divide by 5 x = 32 Answer: The angles are 32 ∘ , 64 ∘ , and 84 ∘ . (Check: 32 + 64 + 84 = 180 ✓)","min":2,"ex":true},{"id":"8-c2-s6","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Mixing up complementary (90°) and supplementary (180°).<\/strong> If unsure, remember: “S” for Supplementary and “S” for Straight (180°) go together.<\/li>\n<li><strong>Forgetting a triangle’s angles must sum to exactly 180°<\/strong>, and trying to solve triangle problems using 90° or 360° instead.<\/li>\n<li><strong>Reading reflex angles as regular angles<\/strong> — always check if the angle marked in a diagram is the “inside” or “outside” opening.<\/li>\n<\/ul>\n","text":"Mixing up complementary (90°) and supplementary (180°). If unsure, remember: “S” for Supplementary and “S” for Straight (180°) go together. Forgetting a triangle’s angles must sum to exactly 180° , and trying to solve triangle problems using 90° or 360° instead. Reading reflex angles as regular angles — always check if the angle marked in a diagram is the “inside” or “outside” opening.","min":2,"ex":false},{"id":"8-c2-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Two complementary angles; one is 37°. The other is… Supplementary angles (2x+10)° and (3x)°. Find x. Triangle angles are x, 2x and 2x + 20. The largest angle is… An obtuse angle is…","min":2,"ex":false,"quiz":true}]},{"id":"8-c3","title":"Probability","raw":"3. Probability","sections":[{"id":"8-c3-s1","title":"The Core Formula","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>E<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>E<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> is the number of favorable outcomes (what you want), and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> is the total number of possible outcomes (everything that could happen).<\/p>\n<p><strong>Analogy:<\/strong> if a raffle box has 50 tickets and you hold 3 of them, your probability of winning is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>3<\/mn><mn>50<\/mn><\/mfrac><\/semantics><\/math> — favorable outcomes (your tickets) over total possible outcomes (all tickets).<\/p>\n","text":"P ( A ) = n ( E ) n ( S ) where n ( E ) is the number of favorable outcomes (what you want), and n ( S ) is the total number of possible outcomes (everything that could happen). Analogy: if a raffle box has 50 tickets and you hold 3 of them, your probability of winning is 3 50 — favorable outcomes (your tickets) over total possible outcomes (all tickets).","min":2,"ex":false},{"id":"8-c3-s2","title":"Key Vocabulary","html":"\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Term<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Experiment<\/strong><\/td>\n<td style=\"text-align: left;\">An action with a random outcome (rolling a die, tossing a coin)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Sample Space (S)<\/strong><\/td>\n<td style=\"text-align: left;\">The set of <em>all<\/em> possible outcomes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Sample Point<\/strong><\/td>\n<td style=\"text-align: left;\">One single outcome within the sample space<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Event (A)<\/strong><\/td>\n<td style=\"text-align: left;\">The specific outcome(s) you’re interested in — a subset of S<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"Term Meaning Experiment An action with a random outcome (rolling a die, tossing a coin) Sample Space (S) The set of all possible outcomes Sample Point One single outcome within the sample space Event (A) The specific outcome(s) you’re interested in — a subset of S","min":2,"ex":false},{"id":"8-c3-s3","title":"Two Visual Methods for Finding the Sample Space","html":"\n<p><strong>Method A — Table (best for two dice):<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 13%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Die 1  Die 2<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>1<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>2<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>3<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>4<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>5<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>6<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>1<\/strong><\/td>\n<td style=\"text-align: left;\">(1,1)<\/td>\n<td style=\"text-align: left;\">(1,2)<\/td>\n<td style=\"text-align: left;\">(1,3)<\/td>\n<td style=\"text-align: left;\">(1,4)<\/td>\n<td style=\"text-align: left;\">(1,5)<\/td>\n<td style=\"text-align: left;\">(1,6)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>2<\/strong><\/td>\n<td style=\"text-align: left;\">(2,1)<\/td>\n<td style=\"text-align: left;\">(2,2)<\/td>\n<td style=\"text-align: left;\">(2,3)<\/td>\n<td style=\"text-align: left;\">(2,4)<\/td>\n<td style=\"text-align: left;\">(2,5)<\/td>\n<td style=\"text-align: left;\">(2,6)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>3<\/strong><\/td>\n<td style=\"text-align: left;\">(3,1)<\/td>\n<td style=\"text-align: left;\">(3,2)<\/td>\n<td style=\"text-align: left;\">(3,3)<\/td>\n<td style=\"text-align: left;\">(3,4)<\/td>\n<td style=\"text-align: left;\">(3,5)<\/td>\n<td style=\"text-align: left;\">(3,6)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>(…continuing through row 6.)<\/em> This gives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>6<\/mn><mo>×<\/mo><mn>6<\/mn><mo>=<\/mo><mn>36<\/mn><\/mrow><\/semantics><\/math> total outcomes.<\/p>\n<p><strong>Method B — Tree Diagram (best for coins):<\/strong><\/p>\n<pre><code>[DIAGRAM: Tree diagram for 2 coins]\n                Start\n              /       \\\n          Coin1=H    Coin1=T\n           /   \\       /   \\\n        H,H    H,T   T,H   T,T<\/code><\/pre>\n<p>This gives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n","text":"Method A — Table (best for two dice): Die 1 Die 2 1 2 3 4 5 6 1 (1,1) (1,2) (1,3) (1,4) (1,5) (1,6) 2 (2,1) (2,2) (2,3) (2,4) (2,5) (2,6) 3 (3,1) (3,2) (3,3) (3,4) (3,5) (3,6) (…continuing through row 6.) This gives n ( S ) = 6 × 6 = 36 total outcomes. Method B — Tree Diagram (best for coins): [DIAGRAM: Tree diagram for 2 coins] Start / \\ Coin1=H Coin1=T / \\ / \\ H,H H,T T,H T,T This gives n ( S ) = 4 .","min":2,"ex":false},{"id":"8-c3-s4","title":"Worked Examples — Probability (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A die is rolled once. Find the probability of rolling a number greater than 4.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 48%\" />\n<col style=\"width: 37%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">List favorable outcomes: numbers greater than 4 on a die are {5, 6}<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>E<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Total outcomes on a die<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Apply the formula<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mn>2<\/mn><mn>6<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Two dice, using the table):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Two dice are rolled. Find the probability that the sum is 7.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 11%\" />\n<col style=\"width: 47%\" />\n<col style=\"width: 38%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Using the table, find all pairs summing to 7: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>E<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Total sample space<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>36<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Apply the formula<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mn>6<\/mn><mn>36<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/semantics><\/math><\/p>\n<p><strong>Example 3 (HOTS — complementary event):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A bag has 4 red, 5 blue, and 3 green marbles. Find the probability of picking a marble that is <strong>not<\/strong> green.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Find total marbles: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mo>+<\/mo><mn>5<\/mn><mo>+<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>12<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">“Not green” = red or blue: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mo>+<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>E<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>9<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Apply the formula: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mn>9<\/mn><mn>12<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">simplify<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Simplify the fraction (GCD = 3)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/semantics><\/math> <em>(Faster alternative method:<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mtext mathvariant=\"normal\">green<\/mtext><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mfrac><mn>3<\/mn><mn>12<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mrow><\/semantics><\/math><em>, so<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mtext mathvariant=\"normal\">not green<\/mtext><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mrow><\/semantics><\/math> <em>— the complement rule from Section on set theory:<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><msup><mi>A<\/mi><mi>c<\/mi><\/msup><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mi>P<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>A<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><em>.)<\/em><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — 1 coin + 1 die combined sample space):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A coin is tossed and a die is rolled at the same time. Find the probability of getting Heads <strong>and<\/strong> a number greater than 4.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Total sample space: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">12<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Favorable: Heads paired with {5 or 6} → (H,5), (H,6)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>E<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Apply the formula: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mn>2<\/mn><mn>12<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">simplify<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Simplify (GCD = 2)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/semantics><\/math><\/p>\n","text":"Example 1 (Warm-up): Question: A die is rolled once. Find the probability of rolling a number greater than 4. Step Action Result 1 List favorable outcomes: numbers greater than 4 on a die are {5, 6} n ( E ) = 2 2 Total outcomes on a die n ( S ) = 6 3 Apply the formula P = 2 6 = 1 3 Answer: 1 3 Example 2 (Two dice, using the table): Question: Two dice are rolled. Find the probability that the sum is 7. Step Action Result 1 Using the table, find all pairs summing to 7: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) n ( E ) = 6 2 Total sample space n ( S ) = 36 3 Apply the formula P = 6 36 = 1 6 Answer: 1 6 Example 3 (HOTS — complementary event): Question: A bag has 4 red, 5 blue, and 3 green marbles. Find the probability of picking a marble that is not green. Solution: Step What to Do Result 1 Find total marbles: 4 + 5 + 3 n ( S ) = 12 2 “Not green” = red or blue: 4 + 5 n ( E ) = 9 3 Apply the formula: P = 9 12 simplify 4 Simplify the fraction (GCD = 3) P = 3 4 Answer: 3 4 (Faster alternative method: P ( green ) = 3 12 = 1 4 , so P ( not green ) = 1 − 1 4 = 3 4 — the complement rule from Section on set theory: P ( A c ) = 1 − P ( A ) .) Example 4 (Pure analogical, above HOTS — 1 coin + 1 die combined sample space): Question: A coin is tossed and a die is rolled at the same time. Find the probability of getting Heads and a number greater than 4. Solution: Step What to Do Result 1 Total sample space: n ( S ) = 2 × 6 12 2 Favorable: Heads paired with {5 or 6} → (H,5), (H,6) n ( E ) = 2 3 Apply the formula: P = 2 12 simplify 4 Simplify (GCD = 2) P = 1 6 Answer: 1 6","min":2,"ex":true},{"id":"8-c3-s5","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Forgetting to find the <em>total<\/em> sample space correctly<\/strong> — for 2 dice, it’s 36, not 12 or 6; always use the multi-stage formula <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>S<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mo>×<\/mo><msub><mi>n<\/mi><mn>2<\/mn><\/msub><mo>×<\/mo><mi>…<\/mi><\/mrow><\/semantics><\/math><\/li>\n<li><strong>Not simplifying the final probability fraction.<\/strong><\/li>\n<li><strong>Confusing “and” with “or.”<\/strong> “And” (both things happening) usually means <em>multiplying<\/em> possibilities into the sample space; “or” usually means <em>combining<\/em> favorable outcomes (like Example 3’s “not green”).<\/li>\n<\/ul>\n","text":"Forgetting to find the total sample space correctly — for 2 dice, it’s 36, not 12 or 6; always use the multi-stage formula n ( S ) = n 1 × n 2 × … Not simplifying the final probability fraction. Confusing “and” with “or.” “And” (both things happening) usually means multiplying possibilities into the sample space; “or” usually means combining favorable outcomes (like Example 3’s “not green”).","min":2,"ex":false},{"id":"8-c3-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"A die is rolled. P(number greater than 4) = ? Two dice are rolled. P(sum = 7) = ? A bag has 4 red, 5 blue, 3 green marbles. P(not green) = ? A coin is tossed and a die rolled. How many outcomes in the sample space?","min":2,"ex":false,"quiz":true}]},{"id":"8-c4","title":"Data","raw":"4. Data","sections":[{"id":"8-c4-s1","title":"Mean (Average)","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Mean<\/mtext><mo>=<\/mo><mfrac><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>+<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>+<\/mo><mi>…<\/mi><mo>+<\/mo><msub><mi>x<\/mi><mi>n<\/mi><\/msub><\/mrow><mi>n<\/mi><\/mfrac><\/mrow><\/semantics><\/math><\/p>\n<p>Add up every value, then divide by how many values there are.<\/p>\n","text":"Mean = x 1 + x 2 + x 3 + … + x n n Add up every value, then divide by how many values there are.","min":2,"ex":false},{"id":"8-c4-s2","title":"Mode","html":"\n<p>The <strong>mode<\/strong> is the value that appears most often. A dataset can have no mode (all values unique), one mode, or several modes.<\/p>\n","text":"The mode is the value that appears most often. A dataset can have no mode (all values unique), one mode, or several modes.","min":2,"ex":false},{"id":"8-c4-s3","title":"Median","html":"\n<p>The <strong>median<\/strong> is the middle value once the data is arranged in order.<\/p>\n<ul>\n<li>If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> is <strong>odd<\/strong>, the median is the exact middle number.<\/li>\n<li>If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n<\/mi><\/semantics><\/math> is <strong>even<\/strong>, the median is the <em>average<\/em> of the two middle numbers.<\/li>\n<\/ul>\n","text":"The median is the middle value once the data is arranged in order. If n is odd , the median is the exact middle number. If n is even , the median is the average of the two middle numbers.","min":2,"ex":false},{"id":"8-c4-s4","title":"Worked Examples — Data (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — mean):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the mean of: 4, 8, 6, 10, 7<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Add all values: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mo>+<\/mo><mn>8<\/mn><mo>+<\/mo><mn>6<\/mn><mo>+<\/mo><mn>10<\/mn><mo>+<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>35<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Divide by the count of values (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math>)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>35<\/mn><mo>÷<\/mo><mn>5<\/mn><mo>=<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Mean = <strong>7<\/strong><\/p>\n<p><strong>Example 2 (Median, even count):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Find the median of: 3, 9, 5, 1, 8, 7<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Arrange in order: 1, 3, 5, 7, 8, 9<\/td>\n<td style=\"text-align: left;\">sorted<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math> (even), so average the two middle values: 5 and 7<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>5<\/mn><mo>+<\/mo><mn>7<\/mn><\/mrow><mn>2<\/mn><\/mfrac><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> Median = <strong>6<\/strong><\/p>\n<p><strong>Example 3 (HOTS — reconstructing a missing value from the mean):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> The mean of 5 test scores is 80. Four of the scores are 75, 82, 90, and 78. Find the fifth score.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Total of all 5 scores must be: mean × count = <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>80<\/mn><mo>×<\/mo><mn>5<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>400<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Sum of the 4 known scores: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>75<\/mn><mo>+<\/mo><mn>82<\/mn><mo>+<\/mo><mn>90<\/mn><mo>+<\/mo><mn>78<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>325<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Fifth score = total − known sum: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400<\/mn><mo>−<\/mo><mn>325<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>75<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The fifth score is <strong>75<\/strong>.<\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — mean shift reasoning):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A class of 20 students has a mean score of 70. A new student joins, and the class mean becomes 71. What was the new student’s score?<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Original total: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>70<\/mn><mo>×<\/mo><mn>20<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>1400<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">New total (21 students, mean 71): <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>71<\/mn><mo>×<\/mo><mn>21<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>1491<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">New student’s score = new total − original total: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1491<\/mn><mo>−<\/mo><mn>1400<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>91<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The new student scored <strong>91<\/strong>.<\/p>\n","text":"Example 1 (Warm-up — mean): Question: Find the mean of: 4, 8, 6, 10, 7 Step Action Result 1 Add all values: 4 + 8 + 6 + 10 + 7 35 2 Divide by the count of values ( n = 5 ) 35 ÷ 5 = 7 Answer: Mean = 7 Example 2 (Median, even count): Question: Find the median of: 3, 9, 5, 1, 8, 7 Step Action Result 1 Arrange in order: 1, 3, 5, 7, 8, 9 sorted 2 n = 6 (even), so average the two middle values: 5 and 7 5 + 7 2 Answer: Median = 6 Example 3 (HOTS — reconstructing a missing value from the mean): Question: The mean of 5 test scores is 80. Four of the scores are 75, 82, 90, and 78. Find the fifth score. Solution: Step What to Do Result 1 Total of all 5 scores must be: mean × count = 80 × 5 400 2 Sum of the 4 known scores: 75 + 82 + 90 + 78 325 3 Fifth score = total − known sum: 400 − 325 75 Answer: The fifth score is 75 . Example 4 (Pure analogical, above HOTS — mean shift reasoning): Question: A class of 20 students has a mean score of 70. A new student joins, and the class mean becomes 71. What was the new student’s score? Solution: Step What to Do Result 1 Original total: 70 × 20 1400 2 New total (21 students, mean 71): 71 × 21 1491 3 New student’s score = new total − original total: 1491 − 1400 91 Answer: The new student scored 91 .","min":2,"ex":true},{"id":"8-c4-s5","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Forgetting to sort the data before finding the median.<\/strong> The median only works correctly on <em>ordered<\/em> data.<\/li>\n<li><strong>For an even count, forgetting to average the two middle numbers<\/strong> — writing down one of them alone instead.<\/li>\n<li><strong>Using “sum ÷ count” backwards<\/strong> — remember mean × count = total, which is the key trick for reverse-engineering missing values (Examples 3 &amp; 4).<\/li>\n<\/ul>\n","text":"Forgetting to sort the data before finding the median. The median only works correctly on ordered data. For an even count, forgetting to average the two middle numbers — writing down one of them alone instead. Using “sum ÷ count” backwards — remember mean × count = total, which is the key trick for reverse-engineering missing values (Examples 3 & 4).","min":2,"ex":false},{"id":"8-c4-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"Mean of 4, 8, 6, 10, 7? Median of 3, 9, 5, 1, 8, 7? The mean of 5 scores is 80. Four are 75, 82, 90, 78. The fifth is… The mode is…","min":2,"ex":false,"quiz":true}]},{"id":"8-c5","title":"Function","raw":"5. Function","sections":[{"id":"8-c5-s1","title":"What Is a Function?","html":"\n<p>A <strong>function<\/strong> is a special kind of relationship: every input (from the <strong>domain<\/strong>) connects to <em>exactly one<\/em> output (in the <strong>range<\/strong>). Think of a function like a vending machine: press button “B4” (input), and you <em>always<\/em> get the same specific snack (output) — never two different snacks from the same button, and never nothing at all.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mi>a<\/mi><mi>x<\/mi><mo>+<\/mo><mi>b<\/mi><\/mrow><\/semantics><\/math><\/p>\n<p>To <strong>evaluate<\/strong> a function, substitute the given input in place of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>.<\/p>\n<p><strong>Worked Example:<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>, find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>8<\/mn><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>11<\/mn><\/mrow><\/semantics><\/math><\/p>\n","text":"A function is a special kind of relationship: every input (from the domain ) connects to exactly one output (in the range ). Think of a function like a vending machine: press button “B4” (input), and you always get the same specific snack (output) — never two different snacks from the same button, and never nothing at all. f ( x ) = a x + b To evaluate a function, substitute the given input in place of x . Worked Example: Question: Given f ( x ) = 2 x + 3 , find f ( 4 ) . Solution: f ( 4 ) = 2 ( 4 ) + 3 = 8 + 3 = 11","min":2,"ex":false},{"id":"8-c5-s2","title":"Domain, Codomain, and Range — Three Related but Different Ideas","html":"\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Term<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Domain<\/strong><\/td>\n<td style=\"text-align: left;\">The full set of allowed inputs (Set A)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Codomain<\/strong><\/td>\n<td style=\"text-align: left;\">The full set that outputs are <em>allowed<\/em> to land in (Set B)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Range<\/strong><\/td>\n<td style=\"text-align: left;\">The set of outputs that <em>actually<\/em> get used<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Analogy:<\/strong> think of the codomain as an entire parking garage (every possible parking spot), while the range is only the spots that actually have a car in them right now. The range is always a part of the codomain, but not necessarily <em>all<\/em> of it.<\/p>\n","text":"Term Meaning Domain The full set of allowed inputs (Set A) Codomain The full set that outputs are allowed to land in (Set B) Range The set of outputs that actually get used Analogy: think of the codomain as an entire parking garage (every possible parking spot), while the range is only the spots that actually have a car in them right now. The range is always a part of the codomain, but not necessarily all of it.","min":2,"ex":false},{"id":"8-c5-s3","title":"Three Ways to Represent a Function","html":"\n<p>A function can be shown in any of these equivalent forms — the same relationship, three different “views”:<\/p>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Representation<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What It Looks Like<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Arrow Diagram<\/strong><\/td>\n<td style=\"text-align: left;\">Two ovals (Set A, Set B) with arrows drawn from each input directly to its output<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Cartesian Graph<\/strong><\/td>\n<td style=\"text-align: left;\">Input/output pairs plotted as points on an <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math>–<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y<\/mi><\/semantics><\/math> grid<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Ordered Pairs<\/strong><\/td>\n<td style=\"text-align: left;\">A simple list, like <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo>,<\/mo><mn>5<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>,<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>,<\/mo><mn>7<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>,<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo>,<\/mo><mn>9<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","text":"A function can be shown in any of these equivalent forms — the same relationship, three different “views”: Representation What It Looks Like Arrow Diagram Two ovals (Set A, Set B) with arrows drawn from each input directly to its output Cartesian Graph Input/output pairs plotted as points on an x – y grid Ordered Pairs A simple list, like ( 1 , 5 ) , ( 2 , 7 ) , ( 3 , 9 )","min":2,"ex":false},{"id":"8-c5-s4","title":"Worked Examples — Function (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>5<\/mn><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math>, find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>5<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mn>15<\/mn><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mn>13<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <strong>13<\/strong><\/p>\n<p><strong>Example 2 (Building ordered pairs):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math>, find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, and write them as ordered pairs.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math><\/th>\n<th style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mo>−<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math><\/th>\n<th style=\"text-align: left;\"><strong>Ordered Pair<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>6<\/mn><mo>=<\/mo><mn>4<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>1<\/mn><mo>,<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>6<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mo>,<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>2<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>+<\/mo><mn>6<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mo>,<\/mo><mn>0<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Example 3 (HOTS — working backwards from the output):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>7<\/mn><\/mrow><\/semantics><\/math>, find the value of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> such that <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>20<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 56%\" />\n<col style=\"width: 26%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Set the function equal to 20: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>−<\/mo><mn>7<\/mn><mo>=<\/mo><mn>20<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">equation<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Add 7 to both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mi>x<\/mi><mo>=<\/mo><mn>27<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Divide both sides by 3<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>9<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>9<\/mn><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 4 (Pure analogical, above HOTS — real-world function modeling):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> A ride-hailing app charges a base fare of Rp8.000 plus Rp2.500 per km. Write this as a function <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> is the distance in km, then find the distance traveled if the total fare was Rp33.000.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong><\/p>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 53%\" />\n<col style=\"width: 31%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>What to Do<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Build the function: base + (rate × distance)<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2.500<\/mn><mi>x<\/mi><mo>+<\/mo><mn>8.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Set <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>33.000<\/mn><\/mrow><\/semantics><\/math>: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.500<\/mn><mi>x<\/mi><mo>+<\/mo><mn>8.000<\/mn><mo>=<\/mo><mn>33.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\">equation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Subtract 8.000 from both sides<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.500<\/mn><mi>x<\/mi><mo>=<\/mo><mn>25.000<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Divide both sides by 2.500<\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>10<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> The function is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>=<\/mo><mn>2.500<\/mn><mi>x<\/mi><mo>+<\/mo><mn>8.000<\/mn><\/mrow><\/semantics><\/math>, and the ride was <strong>10 km<\/strong>. <em>(Notice this is exactly the same structure as the Linear Equation topic — a function is really just a labeled way of writing<\/em> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>m<\/mi><mi>x<\/mi><mo>+<\/mo><mi>c<\/mi><\/mrow><\/semantics><\/math><em>.)<\/em><\/p>\n","text":"Example 1 (Warm-up): Question: Given f ( x ) = 5 x − 2 , find f ( 3 ) . Solution: f ( 3 ) = 5 ( 3 ) − 2 = 15 − 2 = 13 Answer: 13 Example 2 (Building ordered pairs): Question: Given f ( x ) = − 2 x + 6 , find f ( 1 ) , f ( 2 ) , and f ( 3 ) , and write them as ordered pairs. x f ( x ) = − 2 x + 6 Ordered Pair 1 − 2 ( 1 ) + 6 = 4 ( 1 , 4 ) 2 − 2 ( 2 ) + 6 = 2 ( 2 , 2 ) 3 − 2 ( 3 ) + 6 = 0 ( 3 , 0 ) Example 3 (HOTS — working backwards from the output): Question: Given f ( x ) = 3 x − 7 , find the value of x such that f ( x ) = 20 . Step Action Result 1 Set the function equal to 20: 3 x − 7 = 20 equation 2 Add 7 to both sides 3 x = 27 3 Divide both sides by 3 x = 9 Answer: x = 9 Example 4 (Pure analogical, above HOTS — real-world function modeling): Question: A ride-hailing app charges a base fare of Rp8.000 plus Rp2.500 per km. Write this as a function f ( x ) where x is the distance in km, then find the distance traveled if the total fare was Rp33.000. Solution: Step What to Do Result 1 Build the function: base + (rate × distance) f ( x ) = 2.500 x + 8.000 2 Set f ( x ) = 33.000 : 2.500 x + 8.000 = 33.000 equation 3 Subtract 8.000 from both sides 2.500 x = 25.000 4 Divide both sides by 2.500 x = 10 Answer: The function is f ( x ) = 2.500 x + 8.000 , and the ride was 10 km . (Notice this is exactly the same structure as the Linear Equation topic — a function is really just a labeled way of writing y = m x + c .)","min":2,"ex":true},{"id":"8-c5-s5","title":"Common Mistakes Box","html":"\n<ul>\n<li><strong>Substituting into the wrong spot.<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>4<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> means “replace every <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x<\/mi><\/semantics><\/math> with 4” — not “multiply the whole function by 4.”<\/li>\n<li><strong>Confusing domain and range.<\/strong> Domain = the <em>inputs<\/em> you’re allowed to put in; Range = the <em>outputs<\/em> that come out.<\/li>\n<li><strong>Forgetting a function must give exactly one output per input<\/strong> — if a rule gives two different outputs for the same input, it is <em>not<\/em> a function.<\/li>\n<\/ul>\n","text":"Substituting into the wrong spot. f ( 4 ) means “replace every x with 4” — not “multiply the whole function by 4.” Confusing domain and range. Domain = the inputs you’re allowed to put in; Range = the outputs that come out. Forgetting a function must give exactly one output per input — if a rule gives two different outputs for the same input, it is not a function.","min":2,"ex":false},{"id":"8-c5-sq","title":"Chapter Quiz (optional)","html":"<p><\/p>","text":"If f(x) = 2x + 3, then f(4) = ? If f(x) = 3x − 7, which x gives f(x) = 20? The domain of a function is… A relation is NOT a function when…","min":2,"ex":false,"quiz":true}]}]},{"id":"9","name":"Grade 9","sub":"Mathematics","chapters":[{"id":"9-c1","title":"Factoring in Algebra","raw":"1. Factoring in Algebra","sections":[{"id":"9-c1-s1","title":"What Does “Factoring” Actually Mean?","html":"\n<p>Factoring is <strong>multiplication in reverse<\/strong>. If multiplying <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> expands into <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math>, then factoring <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math> means finding your way back to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>. Think of it like un-mixing paint: multiplication <em>combines<\/em> things into one expression; factoring <em>pulls them back apart<\/em> into their original pieces.<\/p>\n","text":"Factoring is multiplication in reverse . If multiplying ( x + 3 ) ( x + 2 ) expands into x 2 + 5 x + 6 , then factoring x 2 + 5 x + 6 means finding your way back to ( x + 3 ) ( x + 2 ) . Think of it like un-mixing paint: multiplication combines things into one expression; factoring pulls them back apart into their original pieces.","min":2,"ex":false},{"id":"9-c1-s2","title":"Greatest Common Factor (GCF)","html":"\n<p>The simplest type: find the largest number/variable that divides every term evenly, and pull it out front.<\/p>\n<p><strong>Worked Example:<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mi>a<\/mi><mo>+<\/mo><mn>6<\/mn><mi>b<\/mi><mo>=<\/mo><mn>3<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>3<\/mn><mi>a<\/mi><mo>+<\/mo><mn>2<\/mn><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><em>(Both 9 and 6 share a factor of 3 — pull the 3 out front, and divide each term by it.)<\/em><\/p>\n","text":"The simplest type: find the largest number/variable that divides every term evenly, and pull it out front. Worked Example: 9 a + 6 b = 3 ( 3 a + 2 b ) (Both 9 and 6 share a factor of 3 — pull the 3 out front, and divide each term by it.)","min":2,"ex":false},{"id":"9-c1-s3","title":"Difference of Two Squares","html":"\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Why it works:<\/strong> expand <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>−<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math> using FOIL: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mi>a<\/mi><mi>b<\/mi><mo>−<\/mo><mi>a<\/mi><mi>b<\/mi><mo>−<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> — the two middle terms cancel out perfectly, which is exactly why this pattern only applies to <em>subtraction<\/em> between two perfect squares.<\/p>\n<p><strong>Worked Example:<\/strong><\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>9<\/mn><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mspace width=\"1.0em\"><\/mspace><mspace width=\"1.0em\"><\/mspace><mrow><mtext mathvariant=\"normal\">(since <\/mtext><mspace width=\"0.333em\"><\/mspace><\/mrow><mn>9<\/mn><mo>=<\/mo><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mtext mathvariant=\"normal\">)<\/mtext><\/mrow><\/semantics><\/math><\/p>\n","text":"a 2 − b 2 = ( a − b ) ( a + b ) Why it works: expand ( a − b ) ( a + b ) using FOIL: a 2 + a b − a b − b 2 = a 2 − b 2 — the two middle terms cancel out perfectly, which is exactly why this pattern only applies to subtraction between two perfect squares. Worked Example: x 2 − 9 = ( x − 3 ) ( x + 3 ) (since 9 = 3 2 )","min":2,"ex":false},{"id":"9-c1-s4","title":"Trinomials — Three Difficulty Levels","html":"\n<p><strong>Level 1 —<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math><strong>:<\/strong> Find two numbers that <strong>add<\/strong> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math> and <strong>multiply<\/strong> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c<\/mi><\/semantics><\/math>.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Factor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> Find two numbers that add to 5 and multiply to 6 → <strong>2 and 3<\/strong>.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Level 2 —<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>&gt;<\/mo><mn>1<\/mn><\/mrow><\/semantics><\/math><strong>:<\/strong> Multiply <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mi>c<\/mi><\/mrow><\/semantics><\/math>, find two numbers that add to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b<\/mi><\/semantics><\/math> and multiply to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mi>c<\/mi><\/mrow><\/semantics><\/math>, then divide by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a<\/mi><\/semantics><\/math> at the end.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Factor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>7<\/mn><mi>b<\/mi><mo>+<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<div class=\"tw\"><table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 51%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Step<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Action<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Result<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1<\/td>\n<td style=\"text-align: left;\">Multiply <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>×<\/mo><mi>c<\/mi><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>6<\/mn><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2<\/td>\n<td style=\"text-align: left;\">Find two numbers that add to 7 and multiply to 6 → 6 and 1<\/td>\n<td style=\"text-align: left;\">split the middle term<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3<\/td>\n<td style=\"text-align: left;\">Rewrite: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>b<\/mi><mo>+<\/mo><mn>6<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>b<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math>, then divide by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>b<\/mi><mo>+<\/mo><mn>6<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>b<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>÷<\/mo><mn>2<\/mn><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4<\/td>\n<td style=\"text-align: left;\">Divide one of the factors by 2: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>b<\/mi><mo>+<\/mo><mn>6<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>÷<\/mo><mn>2<\/mn><mo>=<\/mo><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>b<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<td style=\"text-align: left;\"><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>b<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>b<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>b<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>b<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Special Shortcut — Perfect Square Trinomials:<\/strong> Sometimes a trinomial is secretly a “same number twice” pattern in disguise. Watch for it — it saves you from the add/multiply search entirely:<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>2<\/mn><mi>a<\/mi><mi>b<\/mi><mo>+<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n<p><strong>How to spot it:<\/strong> check if the first and last terms are perfect squares, <em>and<\/em> the middle term equals <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>×<\/mo><msqrt><mtext mathvariant=\"normal\">first<\/mtext><\/msqrt><mo>×<\/mo><msqrt><mtext mathvariant=\"normal\">last<\/mtext><\/msqrt><\/mrow><\/semantics><\/math>.<\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Factor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>6<\/mn><mi>x<\/mi><mo>+<\/mo><mn>9<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mo>=<\/mo><msup><mn>3<\/mn><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>3<\/mn><\/mrow><\/semantics><\/math> — matches the pattern exactly.<\/p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>6<\/mn><mi>x<\/mi><mo>+<\/mo><mn>9<\/mn><mo>=<\/mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/semantics><\/math><\/p>\n","text":"Level 1 — a = 1 : Find two numbers that add to b and multiply to c . Question: Factor x 2 + 5 x + 6 . Solution: Find two numbers that add to 5 and multiply to 6 → 2 and 3 . x 2 + 5 x + 6 = ( x + 2 ) ( x + 3 ) Level 2 — a > 1 : Multiply a × c , find two numbers that add to b and multiply to a × c , then divide by a at the end. Question: Factor 2 b 2 + 7 b + 3 . Step Action Result 1 Multiply a × c = 2 × 3 6 2 Find two numbers that add to 7 and multiply to 6 → 6 and 1 split the middle term 3 Rewrite: ( 2 b + 6 ) ( 2 b + 1 ) , then divide by a = 2 ( 2 b + 6 ) ( 2 b + 1 ) ÷ 2 4 Divide one of the factors by 2: ( 2 b + 6 ) ÷ 2 = ( b + 3 ) ( b + 3 ) ( 2 b + 1 ) Answer: ( b + 3 ) ( 2 b + 1 ) Special Shortcut — Perfect Square Trinomials: Sometimes a trinomial is secretly a “same number twice” pattern in disguise. Watch for it — it saves you from the add/multiply search entirely: a 2 + 2 a b + b 2 = ( a + b ) 2 How to spot it: check if the first and last terms are perfect squares, and the middle term equals 2 × first × last . Question: Factor x 2 + 6 x + 9 . Solution: 9 = 3 2 and 6 = 2 × 3 — matches the pattern exactly. x 2 + 6 x + 9 = ( x + 3 ) 2","min":2,"ex":false},{"id":"9-c1-s5","title":"Worked Examples — Factoring (Easy → Pure Analogical)","html":"\n<p><strong>Example 1 (Warm-up — GCF):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Factor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mi>x<\/mi><mo>+<\/mo><mn>18<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> GCF of 12 and 18 is 6. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mi>x<\/mi><mo>+<\/mo><mn>18<\/mn><mo>=<\/mo><mn>6<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Answer:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mrow><mo stretchy=\"true\" form=\"prefix\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"true\" form=\"postfix\">)<\/mo><\/mrow><\/mrow><\/semantics><\/math><\/p>\n<p><strong>Example 2 (Difference of squares):<\/strong><\/p>\n<blockquote>\n<p><strong>Question:<\/strong> Factor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25<\/mn><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>16<\/mn><\/mrow><\/semantics><\/math>.<\/p>\n<\/blockquote>\n<p><strong>Solution:<\/strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><m
